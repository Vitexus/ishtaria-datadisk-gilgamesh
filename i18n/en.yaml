# Lore entries
lore.uruk.title: Uruk
lore.uruk: >
  The great city of Uruk, ruled by Gilgamesh. Its massive walls were built by the king himself,
  with the temple of Eanna for Anu and the temple of Ishtar as its crown jewels. The city
  that Gilgamesh built stands as a testament to his power and vision.

lore.gilgamesh.title: Gilgamesh
lore.gilgamesh: >
  Gilgamesh, king of Uruk, two-thirds god and one-third man. Created by the gods with perfect
  beauty and strength. He built the walls of Uruk and sought eternal life after the death of his
  beloved friend Enkidu. The world's first epic hero.

lore.enkidu.title: Enkidu
lore.enkidu: >
  Enkidu, the wild man created from clay by the goddess Aruru. He lived among beasts until
  civilized by the temple priestess Shamhat. He became Gilgamesh's equal and loyal companion,
  and together they faced the greatest challenges of the age.

lore.humbaba.title: Humbaba
lore.humbaba: >
  Humbaba, the guardian of the Cedar Forest. Appointed by Enlil to protect the sacred trees,
  he was a monstrous figure with sevenfold terrors. His roar was like the storm, his breath
  like fire, and his jaws were death itself. Defeated by Gilgamesh and Enkidu.

lore.ishtar.title: Ishtar
lore.ishtar: >
  Ishtar, goddess of love and war, patron of Uruk. Proud and passionate, she offers both
  ecstasy and destruction. When Gilgamesh refused her advances, she sent the Bull of Heaven
  to punish him, leading to tragic consequences.

lore.bull_of_heaven.title: Bull of Heaven
lore.bull_of_heaven: >
  The divine bull sent by Ishtar to punish Gilgamesh for rejecting her. A monstrous beast
  that brought destruction to Uruk. It was defeated by Gilgamesh and Enkidu, but its death
  brought the wrath of the gods upon them.

lore.great_flood.title: The Great Flood
lore.great_flood: >
  The great flood sent by the gods to destroy all life. Utnapishtim, warned by Ea, built
  a great ship and survived with his family and the animals. For this, the gods granted
  him eternal life. His story is told to Gilgamesh in the epic.

lore.utnapishtim.title: Utnapishtim
lore.utnapishtim: >
  Utnapishtim, the only survivor of the Great Flood. He and his wife were granted eternal
  life by the gods and now live across the Waters of Death. He teaches Gilgamesh the
  hard truth: that death is the fate of all men.

lore.mount_mashu.title: Mount Mashu
lore.mount_mashu: >
  Mount Mashu, the great mountain through which the sun passes each night. The Scorpion
  Man guards its gate, and through the tunnel one may reach the garden of the gods.

lore.cedar_forest.title: The Cedar Forest
lore.cedar_forest: >
  The Cedar Forest, a vast and ancient woodland stretching for ten thousand leagues in
  every direction. Home of Humbaba, the guardian appointed by Enlil. The trees
  are sacred, and none may cut them without facing the guardian's wrath.

# Mesopotamian Architecture Lore
lore.ziggurat_uruk.title: Ziggurat of Uruk
lore.ziggurat_uruk: >
  The great terrace of Uruk dedicated to Anu, sky god — a single high platform of mud
  brick and rammed earth, not a tower of many stages like the later ziggurat of Ur.
  From its court the White Temple crowns the city; the height alone makes it a landmark
  beyond the walls.

lore.ziggurat_anu.title: Ziggurat of Anu
lore.ziggurat_anu: >
  The Ziggurat of Anu rises about twelve metres above the plain: one massive terrace with
  a waterproof bitumen court and stairs climbing to the White Temple. Priests perform
  rituals here to honor the father of the gods and to watch the heavens from his height.

lore.ziggurat_ishtar.title: Ziggurat of Ishtar
lore.ziggurat_ishtar: >
  The Ziggurat of Ishtar, dedicated to the goddess of love and war. Unlike the single
  terrace of Anu, this stepped tower is adorned with lapis lazuli and carnelian, gifts
  from lovers and warriors seeking the goddess's favor. The temple at its summit is where
  Ishtar receives offerings and makes her judgments.

lore.ziggurat_ur.title: Great Ziggurat of Ur
lore.ziggurat_ur: >
  Etemenniguru, the house whose foundation creates terror — the three-stage tower of Nanna
  at Ur, sixty-four by forty-five metres at the base. Mud brick faced with baked brick in
  bitumen; three stairways climb the long front to the moon god's shrine.

lore.ziggurat_eridu.title: Ziggurat of Eridu
lore.ziggurat_eridu: >
  The raised house of Enki at Eridu, oldest of the cities of the King List. A low terrace
  of mud brick with a bitumen court, older in spirit than the tall stepped towers of later kings.

lore.ziggurat_nippur.title: Ziggurat of Nippur
lore.ziggurat_nippur: >
  The Ekur of Enlil at Nippur, the religious centre of Sumer. Its stepped mass rises about
  twenty-five metres above the plain — the mountain house where the great gods assemble.

lore.white_temple.title: White Temple
lore.white_temple: >
  The White Temple of Uruk, about twenty-two by seventeen metres, its whitewashed walls
  gleaming on the bitumen court of Anu's terrace. Built toward the cardinal axes of that
  platform, it was one of the most sacred sites in ancient Mesopotamia; its white colour
  symbolizes purity and the divine light of the sky god.

lore.great_wall_uruk.title: Great Wall of Uruk
lore.great_wall_uruk: >
  The mighty walls of Uruk, built by Gilgamesh himself. Two outer walls with
  inner walls between them, creating a nearly impregnable fortress. The walls
  feature towers, gatehouses, and massive gates that can withstand any assault.

lore.hanging_gardens.title: Hanging Gardens of Uruk
lore.hanging_gardens: >
  The legendary Hanging Gardens, said to have been built by Gilgamesh for his wife.
  Terraced gardens rising like a green mountain, with exotic plants and trees
  brought from distant lands. An engineering marvel of the ancient world.

