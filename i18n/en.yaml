# Ninsun Dialogues
ninsun.greet: "I am Ninsun, mother of Gilgamesh and wise goddess of Uruk. What seeks my son's friend?"
ninsun.ask_son: Ask about Gilgamesh
ninsun.ask_dream: Ask about the interpretation of dreams
ninsun.ask_enkidu: Ask about Enkidu
ninsun.ask_wisdom: Seek wisdom
ninsun.leave: I must go, wise mother.
ninsun.son: "My son Gilgamesh is strong and proud. Two-thirds god and one-third man, he was born to be a great king. But even kings need guidance from their mothers."
ninsun.protection: "I will ask the gods to protect you on your journey. May Shamash, the sun god, watch over you as you travel through dangerous lands."
ninsun.dream: "Dreams are the voice of the gods speaking to mortals. Bring me your dream, and I will reveal its meaning."
ninsun.enkidu_dream: "Ah, you dream of Enkidu? He is truly the equal of my son, the one who can temper Gilgamesh's proud heart."
ninsun.about_enkidu: "Enkidu is the one the gods created to match my son. Together, they have done great deeds and will do more."
ninsun.wisdom: "Wisdom comes from understanding both the strength of the gods and the fragility of men. Remember this on your travels."

