npc.crowd_grandmother: Grandmother
npc.crowd_grandmother.bio: "An elderly grandmother of Uruk with a cream shawl."
npc.crowd_boy_8: Boy
npc.crowd_boy_8.bio: "A boy of about eight racing through the lanes."
npc.crowd_girl_8: Girl
npc.crowd_girl_8.bio: "A girl of about eight, curious and quick."
npc.crowd_toddler_boy: Toddler
npc.crowd_toddler_boy.bio: "A small toddler toddling after the market noise."
npc.crowd_teen_girl: Teen girl
npc.crowd_teen_girl.bio: "A girl of about fourteen walking the streets."
npc.crowd_apprentice_boy: Apprentice
