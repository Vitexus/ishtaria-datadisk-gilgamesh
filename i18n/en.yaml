# The three tablets of the Atra-Hasis epic (places/atrahasis_tablets.yaml). The texts retell the epic in our own words.
place.atrahasis_tablet_1: Clay tablet of the Atra-Hasis epic (I)
place.atrahasis_tablet_2: Clay tablet of the Atra-Hasis epic (II)
place.atrahasis_tablet_3: Clay tablet of the Atra-Hasis epic (III)
achievement.three_tablets.title: "Keeper of the Three Tablets"
achievement.three_tablets.description: "Find and read all three clay tablets of the Atra-Hasis epic, in Eridu, Nippur and Shuruppak."
knowledge.atrahasis_tablet.credit: "Render of the datadisk's own model (CC BY-SA 4.0). Signs drawn with Noto Sans Cuneiform (SIL Open Font License)."
knowledge.atrahasis_tablet_1.title: "Atra-Hasis, tablet I: the gods on strike and the making of man"
knowledge.atrahasis_tablet_1.text: "\"When the gods were man\": the lesser gods bore the toil of digging the rivers and canals for forty years, then burned their tools and surrounded Enlil's house, the Ekur of Nippur, by night. Enki had the answer: let the birth goddess Mami make man of clay mixed with the flesh and blood of a slain god, to carry the gods' work. Enki trod the clay, fourteen birth goddesses shaped seven men and seven women, and in the tenth month mankind was born. The tablet goes on to the first plague: men grew many and loud, Enlil lost his sleep and sent Namtar; the king Atra-Hasis, advised by his god Enki, had the elders offer to Namtar alone, and the plague was lifted. The scribe Ku-Aya of Sippar copied the Old Babylonian text."
knowledge.atrahasis_tablet_2.title: "Atra-Hasis, tablet II: hunger and the oath"
knowledge.atrahasis_tablet_2.text: "Mankind multiplied again and Enlil, robbed of sleep a second time, had Adad withhold the rain. Atra-Hasis again went to Enki, and again the god gave way; so Enlil set guards over heaven, earth and the deep, and the drought grew hard. Enki still found a way to feed men with fish, until Enlil called the gods together and forbade any of them ever to save mankind again. Enki laughed at the warning; but Enlil's plan was ready: water, which had saved men, would drown them, and Enki was bound by oath to say nothing. This tablet is badly broken and its middle parts are guessed; the Ekur, where the epic begins, is in this city."
knowledge.atrahasis_tablet_3.title: "Atra-Hasis, tablet III: the flood"
knowledge.atrahasis_tablet_3.text: "Atra-Hasis dreamed, and Enki, held by his oath, spoke to the reed hut: \"Reed hut! Wall! Listen!\" Tear down the house, build a boat, coat it with pitch, take animals and birds and your family; in seven days the flood comes, and Enki set the water clock for the seventh night. Atra-Hasis told the elders that he must go to live with his god, held a feast that he could not eat, and entered the boat. For seven days and nights the storm of Adad drowned the earth; the gods went hungry without the canals and offerings, and Mami blamed Enlil and wore the lapis flies as a sign of mourning. After the flood Atra-Hasis made an offering, and Enlil, angry at Enki, was brought to let mankind live, if it were better ordered: among others, by women who bear no child. Atra-Hasis was a king of Shuruppak."

# The seven tablets of Enuma Elish (places/enuma_elish_tablets.yaml). The texts retell the epic in our own words.
place.enuma_elish_tablet_1: Clay tablet of Enuma Elish (I)
place.enuma_elish_tablet_2: Clay tablet of Enuma Elish (II)
place.enuma_elish_tablet_3: Clay tablet of Enuma Elish (III)
place.enuma_elish_tablet_4: Clay tablet of Enuma Elish (IV)
place.enuma_elish_tablet_5: Clay tablet of Enuma Elish (V)
place.enuma_elish_tablet_6: Clay tablet of Enuma Elish (VI)
place.enuma_elish_tablet_7: Clay tablet of Enuma Elish (VII)
achievement.seven_tablets.title: "Reciter of the Akitu"
achievement.seven_tablets.description: "Find and read all seven clay tablets of Enuma Elish, the epic the temples acted out at the New Year festival: in Eridu, Nippur, Kish, Babylon (twice), Uruk and Assur."
knowledge.enuma_elish_tablet.credit: "Render of the datadisk's own model (CC BY-SA 4.0). Signs drawn with Noto Sans Cuneiform (SIL Open Font License)."
knowledge.enuma_elish_tablet_1.title: "Enuma Elish, tablet I: Apsu, Tiamat and the birth of Marduk"
knowledge.enuma_elish_tablet_1.text: "\"When on high\" heaven and earth had no names, and only sweet Apsu and salt Tiamat lay mingled in one water. From them the gods were born, Lahmu and Lahamu, Anshar and Kishar, Anu, and Ea, wisest of all. The young gods were loud and Apsu could not rest; with his vizier Mummu he resolved to destroy them, though Tiamat asked why they should destroy what they had made. Ea learned of it, put Apsu to sleep with a spell and slew him, and made his house on the dead god's waters, as at Eridu. There Ea and Damkina begot Marduk. Tiamat, grieved, gathered monsters and gave Kingu the Tablet of Destinies."
knowledge.enuma_elish_tablet_2.title: "Enuma Elish, tablet II: the gods have no champion"
knowledge.enuma_elish_tablet_2.text: "Ea warned the gods that Tiamat was arming. Anshar sent Anu to speak with her, and Anu turned back; the elder gods found no one who dared. Then Anshar named Marduk, and Marduk agreed, but at a price: let the gods meet, and let his word decide the fates. This tablet is told at Nippur because the epic borrows the theology of Nippur: Marduk takes the place of Enlil, the king of the gods, and of his warrior son Ninurta. Most scholars date Enuma Elish to about the twelfth century BCE, long after the age of Gilgamesh."
knowledge.enuma_elish_tablet_3.title: "Enuma Elish, tablet III: the feast and the kingship"
knowledge.enuma_elish_tablet_3.text: "Anshar sent his vizier Gaga to Lahmu and Lahamu and to the elder gods with the news. They wept, then gathered, ate and drank until they were merry, and fixed the fate of Marduk. The Sumerians said kingship was first lowered from heaven at Eridu and, after the flood, at Kish; here the gods grant it to a younger god, so that he may fight for all of them."
knowledge.enuma_elish_tablet_4.title: "Enuma Elish, tablet IV: Marduk and Tiamat"
knowledge.enuma_elish_tablet_4.text: "The gods set a throne for Marduk and tested his word on a cloth: he spoke, and it vanished; he spoke again, and it was whole. \"Marduk is king!\" He took bow, mace and lightning, filled his body with flame, and spread a net held by the four winds, with seven more winds behind him. Tiamat and Marduk met in single combat; he drove the Evil Wind into her open mouth, and his arrow split her heart. He bound Kingu, took the Tablet of Destinies and sealed it on his own breast, and split Tiamat like a shellfish: one half became the roof of heaven."
knowledge.enuma_elish_tablet_5.title: "Enuma Elish, tablet V: the sky, the moon and the rivers"
knowledge.enuma_elish_tablet_5.text: "From Tiamat's body Marduk ordered the world. He set the stars in their constellations, three for each of the twelve months, and fixed the stations of Nebiru, of Enlil and of Ea. He made the moon rule the night, with horns to count the days of the month. From her eyes, in the tradition the epic follows, the Tigris and Euphrates flowed. This is the tablet least preserved. Uruk is the place for it: the scholars of Uruk kept the records of the sky that the epic says Marduk set in order."
knowledge.enuma_elish_tablet_6.title: "Enuma Elish, tablet VI: mankind and Babylon"
knowledge.enuma_elish_tablet_6.text: "Marduk, moved by what Ea put in his heart, would make mankind to serve the gods. The assembly asked who had made the war, and the answer was Kingu; he was bound, his blood was cut, and Ea made man from it and freed the gods from their toil. Marduk divided the gods into two hosts above and below, and the grateful gods built Babylon and, in it, Esagila, the house of Marduk, working a whole year at the bricks. They feasted, and Marduk was given his first names. This was the part sung at Akitu, the New Year festival, when the epic was recited in the temple and the god's image went out in procession."
knowledge.enuma_elish_tablet_7.title: "Enuma Elish, tablet VII: the fifty names"
knowledge.enuma_elish_tablet_7.text: "The last tablet gives Marduk the rest of his fifty names, the number of Enlil, and each name says something of the god: the one who planted the fields, who rules the storm, who judges. Even the old gods, Enlil, Ea and Adad, become aspects of Marduk. The earliest copies of the epic come from Assur, in the ninth century BCE, and there the Assyrians wrote the god Ashur in place of Marduk; the largest number of tablets came from the library of Nineveh. So the tablet that sang the glory of Babylon travelled to its rivals."

# The six tablets of Ishtar's Descent (places/ishtar_descent_tablets.yaml). The texts retell the legend in our own words.
place.ishtar_descent_tablet_1: Clay tablet of Ishtar's Descent (I)
place.ishtar_descent_tablet_2: Clay tablet of Ishtar's Descent (II)
place.ishtar_descent_tablet_3: Clay tablet of Ishtar's Descent (III)
place.ishtar_descent_tablet_4: Clay tablet of Ishtar's Descent (IV)
place.ishtar_descent_tablet_5: Clay tablet of Ishtar's Descent (V)
place.ishtar_descent_tablet_6: Clay tablet of Ishtar's Descent (VI)
achievement.descent_tablets.title: "Pilgrim of the Seven Gates"
achievement.descent_tablets.description: "Find and read all six clay tablets of Ishtar's Descent to the land of no return: in Uruk (three), Nippur, Ur and Eridu."
knowledge.ishtar_descent_tablet.credit: "Render of the datadisk's own model (CC BY-SA 4.0). Signs drawn with Noto Sans Cuneiform (SIL Open Font License). Retold after M. Jastrow's translation of 1915 (public domain) and a Danish translation of the Akkadian text."
knowledge.ishtar_descent_tablet_1.title: "Ishtar's Descent, tablet I: to the land of no return"
knowledge.ishtar_descent_tablet_1.text: "Ishtar, daughter of Sin, set her mind on the house of darkness, Irkalla's dwelling, the house from which no one who enters comes out, where dust is their food and clay their bread, where they see no light and are clothed like birds in a garment of wings. The Sumerian poem tells why: she left heaven and earth and her temples, Eanna of Uruk among them, to attend the funeral of Gugalanna, the husband of her sister Ereshkigal. Before she went she told her minister Ninshubur: if I do not return, mourn for me, drum in the shrines and go to the gods for help. At the gate Ishtar threatened to break the door and raise the dead to eat the living."
knowledge.ishtar_descent_tablet_2.title: "Ishtar's Descent, tablet II: the seven gates"
knowledge.ishtar_descent_tablet_2.text: "The gatekeeper took the news to Queen Ereshkigal, who turned green as a cut tamarisk and said: let her enter by the old rules. The keeper welcomed her: let Cuthah, the cult place of the plague god Nergal, greet you. At each of the seven gates the keeper took one piece of her finery: the great crown, the rings from her ears, the necklace, the breast ornament, the girdle of birthstones, the bracelets and anklets, and last her splendid robe. To each question he answered, \"Go in, lady, these are the rules of the queen of the underworld.\" Ishtar rushed at her sister, and Ereshkigal had Namtar loose sixty sicknesses upon her, in the eyes, the arms, the feet, the heart and the head. In the Sumerian poem the seven judges, the Anunnaki, pass sentence and her body is hung on a hook."
knowledge.ishtar_descent_tablet_3.title: "Ishtar's Descent, tablet III: Enlil refuses"
knowledge.ishtar_descent_tablet_3.text: "On the third day Ninshubur did as she was told: she mourned, drummed in the shrines and went to the gods. At Nippur, Enlil would not help: Inanna had longed for the greatness of the underworld, and what is taken there by the law of the dead is not to be sought. This tablet stands in Enlil's city. In the Akkadian version the same absence is felt on earth: since Ishtar went down, the bull does not mount the cow, the donkey does not cover the jenny, and no man approaches a woman in the street."
knowledge.ishtar_descent_tablet_4.title: "Ishtar's Descent, tablet IV: Nanna-Sin"
knowledge.ishtar_descent_tablet_4.text: "Ninshubur went on to Ur, to Nanna, the moon, Inanna's father, and he too would not help. In the Akkadian version the messenger of the gods, Papsukkal, went to Sin in mourning, his hair dirty, and wept before Ea the king: \"Ishtar has gone down to the underworld and has not come up.\" Man lies in his room, and woman lies alone. The gods have lost the one who keeps desire and birth in the world, and they must find a way to bring her back. This is the tablet of the city of the moon."
knowledge.ishtar_descent_tablet_5.title: "Ishtar's Descent, tablet V: the water of life"
knowledge.ishtar_descent_tablet_5.text: "In Eridu, Ea (Enki) was troubled, and from the dirt under his fingernails, in the Sumerian poem, he made two small beings, the kurgarra and the galatur, who carried the food and the water of life. In the Akkadian version he made a handsome young man, Asushunamir, and sent him down. In the Akkadian song he was told to ask for the khalziku, the water bag, to drink from it: a waterskin like the one every traveller carries. Ereshkigal struck her side, bit her finger and cursed him, for such a wish cannot be granted, and only then softened. In the Sumerian poem the two beings slipped in and wept with her in her pain, and she was moved. Namtar was ordered to knock at Egalgina, adorn the threshold with shells, set the Anunnaki on the golden throne and sprinkle Ishtar with the water of life. At each gate her ornaments were given back in reverse order, the crown last."
knowledge.ishtar_descent_tablet_6.title: "Ishtar's Descent, tablet VI: Tammuz"
knowledge.ishtar_descent_tablet_6.text: "But the underworld did not let her go for nothing: someone must take her place. In the Sumerian poem the galla, the demons, followed Ishtar up and seized whoever they met; she spared Ninshubur and her faithful singer, but at the apple tree they found Dumuzi, her husband, the shepherd king, seated in splendour instead of mourning. He called on the sun god Utu, took another shape and fled, but was caught; in the end his sister Geshtinanna shared his fate, so that he is below for half of each year. The Akkadian song turns to Tammuz: pour pure water over him, anoint him with oil, dress him in a festival garment and let the lapis flute sound. His sister Belili, who had filled her bosom with jewels, let them fall at his lament and cried, \"Do not let me perish! On the day Tammuz plays the lapis flute for me, let the dead rise and smell the incense.\" Dumuzi was worshipped at Uruk, near Kuara."

# Elders who tell the legends (dialogues/elder_tales_man.yaml, elder_tales_woman.yaml).
elder_tales_man.greet: "Sit, child, my legs are older than the wall of Uruk. \"When the gods were man,\" the old tale begins, and I know it as my father told it. Ask, and I will tell."
elder_tales_man.ask_men: "How were men made?"
elder_tales_man.men: "The lesser gods dug the canals for the great ones for forty years, then burned their tools and surrounded Enlil's house by night. Enki said: let the birth goddess Mami make man of clay and the blood of a slain god, to carry the gods' baskets. So we are clay and the blood of a god: that is why we think, and why we work."
elder_tales_man.ask_death: "Why do we die, and why are some women childless?"
elder_tales_man.death: "We were too many and too loud, and Enlil could not sleep. He sent plague, and wise Atra-Hasis offered only to the plague god, who was ashamed and let us be. He sent hunger, and again the god was ashamed. Then he sent the flood. When it had passed, Enki set our measure: some women bear no child, some are given to the temple, and none of us lives for ever."
elder_tales_man.ask_flood: "Tell me of the flood."
elder_tales_man.flood: "Enki could not warn Atra-Hasis, for he had sworn an oath to Enlil. So he spoke to the reed wall: \"Reed hut! Wall, listen to me! Tear down the house, build a boat.\" Atra-Hasis took his beasts and his people and shut the door. Seven days and nights the storm of Adad blew, and even the gods went hungry, for no one brought them bread. When you hear the wind in a reed hut, child, remember: the wall listens."
elder_tales_man.ask_akitu: "What is sung at the New Year?"
elder_tales_man.akitu: "At the New Year the whole city goes to the temple and the old song is acted out: \"When on high...\" Marduk spreads his net, the four winds hold it, the arrow splits Tiamat's heart, and from her body he makes the sky. We call his fifty names, the beer is free, the children sit on shoulders and even the king kneels before the god. It is the best day of the year."
elder_tales_man.ask_where: "Where are these tales written down?"
elder_tales_man.where: "The scribes put them on clay, and the tablets lie on brick benches in the old cities. The tale of Atra-Hasis is in Eridu, in Nippur and in Shuruppak. The New Year song is in seven places, from Eridu to Assur, and twice at Babylon. And the song of Ishtar below is in Uruk, Nippur, Ur and Eridu. Walk to them all and read them, and you will know what every grandfather knows."
elder_tales_man.leave: "Peace to you, old father."
elder_tales_woman.greet: "Come close to the fire, little one. I know the songs of Ishtar by heart, as my mother knew them before me. Ask, and I will sing."
elder_tales_woman.ask_gates: "Tell me how Ishtar went down."
elder_tales_woman.gates: "Ishtar, daughter of Sin, set her mind on the house of darkness, where dust is bread and the dead wear wings like birds. At the gate she cried: \"Open, or I will break the door and raise the dead to eat the living!\" Her sister Ereshkigal turned green as a cut tamarisk and said: \"Let her in by the old law.\" At each of seven gates the keeper took a piece of her: the crown, the earrings, the necklace, the breast ornament, the girdle of birthstones, the bracelets and last the robe. \"Go in, lady: such are the decrees of Ereshkigal.\" Above, the bull did not mount the cow, the ass did not approach the she-ass, and no man looked at a girl in the street, for who keeps desire in the world when Ishtar is under the earth?"
elder_tales_woman.ask_return: "How did she come back?"
elder_tales_woman.return: "Father Ea made a fair young man, Asushunamir, and sent him down to ask for the water bag, the khalziku, like the waterskin on your own shoulder. Ereshkigal cursed him first, then softened, and Namtar sprinkled Ishtar with the water of life. At each gate her finery was given back, the crown last. But mark it, child: no one leaves the house of darkness without leaving something."
elder_tales_woman.ask_dumuzi: "Who was left below in her place?"
elder_tales_woman.dumuzi: "Tammuz, the shepherd of her youth. Pour pure water on him, we sing, anoint him, dress him in red and let the lapis flute sound. His sister Belili let her jewels fall: \"Do not let me perish!\" And on the day Tammuz plays, the dead rise and smell the incense. That is why we weep for him every year, and why we feel him in the grain that goes under the earth."
elder_tales_woman.ask_akitu: "What is the New Year like?"
elder_tales_woman.akitu: "I carry a lamp in the procession of the god. They sing the song of Marduk and Tiamat in the temple, and it is as if the whole world were born again: the sky from her body, the rivers from her eyes. A day when everyone is kin, child. Like no other."
elder_tales_woman.ask_where: "Where are these songs written down?"
elder_tales_woman.where: "The scribes put them on clay, and the tablets lie on brick benches. The song of Ishtar below is in Uruk, three tablets, and in Nippur, Ur and Eridu. The tale of the flood is in Eridu, Nippur and Shuruppak; the New Year song in seven cities. Whoever reads them all has walked the seven gates."
elder_tales_woman.leave: "May the gods keep you, mother."

# Tablets of the legends (places/legend_tablets.yaml). The texts retell the legends in our own words.
place.gilgamesh_epic_tablet_1: "Clay tablet of the Epic of Gilgamesh (1)"
knowledge.gilgamesh_epic_tablet_1.title: "Epic of Gilgamesh, tablet I: the king and the wild man"
knowledge.gilgamesh_epic_tablet_1.text: "\"He who saw the Deep\" was Gilgamesh, king of Uruk, who knew all ways and raised the great wall. But he left no son to his father and no girl to her mother, and the people cried out to the gods. Aruru made a rival from clay on the steppe: Enkidu, who lived with the gazelles and drank at the waterhole. A trapper saw him and was afraid. The harlot Shamhat was sent; for seven days Enkidu lay with her, and the animals ran from him, for he had grown wise and like a man."
place.gilgamesh_epic_tablet_2: "Clay tablet of the Epic of Gilgamesh (2)"
knowledge.gilgamesh_epic_tablet_2.title: "Epic of Gilgamesh, tablet II: the wrestling at the door"
knowledge.gilgamesh_epic_tablet_2.text: "Shamhat clothed Enkidu and taught him bread and beer, and he went to Uruk. There Gilgamesh was about to enter the house of a bride on her wedding night, as the king's right was. Enkidu blocked the door with his foot. The two seized each other like bulls, the doorposts shook and the wall trembled. When Gilgamesh had thrown him, his anger died and they kissed, and became friends."
place.gilgamesh_epic_tablet_3: "Clay tablet of the Epic of Gilgamesh (3)"
knowledge.gilgamesh_epic_tablet_3.title: "Epic of Gilgamesh, tablet III: the road to the Cedar Forest"
knowledge.gilgamesh_epic_tablet_3.text: "Gilgamesh wished to win a name that would not die, and decided to kill Humbaba, the guardian of the Cedar Forest. The elders of Uruk warned him; he did not listen. His mother Ninsun, wise in all things, prayed to Shamash and adopted Enkidu as her son. The smiths cast axes and swords, and the elders blessed them: let Shamash give you a safe road."
place.gilgamesh_epic_tablet_4: "Clay tablet of the Epic of Gilgamesh (4)"
knowledge.gilgamesh_epic_tablet_4.title: "Epic of Gilgamesh, tablet IV: dreams on the road"
knowledge.gilgamesh_epic_tablet_4.text: "They walked fifty leagues in a day and every night built a shelter and slept. Each night Gilgamesh dreamed: a mountain collapsed on them, a bull charged, lightning split the sky. Enkidu read each dream as a good omen, and Gilgamesh took heart. So they came to the edge of the Cedar Forest, where Humbaba's cries rang."
place.gilgamesh_epic_tablet_5: "Clay tablet of the Epic of Gilgamesh (5)"
knowledge.gilgamesh_epic_tablet_5.title: "Epic of Gilgamesh, tablet V: Humbaba"
knowledge.gilgamesh_epic_tablet_5.text: "At the gate of the forest Enkidu's arm went numb with fear, but Gilgamesh drove him on. They admired the cedars, the home of the gods, and then Humbaba came out. Shamash sent the thirteen winds against him and he could not move. Humbaba begged for his life and Gilgamesh pitied him, but Enkidu said: kill him. They cut off his head and felled the cedars for a great gate."
place.gilgamesh_epic_tablet_6: "Clay tablet of the Epic of Gilgamesh (6)"
knowledge.gilgamesh_epic_tablet_6.title: "Epic of Gilgamesh, tablet VI: Ishtar and the Bull of Heaven"
knowledge.gilgamesh_epic_tablet_6.text: "Gilgamesh washed and put on his royal robes, and Ishtar saw him. \"Be my husband,\" she said, and promised him chariots of gold and lapis. He refused and recalled her lovers, the shepherd she turned into a wolf and the gardener she turned into a mole. Ishtar went to Anu in a rage and demanded the Bull of Heaven. The bull came down on Uruk and the earth opened under hundreds; Enkidu seized it by the horns and Gilgamesh killed it with the sword. Enkidu tore off a haunch and threw it in Ishtar's face."
place.gilgamesh_epic_tablet_7: "Clay tablet of the Epic of Gilgamesh (7)"
knowledge.gilgamesh_epic_tablet_7.title: "Epic of Gilgamesh, tablet VII: Enkidu's dream"
knowledge.gilgamesh_epic_tablet_7.text: "The gods met in council: one of the two must die, for the killing of Humbaba and the Bull. They chose Enkidu. He dreamed it, and the next day fell ill. In his fever he cursed the trapper and Shamhat who had made him a man; then Shamash rebuked him, reminding him of the bread and beer and the friend he had found, and Enkidu blessed her instead. But he knew the end was near."
place.gilgamesh_epic_tablet_8: "Clay tablet of the Epic of Gilgamesh (8)"
knowledge.gilgamesh_epic_tablet_8.title: "Epic of Gilgamesh, tablet VIII: the lament"
knowledge.gilgamesh_epic_tablet_8.text: "At dawn on the twelfth day Enkidu died. Gilgamesh would not let him be buried. He wept like a mourner, called on the mountains and the wild animals, and had a statue made. For seven days and nights he did not leave the body. Then he made rich gifts to the gods, that they might receive his friend."
place.gilgamesh_epic_tablet_9: "Clay tablet of the Epic of Gilgamesh (9)"
knowledge.gilgamesh_epic_tablet_9.title: "Epic of Gilgamesh, tablet IX: the road through the mountain"
knowledge.gilgamesh_epic_tablet_9.text: "Gilgamesh feared death and wandered the steppe in a lion's skin: \"Shall I die too, and be like Enkidu?\" He set out for Utnapishtim, the one man who lives for ever. At Mount Mashu, whose twin peaks hold up the sky, the scorpion man and his wife guarded the gate where the sun passes. They let him in at last, and he walked twelve double hours in the dark of the tunnel until he saw light."
place.gilgamesh_epic_tablet_10: "Clay tablet of the Epic of Gilgamesh (10)"
knowledge.gilgamesh_epic_tablet_10.title: "Epic of Gilgamesh, tablet X: Siduri and the Waters of Death"
knowledge.gilgamesh_epic_tablet_10.text: "By the sea sat the alewife Siduri, who told him: when the gods made men they gave them death and kept life for themselves; fill your belly and be glad, hold the child that takes your hand. He would not hear it, and asked the road. The boatman Urshanabi crossed the Waters of Death with him; the poles ran out, and Gilgamesh cut a hundred and twenty more and used his clothes as a sail."
place.gilgamesh_epic_tablet_11: "Clay tablet of the Epic of Gilgamesh (11)"
knowledge.gilgamesh_epic_tablet_11.title: "Epic of Gilgamesh, tablet XI: Utnapishtim and the flood"
knowledge.gilgamesh_epic_tablet_11.text: "Utnapishtim told Gilgamesh the secret: the gods sent a flood, and Ea warned him through the reed wall to build a boat. After the storm, he sent out a dove, a swallow and a raven, and when the raven did not return he knew the land was dry. Gilgamesh failed the test of sleeping for six days and seven nights. As a parting gift Utnapishtim gave him the plant of rejuvenation at the bottom of the sea; Gilgamesh dived and brought it up, but while he bathed a snake carried it off."
place.gilgamesh_epic_tablet_12: "Clay tablet of the Epic of Gilgamesh (12)"
knowledge.gilgamesh_epic_tablet_12.title: "Epic of Gilgamesh, tablet XII: Enkidu's shade"
knowledge.gilgamesh_epic_tablet_12.text: "The last tablet is a later addition in the Sumerian manner: Gilgamesh let his ball and mallet, the pukku and the mekku, fall into the underworld and wept; Enkidu offered to bring them back and Gilgamesh told him how to behave among the dead. Enkidu did the opposite of everything, and the underworld seized him. Then Gilgamesh pleaded with the gods, and Enkidu's shade rose through a hole in the earth to tell him how the dead fare: the man with many sons is better off than the man with none, and the one with no one to pour a drink is worst of all."
achievement.twelve_tablets.title: "Reader of the Twelve Tablets"
achievement.twelve_tablets.description: "Find and read all twelve clay tablets of the Epic of Gilgamesh, in the places where the story happens."
place.etana_tablet_1: "Clay tablet of the Legend of Etana (1)"
knowledge.etana_tablet_1.title: "Legend of Etana, tablet I: kingship at Kish"
knowledge.etana_tablet_1.text: "When kingship came down from heaven, it came to Kish, and the gods laid its foundation. Etana, the shepherd, was one of the first kings, and the King List says of him that he ascended to heaven and gathered all the lands. But Etana had no heir, and he wept before Shamash and begged him for the plant of birth."
place.etana_tablet_2: "Clay tablet of the Legend of Etana (2)"
knowledge.etana_tablet_2.title: "Legend of Etana, tablet II: the eagle and the serpent"
knowledge.etana_tablet_2.text: "In a tree an eagle nested at the top and a serpent at the foot, and they swore an oath by Shamash to share their food and not harm one another's young. The eagle broke the oath and ate the serpent's children. The serpent wept to Shamash, and he told it to hide in the carcass of a wild ox; when the eagle came to eat, the serpent seized it, plucked its wings and threw it into a pit to die."
place.etana_tablet_3: "Clay tablet of the Legend of Etana (3)"
knowledge.etana_tablet_3.title: "Legend of Etana, tablet III: the flight to heaven"
knowledge.etana_tablet_3.text: "Shamash sent Etana to the pit. Etana nursed the eagle back to strength, and the eagle offered to carry him to the heaven of Anu to find the plant of birth. They rose, and the earth grew small as a field, then a garden, then nothing; Etana's courage failed and they fell. At the second flight he held fast and they came to the gate of Anu. There he found the plant, and his son Balih was born."
achievement.etana_tablets.title: "Rider of the Eagle"
achievement.etana_tablets.description: "Find and read all three clay tablets of the Legend of Etana in Kish."
place.adapa_tablet_1: "Clay tablet of the Myth of Adapa (1)"
knowledge.adapa_tablet_1.title: "Myth of Adapa, tablet I: the wing of the south wind"
knowledge.adapa_tablet_1.text: "Adapa was a priest of Ea's temple in Eridu, a sage to whom Ea gave great wisdom but not life without end. One day he went fishing and the south wind overturned his boat. Adapa cursed it and broke its wing, and the wind did not blow for seven days. Anu heard of it and summoned Adapa to heaven to answer for it."
place.adapa_tablet_2: "Clay tablet of the Myth of Adapa (2)"
knowledge.adapa_tablet_2.title: "Myth of Adapa, tablet II: the bread of life"
knowledge.adapa_tablet_2.text: "Ea advised Adapa: put on mourning, win over the two gods at the gate of heaven, Dumuzi and Gizzida, and take no food or drink there, for it would kill you. Adapa did as he was told and told the gatekeepers he mourned for them, who had vanished from the land. Anu was moved and offered him the bread and water of life; Adapa refused, as Ea had said. Anu laughed: \"Why, Adapa, did you not eat? Now you will not live for ever.\" Adapa went home, and with him went disease. The end of the tablet is lost."
achievement.adapa_tablets.title: "Breaker of the South Wind"
achievement.adapa_tablets.description: "Find and read both clay tablets of the Myth of Adapa, in Eridu and Uruk."
place.dilmun_tablet_1: "Clay tablet of the Enki and Ninhursag (1)"
knowledge.dilmun_tablet_1.title: "Enki and Ninhursag, tablet I: Dilmun and the daughters"
knowledge.dilmun_tablet_1.text: "Dilmun was a pure land, but it had no sweet water. Ninhursag lamented, and Enki had the sun god Utu bring water from the earth; the land turned green and became a wetland and a trading port. Enki lay with Ninhursag and they had a daughter, Ninsar; he lay with Ninsar and she bore Ninkurra; he lay with Ninkurra and she bore Uttu, the lady of weaving."
place.dilmun_tablet_2: "Clay tablet of the Enki and Ninhursag (2)"
knowledge.dilmun_tablet_2.title: "Enki and Ninhursag, tablet II: the eight plants"
knowledge.dilmun_tablet_2.text: "Ninhursag told Uttu how to avoid Enki, but Enki took her anyway, and Ninhursag removed his seed from her and sowed it in the ground: eight plants grew. Enki ate them. Ninhursag cursed him: \"I will not look at you with the eye of life until you are dead.\" The gods were afraid, and a fox brought Ninhursag back for a promise of fame. She sat Enki beside her and asked where he hurt, and for each aching part she bore a god to heal it."
achievement.dilmun_tablets.title: "Gardener of Dilmun"
achievement.dilmun_tablets.description: "Find and read both clay tablets of Enki and Ninhursag, in Eridu and Adab."
place.nergal_tablet_1: "Clay tablet of the Nergal and Ereshkigal (1)"
knowledge.nergal_tablet_1.title: "Nergal and Ereshkigal, tablet I: the banquet of the gods"
knowledge.nergal_tablet_1.text: "The gods held a banquet in heaven, and Ereshkigal could not go up from the underworld; she sent her vizier Namtar to fetch her share. All the gods rose when Namtar came in, except Nergal, who stayed seated. Namtar went down and told his queen, and Ereshkigal demanded that Nergal be sent to her. Nergal had cults at Nippur, Uruk, Larsa and Ur, and his chief temple, E-meslam, stood in Kutha."
place.nergal_tablet_2: "Clay tablet of the Nergal and Ereshkigal (2)"
knowledge.nergal_tablet_2.title: "Nergal and Ereshkigal, tablet II: the descent and the marriage"
knowledge.nergal_tablet_2.text: "In the Amarna tablet Ea gave Nergal fourteen helpers for the fourteen openings of the underworld; the longer Assyrian tale adds Ea's warning to take no seat, food, drink or washing there. Nergal broke into the palace, seized Ereshkigal by the hair, dragged her from her throne and raised his axe. She cried: \"Do not kill me! Be my husband, and take the kingship of the wide earth.\" He kissed her and wiped away her tears. In the Assyrian version he stays with her and leaves and returns when she grieves. The two versions end differently, and the meaning of the marriage is disputed."
achievement.nergal_tablets.title: "Bridegroom of the Underworld"
achievement.nergal_tablets.description: "Find and read both clay tablets of Nergal and Ereshkigal, in Nippur and Larsa."
achievement.keeper_of_legends.title: "Keeper of the Legends"
achievement.keeper_of_legends.description: "Read every clay tablet of every legend: Atra-Hasis, Enuma Elish, Ishtar's Descent, the Epic of Gilgamesh, Etana, Adapa, Enki and Ninhursag, and Nergal and Ereshkigal."
knowledge.legend_tablet.credit: "Render of the datadisk's own model (CC BY-SA 4.0). Signs drawn with Noto Sans Cuneiform (SIL Open Font License). Retold after the editions and studies listed in research/LEGENDS.md."

# More legends told by the elders (Etana, Adapa, Dilmun, Nergal and Ereshkigal).
elder_tales_man.ask_etana: "Tell me of Etana and the eagle."
elder_tales_man.etana: "Kingship came down from heaven to Kish, and the shepherd Etana had no son. An eagle and a serpent had sworn by Shamash, and the eagle ate the serpent's young; the serpent trapped him in a pit, and Etana saved him. The eagle carried him up to Anu's gate for the plant of birth, and the second time Etana held fast. So Kish had a son, Balih. When a childless man looks at the sky, he thinks of Etana."
elder_tales_man.ask_adapa: "Why can a wise man still die?"
elder_tales_man.adapa: "Adapa of Eridu, the priest of Ea, went fishing, and the south wind overturned his boat; he broke its wing, and for seven days no wind blew. Anu called him up to heaven. Ea warned him: eat nothing there, it will kill you. Adapa mourned for the gatekeepers and refused the bread and water Anu offered, and Anu laughed: now you will not live for ever. So we have the fever and the grave, and we have Adapa's wisdom."
elder_tales_woman.ask_dilmun: "Tell me of Dilmun and the eight plants."
elder_tales_woman.dilmun: "Dilmun was a clean land without sweet water; Enki had Utu bring it and the land turned green. Enki and Ninhursag had a daughter, and her daughter, and Uttu; from the seed that Ninhursag sowed grew eight plants. Enki ate them, and Ninhursag turned her eye away; he sickened until she returned and bore a god for every ache. That is why every herb has its god and every ache its helper."
elder_tales_woman.ask_nergal: "Why do plague and the dead keep house together?"
elder_tales_woman.nergal: "At the banquet of the gods everyone rose for Namtar, the messenger of Ereshkigal, but Nergal stayed seated. The queen sent for him; Ea gave him fourteen helpers, and he burst into her palace, seized her by the hair, and she offered him her kingship. So the god of plague and the queen of the dead are man and wife, child. Whoever fears the fever must not forget the dead."

# The author's disclaimer (places/author_disclaimer.yaml).
place.author_disclaimer: "Clay tablet: Disclaimer of the humble servant of Enki"
knowledge.author_disclaimer.title: "Disclaimer of the humble servant of Enki"
knowledge.author_disclaimer.text: "I, the author of this world, a humble servant of Enki, the wisest of lords, master of the sweet waters and of the Apsu, declare before all the gods and every reader: I am not answerable for the troubles that Ishtar, called Inanna, has brought upon the world. Not for her descent to the land of no return, after which the bull did not mount the cow and no man looked at a girl. Not for the Bull of Heaven that trampled Uruk, nor for the lovers she turned into wolves and moles. Nor am I answerable for her father Anu, the dry clerk of heaven, whose every decision needs three seals, a quorum and a clay receipt. (Some say her father is Sin, the moon; the author hopes so, for Anu's sake.) Whatever the gods did while I was not looking, they did without my consent. Complaints may be left at the foot of this tablet: Enki will hear them, and will do nothing about them in the wisest possible way."
lore.author_disclaimer.title: "Disclaimer of the humble servant of Enki"
lore.author_disclaimer: "I, the author of this world, a humble servant of Enki, the wisest of lords, master of the sweet waters and of the Apsu, declare before all the gods and every reader: I am not answerable for the troubles that Ishtar, called Inanna, has brought upon the world. Not for her descent to the land of no return, after which the bull did not mount the cow and no man looked at a girl. Not for the Bull of Heaven that trampled Uruk, nor for the lovers she turned into wolves and moles. Nor am I answerable for her father Anu, the dry clerk of heaven, whose every decision needs three seals, a quorum and a clay receipt. (Some say her father is Sin, the moon; the author hopes so, for Anu's sake.) Whatever the gods did while I was not looking, they did without my consent. Complaints may be left at the foot of this tablet: Enki will hear them, and will do nothing about them in the wisest possible way."

# Allusions to the legends in the speech of other characters (ninsun, gilgamesh, high_priest_anu, tablet_writer, weaver, potter, smith, uruk_alewife, uruk_farmer).
ninsun.ask_clay: "What do you tell him of his birth?"
ninsun.clay: "When the gods were man, the birth goddess Mami made us of clay and the blood of a god. My son is two parts god and one part man, and the part that is man he must remember: it is made of clay, and clay returns to the earth. I tell him the old tale of Atra-Hasis every year, and every year he forgets the last line."
gilgamesh.ask_ishtar_below: "What do you say of Ishtar's descent?"
gilgamesh.ishtar_below: "She went down to the land of no return, and at seven gates they took everything from her, and she came up with a bill: someone else must go in her place. Her husband Tammuz, that is how she keeps accounts. Do you wonder that I would not be her husband? A goddess who hands her beloved to the demons does not make a good wife. And her father Anu would want the matter in three copies."
high_priest_anu.ask_adapa: "I heard that Anu laughed once."
high_priest_anu.adapa: "He did, with Adapa of Eridu, when the sage refused the bread of life on Ea's advice: \"Why did you not eat?\" It is entered in the temple record in the proper form, with three seals. Do not believe those who call my lord dry. He is exact. A world with less exactness gets an Ishtar, a Bull of Heaven and a flood in the same year."
tablet_writer.ask_incipit: "How do you tell the tablets apart?"
tablet_writer.incipit: "By their first words, as we do with every long song. \"When the gods were man\" is the tale of Atra-Hasis, three tablets. \"When on high\" is the New Year song of Marduk, seven. \"He who saw the Deep\" is the song of Gilgamesh, twelve. The one of Ishtar and the seven gates is named for the land it goes to: the Land of No Return. A good scribe writes the title at the end of the tablet, so that the next scribe does not copy it twice."
weaver.ask_uttu: "Is there a goddess of weaving?"
weaver.uttu: "Uttu, the lady of the loom, the daughter of Ninkurra, whom Enki would not leave alone. Ninhursag took his seed from her and sowed it, and eight plants grew. That is why a weaver closes her door when a stranger asks for fine cloth."
potter.ask_clay_man: "They say man is made of clay."
potter.clay_man: "I believe it. The birth goddess Mami took clay and the blood of a slain god, and Enki trod it as I tread mine; fourteen pieces, seven men and seven women. Clay must rest before it is worked, and so did they: ten months. The Igigi dug canals and then burned their tools. I know that feeling: when the kiln cracks."
smith.ask_nergal: "Which god do you pray to?"
smith.nergal: "Nergal, lord of the furnace and the fever, with the lion-headed mace. He would not rise for his queen's messenger and was sent below; now he rules there with Ereshkigal. When a blade cracks in the casting, we say: Nergal has looked at it. Pay him first, then the customer."
uruk_alewife.ask_siduri: "What do you say to a man who fears death?"
uruk_alewife.siduri: "What the alewife by the sea said to Gilgamesh: when the gods made man they gave him death and kept life for themselves. Fill your belly, make merry day and night, wash and dress, and hold the child who takes your hand. It is cheap advice, and the beer is dear. Another cup?"
uruk_farmer.ask_canals: "Is it true the gods once dug the canals themselves?"
uruk_farmer.canals: "The little gods, the Igigi, for forty years, until they burned their spades and surrounded Enlil's house. I look at my ditch and I understand them. But the barley does not wait for a strike, and who would carry the baskets of the gods if not us?"

# What the elders say while the New Year festival is on (the flag festival:akitu of the server).
elder_tales_man.akitu_now: "Do you not hear the drums, child? The New Year is on: eleven days from the first new moon of spring. Go to the temple and see Marduk go out against Tiamat, and hear his fifty names; the beer is free, the king kneels, and I have not slept since the dawn. Come back when the lamps are out and I will tell you the rest."
elder_tales_woman.akitu_now: "Light a lamp, child, it is the New Year! Eleven days when everyone is kin. I carry the lamp in the procession of the god; walk with us to the temple and hear the song of Marduk and Tiamat, and see the sky made out of her body. Tomorrow we shall all go back to our work, but not today."

# More allusions to the legends (shamhat, utnapishtim, temple_scribe, uruk_water_carrier, uruk_elder).
shamhat.ask_ishtar_below: "What do you sing of Ishtar below?"
shamhat.ishtar_below: "I know it by heart: seven gates, and at each the keeper took a piece of her finery, until she stood bare before her sister. I think of it each time I take off my own ornaments. And Tammuz: we weep for him every year with the flute of lapis, and the next day we laugh, because Ishtar came up again."
utnapishtim.ask_atra_hasis: "The old tales call the flood hero Atra-Hasis."
utnapishtim.atra_hasis: "They do: Atra-Hasis, the Exceedingly Wise, king of Shuruppak, the one who heard a reed wall speak. Names are like clay, they take the shape of the hand that tells them. Ask Gilgamesh what he heard under the other name: it is the same flood, and the same wall."
temple_scribe.ask_new_year: "What is read at the New Year?"
temple_scribe.new_year: "\"When on high\", all seven tablets, with the priests acting it out in the temple while my pupils hold the clay. I teach them: copy the line, not the god. The next king will want another god in the song, and the scribe who copied the god will be out of work."
uruk_water_carrier.ask_khalziku: "Why does a waterskin matter so much?"
uruk_water_carrier.khalziku: "Ask the underworld. When the gods sent Asushunamir down, he asked Queen Ereshkigal for the water bag, the khalziku, to drink from it, and she cursed him: such a wish cannot be granted. A waterskin is the first thing a traveller needs and the last thing the dead may have. Fill yours, child."
uruk_elder.ask_kingship: "Who gave the kings their power?"
uruk_elder.kingship: "Kingship came down from heaven, first to Eridu, and after the flood to Kish. Etana the shepherd, who had no son, rose to heaven on an eagle to fetch the plant of birth. Remember it, you kings of Uruk: the crown is lent, and Anu's clerks keep the receipt."
