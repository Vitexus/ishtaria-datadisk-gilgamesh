npc.crowd_spearman: Spearman
npc.crowd_spearman.bio: "A spearman of the city guard."
npc.crowd_archer: Archer
npc.crowd_archer.bio: "An archer of Early Dynastic Uruk."
npc.crowd_axeman: Axeman
npc.crowd_axeman.bio: "A stocky soldier with a copper axe."
npc.crowd_slinger: Slinger
npc.crowd_slinger.bio: "A young skirmisher with a sling."
npc.crowd_textile_merchant: Cloth merchant
npc.crowd_textile_merchant.bio: "A well-dressed textile merchant."
npc.crowd_copper_merchant: Copper trader
npc.crowd_copper_merchant.bio: "A copper trader of the market."
npc.crowd_caravaneer: Caravaneer
npc.crowd_caravaneer.bio: "A donkey caravan driver."
npc.crowd_young_noble: Young noble
npc.crowd_young_noble.bio: "A young nobleman of the palace."
npc.crowd_noble_girl: Noble girl
npc.crowd_noble_girl.bio: "A noble girl of about fifteen."
npc.crowd_court_official: Court official
npc.crowd_court_official.bio: "A palace official of Uruk."
npc.crowd_priest_minor: Junior priest
npc.crowd_priest_minor.bio: "A young priest of the Eanna precinct."

place.uruk_smithy: Copper smithy
place.uruk_pottery: Potter's yard

npc.smith: Smith
npc.smith.bio: "A smith of the south-west street. He smelts copper in the furnace, burns charcoal in the kiln and casts swords in open clay moulds. Soot on a leather apron, a fresh blade in his hand."
npc.potter_tablet: Tablet potter
npc.potter_tablet.bio: "A potter who shapes both jars and the clay tablets the city writes on. Clay to the elbows, a damp tablet and a reed stylus in his hands."
npc.tablet_bearer: Servant
npc.tablet_bearer.bio: "A servant of the potters' yard. He carries a basket of unwritten clay tablets to the temple and the market."
npc.market_scribe: Scribe
npc.market_scribe.bio: "A scribe who writes accounts and offerings on the clay tablets the servants bring from the potters."
npc.tablet_merchant: Merchant
npc.tablet_merchant.bio: "A merchant of the great market. He writes what he has bought and sold on clay tablets, stylus in hand."
npc.writing_priest: Priest
npc.writing_priest.bio: "A priest of Eanna. He records offerings on the clay tablets carried up from the potters' yards."

smith.greet: "Mind the furnace. The copper is running, and a sword is setting in the mould."
smith.ask_furnace: Ask about the furnace
smith.ask_sword: Ask about the swords
smith.leave: I will leave you to the fire.
smith.furnace: "Ore and charcoal go into the furnace, and the kiln beside the yard burns the wood to charcoal. Without that fire there is no copper, and without copper there is no blade."
smith.sword: "I cast the swords, I do not hammer them from thin air. The mould is clay, the metal is copper, and the blade cools on the bench while the next one is poured."

potter.ask_tablets: Ask about the clay tablets
potter.tablets: "The jars are for the house and the temple. The tablets are for words. I cut them from the same river clay, and the servants carry them in baskets to Eanna and to the market, where scribes, merchants and priests write on them."

tablet_bearer.greet: "Step aside. This basket is full of tablets, and they are still soft."
tablet_bearer.ask_tablets: Ask where you are taking them
tablet_bearer.leave: Go on, then.
tablet_bearer.tablets: "From the potters' yard to the temple, and the other basket to the market. The scribes, the merchants and the priests write on them. I only carry them."

tablet_writer.greet: "A fresh tablet, still warm from the potter's yard. Give me a moment and the words will be in the clay."
tablet_writer.ask_write: Ask what you are writing
tablet_writer.leave: I will not smudge the clay.
tablet_writer.write: "Scribes write the offerings, merchants write what was bought and sold, and we priests write what was given to the gods. The servants bring the tablets in baskets. The clay remembers the hand that pressed it."

# Hunter quest (Tablet I) — player is the trapper
place.hunter_waterhole: Water-Hole of the Hunters
place.hunter_village: Village of the Old Father
npc.hunter_father: Old Father
npc.hunter_father.bio: An old man of the steppe village who taught his son the pits and snares. White-bearded and stooped, wise in the ways of the wild and of Uruk's king.
quest.hunter.title: The Hunter and the Wild Man
quest.hunter.lay_snares: Place a snare by the water-hole, stand far back and wait — and watch for lions and wolves. Stay too close and the herd will not come.
quest.hunter.snare_ruined_1: The wild man tore your first snare and freed the catch. Place another; the predators at the hole do not sleep.
quest.hunter.snare_ruined_2: Again he fills your pits and uproots the nets. Another snare — and keep the lions and wolves off you.
quest.hunter.snare_ruined_3: Thrice he has ruined your work. You are not done — set another snare, and mind the beasts.
quest.hunter.snare_ruined_4: A fourth time he tore the nets. Try once more.
quest.hunter.snare_ruined_5: Five times he has ruined your work. Seek counsel from your old father.
quest.hunter.ask_father: Speak with your father in the village.
quest.hunter.seek_gilgamesh: Go to Uruk and tell King Gilgamesh of the wild man.
quest.hunter.seek_shamhat: Find Šamḫat by the temple of Inanna and explain your plan.
quest.hunter.journey_with_shamhat: Journey with Šamḫat back to the water-hole (the third day's road).
quest.hunter.find_enkidu: Find the wild man with Šamḫat at the water-hole.
quest.hunter.done: The hunter's part is done. Šamḫat will make a human of Enkidu.
enkidu_wild.greet: He stands between you and the drinking herd — hair like a wild bull, no word of men. The gazelles do not flee him.
enkidu_wild.after_snares: (He has torn every snare. There is nothing more you can do here alone.)
enkidu_wild.send_father: He stamps and bellows. The herd closes around him. Your pits are ruined; only your father's counsel can help now — back to the village.
enkidu_wild.with_shamhat: (Bring Šamḫat forward.)
enkidu_wild.found_with_shamhat: The wild man still guards the water. Šamḫat steps past you — your hunt ends; her work begins.
enkidu_wild.leave: (Draw back without a sound.)
hunter_father.greet: My son. The steppe has worn your face.
hunter_father.tell_wild_man: Father — a man of the hills ruins every snare I set.
hunter_father.ask_who: Who are you to the hunters?
hunter_father.who: I am your father. I dug pits before you could walk.
hunter_father.counsel: Go to Uruk. Tell Gilgamesh. He will send a woman of the temple — Šamḫat — and the wild man will leave the herd.
hunter_father.leave: (Bow and leave.)
gilgamesh.hunter_plea: O king — a wild man fills my pits and frees the gazelles. My father sent me to you.
gilgamesh.send_shamhat: Take Šamḫat from the house of Inanna. When the herd comes to drink, she will draw him from the animals. Go.
shamhat.hunter_plan: The king sends me. Will you walk three days to the water-hole with me?
shamhat.accept_journey: Then we walk. Lead me to the wild man, trapper.
quest.shamhat.title: Šamḫat and the Wild Man
quest.shamhat.see_the_savage: Win the wild man's heart — throw hearts of love until the beast in him yields.
quest.shamhat.return_to_uruk: Lead Enkidu to the market of Uruk.
enkidu_wild.become_shamhat: (Step forward as Šamḫat.)
enkidu_wild.handover_shamhat: The trapper's road ends. You are Šamḫat of the temple — the wild man waits for your word.
enkidu_civilize.offer_bread: Take this bread of people.
enkidu_civilize.walk_to_uruk: Come — we walk to Uruk, to Gilgamesh the king.
enkidu_civilize.ready_for_uruk: He rises like a man of the city. The road to Uruk is open.
enkidu_civilize.leave: (Step back.)
enkidu_civilize.greet: The wild man watches you with new eyes.
quest.hunter.excerpt: |
  They called Aruru, the great goddess:
  "You created Gilgamesh, Aruru; now create his image! Let him match
  Gilgamesh in the storm of his heart! Let them contend with each other,
  and let Uruk recover!"

  No sooner had Aruru heard this than she conceived in her heart an image
  after Anu; Aruru washed her hands, pinched off clay, spat upon it, and
  created the hero, mighty Enkidu, offspring of clay, endowed with strength
  by Ninurta. Hair covers his whole body; on his head the hair grows thick
  as a woman's, waving locks like barley. He knows neither country nor people;
  he is clothed like Sumukan, god of the wild. With the gazelles he eats grass,
  with the wild beasts he jostles at the water-hole, with the herd of the water
  creatures he delights his heart.
quest.hunter.excerpt.akkadian: >-
  izzukūnimma Aruru rabītum atti Aruru tabnî Gilgāmeš eninna binî zikiršu
  ana idi libbišu lū mašil lištannanūma Uruk lištapšiḫ Aruru annīta ina šemêša
  zikir Anim ibtani ina libbiša Aruru idiša imsi ṭiṭṭa iktariṣ ittadi ina ṣēri
  ina ṣēri Enkidu ibtani qurādu ilitti qulti kiṣir Ninurta šūrumma zumuršu šuʾʾuru
  upazzir kīma sinništi upazzirūšu perētu kīma Nissaba lā īdi nišī mātamma
  lubušti labiš kīma Sumuqan itti ṣabî ikkala šammī itti būlim mašqâ išatti
  itti nammaššê mê iṭīb libbašu

quest.shamhat.excerpt: She cast love like a net; the wild man became a man — then bread and beer of the land.
quest.shamhat.excerpt.akkadian: aklī ša nišī akul — šikar māti šiti
quest.shamhat.teach_bread: He has eaten the bread of people. Offer him the beer of the land.
quest.shamhat.teach_ale: He has drunk. Clothe him as a man of the city.
quest.shamhat.teach_clothing: The herd flees him. Walk with him to Uruk and Gilgamesh the king.
quest.shamhat.present_enkidu: Present the civilized wild man to King Gilgamesh in the market.
quest.shamhat.done: Šamḫat's work is done. Enkidu stands before the king.
enkidu_civilize.offer_ale: Drink the beer of the land — seven jars, as the shepherds do.
enkidu_civilize.offer_clothing: Put on the garment of men. Leave the hair of the hills.
enkidu_civilize.ate_bread: He takes the bread. His eyes are strange — no longer only a beast's.
enkidu_civilize.drank_ale: He drinks. He sings. He is merry as a man of the sheepfolds.
enkidu_civilize.wore_clothing: He wears linen. The gazelles that ran with him flee into the hills.
quest.enkidu_meets.title: Enkidu and the King
quest.enkidu_meets.face_the_king: Challenge Gilgamesh — block the door of the wedding house.
quest.enkidu_meets.wrestle: Wrestle the king in the street of Uruk.
quest.enkidu_meets.become_brothers: You and Gilgamesh are equals. Friendship is sealed.
quest.enkidu_meets.excerpt: They grappled like bulls; the doorpost shook — then they kissed and became friends.
quest.enkidu_meets.excerpt.akkadian: iṣṣabtūma kīma lītī — ina sūqi ša Uruk
gilgamesh.receive_shamhat: O king — here is the wild man, clothed and fed. Šamḫat has done her work.
gilgamesh.accept_enkidu: Good. Let him stand before me. The match of Uruk has come.
gilgamesh.become_enkidu: (Become Enkidu — face the king.)
gilgamesh.become_king: (Become Gilgamesh — the epic continues.)
gilgamesh.king_handover: "You are Gilgamesh, king of Uruk. Enkidu stands beside you as brother. The Cedar Forest waits."
enkidu.propose_cedar: Speak of the Cedar Forest
enkidu.propose_cedar_speech: "Brother — fame that lasts is cut from cedar. Let us go to the Forest and face Humbaba. First seek your mother's blessing."
enkidu.depart_cedar: Set out for the Cedar Forest
enkidu.depart_cedar_speech: "The road is long. Close your eyes — when you open them, the cedars stand around us."
enkidu.ask_more: Ask about other things
enkidu.back: Back
enkidu.speak_illness: Ask what ails him
enkidu.speak_sickness: Stay beside him in his fever
enkidu.speak_dream: Ask about his dream
enkidu.farewell: Bid him farewell
enkidu.illness: "Brother — the gods have judged. For Humbaba and the Bull, one of us must die. It is me."
enkidu.sickness: "The illness grows heavy. Do not leave me. Speak of the wild days… of Šamḫat… of you."
enkidu.underworld_dream: "I dreamed of the House of Dust, where kings sit with crowns of clay. I fear it."
enkidu.farewell_speech: "My friend… do not forget me. Your walls of Uruk will outlast us both — seek life if you must."
ninsun.ask_cedar_blessing: Ask for a blessing for the Cedar road
ninsun.cedar_blessing: "My son, I have placed you under the gods. Go with Enkidu; the road of cedars is open. Speak to your brother when you are ready to depart."
ninsun.ask_immortality_road: Ask the road to Utnapishtim
ninsun.immortality_counsel: "Enkidu is gone. If you would chase life without end, the road runs to Mount Mashu and beyond the Waters of Death."
ninsun.depart_mashu: Set out for Mount Mashu
ninsun.send_mashu: "Go. The Scorpion Men guard the gate. Pass them, and Ur-Shanabi will find you."
ninsun.ask_walls: Look upon the walls of Uruk
ninsun.walls_epilog: "Climb with me, my son. Foundation terrace and burnt brick — this is your work. The plant is gone, yet Uruk stands. That is enough."
gilgamesh.enkidu_handover: You are Enkidu. The street waits. Block his path and prove your strength.
gilgamesh.enkidu_challenge: I am Enkidu. I will block your road, king of Uruk.
gilgamesh.enkidu_again: Again — finish what we began.
gilgamesh.wrestle_begin: They seize each other. Doorposts tremble; walls shake.
gilgamesh.wrestle_continue: (Hold fast.)
gilgamesh.wrestle_end: They kiss. Enkidu and Gilgamesh are brothers. Anger is forgotten.
enkidu_wild.already_self: You remember this water-hole — but you are no longer the beast that drank here.
gilgamesh.ask_more: Ask about other things.
gilgamesh.back: (Back.)
quest.shamhat.teach_love: His heart softens. Offer him the bread of people.
enkidu_civilize.love_chase: He flees like a gazelle. Throw hearts of love — fill the ground with your zone until the wildness fades.

# Namesake ancestors of the later Achaemenid kings (other cities than Uruk)
npc.cyrus: Kuruš
npc.cyrus.bio: "Ruler of Susa in the age of the Epic. A namesake ancestor of the later Achaemenid kings — not Cyrus the Great himself. Ask him about himself for the historical note and a link to the famous conqueror."
npc.darius: Dārayavahuš
npc.darius.bio: "Ruler of Nineveh in the age of the Epic. A namesake ancestor of the later Achaemenid kings — not Darius the Great himself. Ask him about himself for the historical note and a link to the famous king."
npc.xerxes: Xšayāršā
npc.xerxes.bio: "Ruler of Mari in the age of the Epic. A namesake ancestor of the later Achaemenid kings — not Xerxes I himself. Ask him about himself for the historical note and a link to the famous king."

knowledge.cyrus.title: Kuruš of Susa
knowledge.cyrus.text: "This Kuruš rules Susa in the Early Dynastic age of the Epic. He is a namesake ancestor of the famous Achaemenid line, not Cyrus the Great of the sixth century BCE — the likeness and the name are a deliberate anachronism. The Wikipedia article below is about that later conqueror."
knowledge.cyrus.credit: "Relief of Cyrus the Great, illustration from Illustrerad verldshistoria (E. Wallis), volume I. Public domain, via Wikimedia Commons."

knowledge.darius.title: Dārayavahuš of Nineveh
knowledge.darius.text: "This Dārayavahuš rules Nineveh in the age of Gilgamesh. He is a namesake ancestor of the later Achaemenid kings, not Darius the Great himself — the shared name bridges two eras on purpose. The Wikipedia article below is about the historical Darius the Great."
knowledge.darius.credit: "A king of Persia, illustration from Illustrerad verldshistoria (E. Wallis), volume I. Public domain, via Wikimedia Commons."

knowledge.xerxes.title: Xšayāršā of Mari
knowledge.xerxes.text: "This Xšayāršā rules Mari in the age of the Epic. He is a namesake ancestor of the later Achaemenid kings, not Xerxes I of the fifth century BCE — the resemblance is intentional game lore. The Wikipedia article below is about the historical Xerxes I."
knowledge.xerxes.credit: "Xerxes, illustration by A. Yakovlev (1911) for The General History Edited by Satyricon. Public domain, via Wikimedia Commons."

cyrus.greet: "I am Kuruš, lord of Susa. Uruk has Gilgamesh; here the plain answers to me."
cyrus.ask_city: Ask about Susa
cyrus.city: "Susa stands between the rivers of Elam and the road to the highlands. Bring trade, not war, and you will be welcome."
cyrus.leave: Farewell

darius.greet: "I am Dārayavahuš of Nineveh. The north watches while Uruk builds its walls."
darius.ask_city: Ask about Nineveh
darius.city: "Nineveh guards the upper Tigris. Messengers and merchants pass; armies that do not ask leave their bones."
darius.leave: Farewell

xerxes.greet: "I am Xšayāršā, who holds Mari on the Euphrates road. Gilgamesh's city is not the only crown."
xerxes.ask_city: Ask about Mari
xerxes.city: "Mari lives by the river trade. Cedar, copper and news of distant kings all stop at our quays."
xerxes.leave: Farewell
achievement.foundation_reader.title: "Reader of Foundations"
achievement.foundation_reader.description: "Find the foundation tablet of the Temple of Ishtar and read it."
knowledge.foundation_tablet.title: "Foundation tablet of the Temple of Ishtar"
knowledge.foundation_tablet.text: "\"For Inanna, his lady, the king of Uruk built her temple.\" When a temple was founded, the king had a small tablet of black stone inscribed and laid in a box of baked bricks under a corner of the walls, often with a copper peg. It spoke to the gods and to the kings who would rebuild the temple after him. Such tablets are known from Early Dynastic Lagash to the Ur III kings; this one follows the steatite tablets of Ur-Namma (about 2100 BCE) from the Eanna, without his name. The signs are a later form, not the writing of Gilgamesh's time."
knowledge.foundation_tablet.credit: "Render of the datadisk's own model (CC BY-SA 4.0), after a foundation tablet of Ur-Namma. Signs drawn with Noto Sans Cuneiform (SIL Open Font License)."
