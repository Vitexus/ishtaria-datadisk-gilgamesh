npc.crowd_fisherman: Fisherman
npc.crowd_fisherman.bio: "A marsh fisherman come to sell his catch."
npc.crowd_baker: Baker
npc.crowd_baker.bio: "A baker of Uruk, flour on his skirt."
npc.crowd_carpenter: Carpenter
npc.crowd_carpenter.bio: "A carpenter with a wide leather belt."
npc.crowd_shepherd: Shepherd
npc.crowd_shepherd.bio: "A shepherd come in from the steppe."
npc.crowd_market_woman: Market woman
npc.crowd_market_woman.bio: "A sturdy market woman of Uruk."
npc.crowd_washwoman: Washerwoman
npc.crowd_washwoman.bio: "A washerwoman of the city canals."
npc.crowd_young_woman: Young woman
npc.crowd_young_woman.bio: "A young woman of Uruk."
npc.crowd_pregnant_woman: Expectant mother
