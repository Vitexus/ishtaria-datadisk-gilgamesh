# Bull of Heaven Dialogues
bull_of_heaven.roar: "ROOOOAR! The Bull of Heaven has come to punish the arrogant!"
bull_of_heaven.flee: Flee from the beast
bull_of_heaven.fight: Stand and fight
bull_of_heaven.continue_fight: Meet the next charge
