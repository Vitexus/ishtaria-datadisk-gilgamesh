place.uruk_harbour: Quay of Uruk
place.uruk_boat: Moored boat
place.hunter_road: Road to Uruk
place.hunter_ferry_landing: Landing on the Euphrates
place.hunter_ferry_boat: Fishing boat
place.uruk_fisher: Fishing boat
place.hunter_village_trader: "Trader of the village"
place.hunter_village_well: "Well of the village"
npc.village_trader: "Village trader"
npc.village_trader.bio: "A trader who carries what a village needs from Uruk: waterskins, tools, seed and rope. He does business before his door, on the way to the square."
village_trader.greet: "Peace on your road. Waterskins, rope, seed and tools: what the steppe needs, I have."
village_trader.ask_well: "Where can I fill my waterskin?"
village_trader.well: "The well is on the square, lined with brick, and cold even in summer. Fill the skin there before you walk on to Uruk: the steppe has little water, and the river is a long way."
village_trader.leave: "Peace be with you."
place.uruk_well: Well
place.uruk_great_well: The open well of Uruk
place.hunter_home: "Home"
npc.village_man: "Villager"
npc.village_man.bio: "A man of the village, on his way between the house and the field."
npc.village_woman: "Villager"
npc.village_woman.bio: "A woman of the village, busy about her house."
npc.village_old_man: "Old villager"
npc.village_old_man.bio: "An old man of the village, resting in the shade of his house."
npc.village_old_woman: "Old villager"
npc.village_old_woman.bio: "An old woman of the village, keeping an eye on the children."
npc.village_boy: "Boy"
npc.village_boy.bio: "A boy of the village, running about the square."
npc.village_girl: "Girl"
npc.village_girl.bio: "A girl of the village, playing before the house."
npc.village_pregnant_woman.bio: "A woman of the village, expecting a child, busy about her house."
place.hunter_road_water: "Water seller"
npc.road_water_seller: "Water seller"
npc.road_water_seller.bio: "A carter who sells water and bread to travellers on the long road to the Euphrates."
water_seller.greet: "Peace on your road, traveller. Water, cold from the well: fill your skin for two coins, and bread besides."
water_seller.ask_river: "How far is it to the river?"
water_seller.river: "The Euphrates is still a long walk on. Fill your skin before you go; the steppe has no water between."
water_seller.leave: "Walk well."
npc.road_wagoner: "Carter"
npc.road_wagoner.bio: "A carter with a yoke of oxen, going between the villages and the river with his load."
npc.road_camel_driver: "Camel driver"
npc.road_camel_driver.bio: "A driver leading a laden camel along the long road to the Euphrates."
