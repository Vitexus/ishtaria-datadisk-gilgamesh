gilgamesh.ask_lesson: Ask about the lesson of mortality

# Gilgamesh at Temple
gilgamesh_temple.greet: "Here in the temple of Eanna, I find peace. The gods speak through the silence of these stones."
gilgamesh_temple.pray: Pray with the king
gilgamesh_temple.leave: I will leave you to your thoughts.
gilgamesh_temple.prayer: "Let us pray to Anu and the great gods for their blessing upon Uruk and its people."

# Enkidu Dialogues
enkidu.greet: "I am Enkidu. The hills made me; Šamḫat led me to bread and beer. Now I stand with Gilgamesh — equal strength, one heart."
enkidu.ask_wild_days: Ask about his wild days
enkidu.ask_gilgamesh: Ask about Gilgamesh
enkidu.ask_civilization: Ask about civilization
enkidu.ask_shamhat: Ask about Shamhat
enkidu.ask_humbaba: Ask about Humbaba
enkidu.ask_death: Ask about his death
enkidu.challenge_duel: Challenge him to a friendly wrestle
enkidu.duel_done: "Ha! Blow for blow — you are my equal. From this day we are brothers in arms."
enkidu.leave: I must go.
enkidu.wild_days: "Once I ran with the gazelles and drank with the wild beasts at the watering hole. I knew nothing of men or cities. I was one with nature, strong and free."
enkidu.animals: "The gazelles would eat from my hand, and the wolves would sleep beside me. Even the lions respected my strength. We were all creatures of the wild together."

# Enkidu choice keys
enkidu.ask_animals: Ask about the animals
enkidu.ask_equality: Ask about equality with Gilgamesh
enkidu.ask_changes: Ask how he changed
enkidu.gilgamesh: "Gilgamesh! A king proud and strong, but cruel to his people. The gods sent me to match him, to temper his pride with my strength."
enkidu.equality: "We wrestled, Gilgamesh and I, and I matched him blow for blow. In that moment, he found his equal, his brother. From that day, no man could stand against us."
enkidu.civilization: "Shamhat changed me. Six days and seven nights she stayed with me, teaching me the ways of men. The beasts fled from me, for I had become civilized."
enkidu.changes: "Now I wear the clothes of men and eat their bread. I drink their wine and understand their words. But in my heart, I still remember the wild."
enkidu.shamhat: "Shamhat... she was the first to see the man within me. Without her, I would still be running with the beasts, and Gilgamesh would have no equal."
enkidu.humbaba: "Humbaba! The guardian of the Cedar Forest was a terror to behold. His roar shook the earth, and his breath was fire. But together with Gilgamesh, we faced him and we won."
enkidu.death: "I... I feel the hand of the gods upon me. They punish me for slaying Humbaba, for defying the will of heaven. But I do not regret it. I lived as a man, I fought as a warrior, I died as Gilgamesh's brother."
enkidu.ask_civilization: Ask about becoming human
enkidu.leave: I must continue my journey.
enkidu.wild_days: "I ran with gazelles, drank with wild beasts at the water-holes. My body was covered with hair, and I knew nothing of cities or men."
enkidu.gilgamesh: "Gilgamesh? He is my brother. We met in Uruk, tested our strength, and found we were equal. Now we are as one."
enkidu.civilization: "Shamhat taught me. She showed me bread and wine, clothed my body, and brought me to Gilgamesh. I am now a man."

# Ishtar Dialogues
ishtar.greet: "I am Ishtar, goddess of love and war, queen of Uruk. None may ignore my presence."
ishtar.ask_love: Ask about love
ishtar.ask_war: Ask about her warrior aspect
ishtar.ask_gilgamesh: Ask about Gilgamesh's refusal
ishtar.offer_self: Hear the goddess's offer
ishtar.reject_harsh: Reject her with scorn for her past lovers
ishtar.reject_firm: Refuse her firmly but without insult
ishtar.hear_wrath: Hear her answer
ishtar.leave: I will not anger a goddess.
ishtar.love: "You are bold to approach me. But know this: my love brings both joy and sorrow. My lovers do not long endure."
ishtar.proposition: "Come to me, Gilgamesh — be my husband. I will harness for you a chariot of lapis and gold."
ishtar.rejected_harsh: "You list the fates of my lovers? Then hear my curse — I will send the Bull of Heaven against you!"
ishtar.rejected_firm: "You refuse the queen of heaven? Then let Anu send the Bull of Heaven to punish your pride!"
ishtar.wrath: "The Bull of Heaven shall come to Uruk. The market will shake. Stand against it if you dare."
ishtar.war: "I am also the bringer of battle. When my heart is stirred, none may stand before me. The Bull of Heaven obeyed my command."
ishtar.gilgamesh: "He dared refuse me! The insolent king! He compared me to a faulty door and a broken shoe. For this, he will know my wrath."

# Shamhat Dialogues
shamhat.greet: "I am Shamhat, priestess of Ishtar. The gods work through mortal hands."
shamhat.ask_enkidu: Ask about Enkidu
shamhat.ask_gilgamesh: Ask about the king
shamhat.ask_love: Ask about love's power
shamhat.leave: I must attend to my duties.
shamhat.enkidu: "Enkidu? I found him at the water-hole, wild and hairy as a beast. For six days and seven nights I loved him, and when I was done, he was a man."
shamhat.gilgamesh: "Gilgamesh rules Uruk with strength, but his people suffered until Enkidu came to challenge him."
shamhat.love: "Love is the greatest power of the gods. It can tame the wildest heart and make a man of a beast."

# Humbaba Dialogues
humbaba.greet: "Who dares enter my forest? I am Humbaba, and none may pass without my leave!"
humbaba.ask_mercy: Beg for your life
humbaba.ask_fight: Challenge the guardian
humbaba.continue_fight: Press the attack
humbaba.finish_fight: Deal the final blow
humbaba.ask_already_dead: Look upon the fallen guardian
humbaba.press_on: (Strike again.)
humbaba.leave: Leave quickly while you can.
humbaba.mercy: "Mercy? Ha! The gods appointed me to guard this forest. Leave now, and I will not tear you limb from limb!"
humbaba.fight: "Foolish mortals! My roar is the storm, my breath is fire, and my jaws are death! You will die here!"
humbaba.round_2: "Enkidu at your side — the cedar shakes! Humbaba staggers but does not fall!"
humbaba.defeat: "The guardian falls. The Forest of Cedars is open. Your fame will reach distant shores."
humbaba.defeated: "The guardian of the cedars lies still. The fight is over."

# Utnapishtim Dialogues
utnapishtim.greet: "I am Utnapishtim, survivor of the flood. The gods granted me eternal life. What seek you here?"
utnapishtim.ask_flood: Ask about the Great Flood
utnapishtim.ask_immortality: Ask about eternal life
utnapishtim.ask_plant: Ask about the plant of youth
utnapishtim.dive_for_plant: Dive for the plant
utnapishtim.keep_vigil: Guard the plant without resting
utnapishtim.bathe_rest: Bathe and rest beside the pool
utnapishtim.ask_test: Ask to prove your worth
utnapishtim.leave: I will leave you to your wisdom.
utnapishtim.flood: "The gods sent the flood to destroy all life. But Ea warned me, and I built a great ship. For seven days and nights the waters raged, until all was silent. Then I opened the door, and life returned."
utnapishtim.immortality: "Death is the fate of all men — yet there is a plant that restores youth. If you dive deep and seize it, you may yet win what the gods denied."
utnapishtim.plant: "It grows in the deep of the Waters of Death. Dive, cut it, and do not sleep — a snake watches for the careless."
utnapishtim.dive: "You plunge into the dark water and rise with the plant of youth in your hand."
utnapishtim.win_eternal: "You kept vigil. The plant is yours. Youth and life without end are yours — the epic ends, and you have won what Gilgamesh sought."
utnapishtim.lose_snake: "While you bathed, a snake smelled the plant, stole it, and shed its skin. The road home to Uruk awaits — mortality remains."
utnapishtim.test: "If you would have eternal life, first prove you can stay awake seven days and nights. But be warned: none have succeeded."

# Ur-Shanabi Dialogues
ur_shanabi.greet: "I am Ur-Shanabi, ferryman across the Waters of Death. None may cross without my boat."
ur_shanabi.ask_cross: Ask to cross the waters
ur_shanabi.ask_cost: Ask the price of passage
ur_shanabi.set_sail: Cast off for Utnapishtim
ur_shanabi.leave: I must find another way.
ur_shanabi.cross: "The waters are deadly to touch. Yet for one who has passed the mountain, I will take you."
ur_shanabi.sail: "The boat cuts the Waters of Death. Ahead lies the dwelling of Utnapishtim."
ur_shanabi.cost: "The price is courage. Leave fear behind, and you may cross to see Utnapishtim."

# Scorpion Man Dialogues
scorpion_man.greet: "Halt! None may pass through this gate without my leave. I am the Scorpion Man, guardian of the mountain."
scorpion_man.ask_passage: Ask for passage
scorpion_man.ask_danger: Ask about the tunnel
scorpion_man.leave: Turn back from the gate.
scorpion_man.passage: "You are tall in stature, and your face is like the face of one who seeks life. Enter, if you dare. But the tunnel is dark and long."
scorpion_man.danger: "The tunnel through Mount Mashu stretches for twelve double-hours. None may pass who does not have the courage of the gods themselves."

# Ninsun Dialogues
ninsun.greet: "I am Ninsun, mother of Gilgamesh. The wisdom of the gods flows through my veins."
ninsun.ask_gilgamesh: Ask about her son
ninsun.ask_dreams: Ask about dreams and omens
ninsun.ask_blessing: Ask for a blessing
ninsun.leave: I will leave you in peace, wise mother.
ninsun.gilgamesh: "My son is a king among men, strong as a wild bull. But his heart is restless, and he seeks that which cannot be found."
ninsun.dreams: "The gods speak through dreams. Gilgamesh's dreams foretold the coming of Enkidu, his equal and brother."
ninsun.blessing: "May the gods protect you on your journey. May Shamash guide your steps, and may you return safely to Uruk."

# Anu Dialogues
anu.greet: "I am Anu, father of the gods, ruler of the heavens. What brings you before me?"
anu.ask_ishtar: Ask about Ishtar's request
anu.ask_justice: Ask about justice for the people
anu.leave: I must not trouble the sky god.
anu.ishtar: "Ishtar? She is my daughter, proud and passionate. She requested the Bull of Heaven to punish Gilgamesh for his refusal."
anu.justice: "Justice flows from the heavens. The gods see all, and their judgments are true. But mortal affairs are often beyond our understanding."

# Bull of Heaven Dialogues
bull_of_heaven.greet: "ROOOOAR! The Bull of Heaven comes! None may stand before the wrath of Ishtar!"
bull_of_heaven.attack: "You dare challenge the divine beast? You will be trampled beneath my hooves!"
bull_of_heaven.defeated: "Ghhh... the gods... betray..."

# High Priest of Anu Dialogues
high_priest_anu.greet: "I am the High Priest of Anu, keeper of the heavenly rites. Welcome to the ziggurat of the sky god."
high_priest_anu.ask_ziggurat: Ask about the ziggurat
high_priest_anu.ask_anu: Ask about Anu
high_priest_anu.ask_rituals: Ask about the rituals
high_priest_anu.leave: I will leave you to your duties.
high_priest_anu.ziggurat: "This terrace is the stairway to heaven, where we perform rituals to honor Anu, father of the gods. From its bitumen court the White Temple rises toward his sky."
high_priest_anu.anu: "Anu is the sky god, father of all deities. He rules from the highest heavens, his decrees shaping the fate of kings and commoners alike."
high_priest_anu.rituals: "We offer prayers at dawn and dusk, when the veil between worlds is thinnest. The sacrifices please Anu and bring his blessings upon Uruk."

# High Priestess of Ishtar Dialogues
high_priestess_ishtar.greet: "I am the High Priestess of Ishtar, voice of the goddess of love and war. Approach with respect."
high_priestess_ishtar.ask_goddess: Ask about the goddess
high_priestess_ishtar.ask_temple: Ask about the temple
high_priestess_ishtar.ask_rituals: Ask about the rituals
high_priestess_ishtar.leave: I will not disturb you, holy one.
high_priestess_ishtar.goddess: "Ishtar is both the gentle lover and the fierce warrior. She brings life with one hand and takes it with the other. Her heart is as vast as the heavens."
high_priestess_ishtar.temple: "This ziggurat is adorned with lapis and carnelian, gifts from those who seek her favor. Here we perform the sacred marriage rites that renew the land."
high_priestess_ishtar.rituals: "The rituals of Ishtar involve music, dance, and offerings. She demands both passion and strength from her followers."

# Temple Scribe Dialogues
temple_scribe.greet: "I am a scribe of the temple. The words of the gods are recorded upon clay."
temple_scribe.ask_work: Ask about your work
temple_scribe.ask_tablets: Ask about the clay tablets
temple_scribe.leave: I will not disturb you further.
temple_scribe.work: "I record all offerings made to the gods, every prayer whispered, every sacrifice burned. The clay remembers all."
temple_scribe.tablets: "These tablets contain the wisdom of the ages. When baked in the sun, they last forever. I write in cuneiform, the gift of the gods."

# Royal Guard Dialogues
royal_guard.greet: "I am a guard of the king's palace. None may pass without the king's leave."
royal_guard.ask_duties: Ask about your duties
royal_guard.ask_armor: Ask about your armor
royal_guard.leave: I will go on my way.
royal_guard.duties: "I stand watch at the palace gates, protecting our king Gilgamesh. The walls of Uruk have never been breached under my watch."
royal_guard.armor: "This bronze armor was forged by the finest smiths of Uruk. The plumed helmet marks me as one of the elite guard. It has turned aside many arrows and blades."

# Uruk Noble Dialogues
uruk_noble.greet: "Greetings, traveler. I am a noble of great Uruk."
uruk_noble.ask_wealth: Ask about your wealth
uruk_noble.ask_temples: Ask about temple construction
uruk_noble.leave: I will leave you to your business.
uruk_noble.wealth: "My wealth comes from wise investments and the blessings of the gods. I trade in lapis lazuli, cedar wood, and fine textiles from distant lands."
uruk_noble.temples: "The temples of Uruk are the pride of our city. I have contributed generously to the ziggurats of Anu and Ishtar. A strong temple means strong divine favor."

# Uruk Merchant Dialogues
uruk_merchant.greet: "Welcome to my stall, friend. I have wares from across Mesopotamia."
uruk_merchant.ask_goods: Ask about your goods
uruk_merchant.ask_trade: Ask about trading
uruk_merchant.leave: I will browse elsewhere.
uruk_merchant.goods: "I have fine linens from Ur, lapis lazuli from Magan, cedar wood from the forest, and spices from Meluhha. All the finest goods of the known world."
uruk_merchant.trade: "Trade is the lifeblood of Uruk. I accept grain, wool, metal, and any fine craftsmanship. The balance must always be fair, for the gods watch over honest dealings."

# Potter Dialogues
potter.greet: "Come, see my finest ceramics. Each piece is crafted with care."
potter.ask_craft: Ask about your craft
potter.ask_ziggurat: Ask about ziggurat tiles
potter.leave: I will look at your wares another time.
potter.craft: "I shape the clay from the riverbanks into vessels for the gods. Each pot, each bowl, each tablet bears the mark of my hands and the blessings of the craft."
potter.ziggurat_tiles: "The glaze on these tiles shines like the sun itself. They are made for the ziggurats, to adorn the houses of the gods. The blue ones are for Anu, the red for Ishtar."

# Weaver Dialogues
weaver.greet: "Good day. My looms produce the finest cloth in Uruk."
weaver.ask_fabrics: Ask about your fabrics
weaver.ask_priestly_robes: Ask about priestly robes
weaver.leave: I will see your work later.
weaver.fabrics: "I weave linen so fine it is like moonlight on water. The dye comes from plants and shells, creating colors that please the gods."
weaver.priestly_robes: "The robes for the priests must be perfect. White for Anu, red for Ishtar, gold for the king. Each stitch must honor the wearer's station."

