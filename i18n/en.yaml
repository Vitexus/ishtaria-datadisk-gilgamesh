village_trader.greet: "Peace on your road. Waterskins, rope, seed and tools: what the steppe needs, I have."
village_trader.ask_well: "Where can I fill my waterskin?"
village_trader.well: "The well is on the square, lined with brick, and cold even in summer. Fill the skin there before you walk on to Uruk: the steppe has little water, and the river is a long way."
village_trader.leave: "Peace be with you."
