# NPC Names and Bios
npc.gilgamesh: Gilgamesh
npc.gilgamesh.bio: King of Uruk, two-thirds god and one-third man. Perfect in body, beautiful in appearance, strong as a wild bull. Builder of Uruk's great walls. Wears a golden diadem crown with lapis lazuli inlays, white linen kaunakes skirt with gold embroidery, wide leather belt with gold buckle, gold-decorated sandals, and carries a ceremonial sword at his side.
npc.enkidu: Enkidu
npc.enkidu.bio: Wild man created by the gods from clay. Once covered in long matted hair like a wild beast, living with gazelles. Now civilized, he wears a simple linen tunic with leather belt and sandals, carrying a wooden club. Strong muscular build with wild eyes and long tresses.
npc.enkidu_civilized: Enkidu (Civilized)
npc.enkidu_civilized.bio: Once wild, now civilized. Short-cropped hair, clean-shaven beard, linen tunic with leather armor, bronze axe at belt, sandals. The perfect equal and brother to Gilgamesh.
npc.ishtar: Ishtar
npc.ishtar.bio: Goddess of love and war, patron of Uruk. Proud and tempestuous, she demands respect and offers both passion and destruction. Wears a multi-tiered horned headdress with star symbols, red and gold ceremonial robes with lapis lazuli and carnelian jewelry, carrying a bow as symbol of her warrior aspect.
npc.shamhat: Shamhat
npc.shamhat.bio: Temple priestess of Ishtar. The one who civilized Enkidu through love and wisdom, teaching him the ways of humanity. Wears a gold headdress with lappets, white ceremonial linen robes with embroidered symbols of Ishtar, lapis lazuli and gold jewelry, carrying a ritual staff, perfumed with temple incense.
npc.humbaba: Humbaba
npc.humbaba.bio: "Guardian of the Cedar Forest. A monstrous ogre with terrifying power. His roar is like the storm, his breath like fire, and his jaws are death itself. Appears with sevenfold terrors - face with exaggerated features, body covered in scales, arms ending in claws, wearing a garment of animal hides, crowned with a terror-inducing headdress."
npc.utnapishtim: Utnapishtim
npc.utnapishtim.bio: The only survivor of the Great Flood, granted eternal life by the gods. Wise and ancient, he lives across the Waters of Death. Wears a simple white headband, plain linen robe of immortal wisdom, carrying the signet of eternal life, with long white beard.
npc.ur_shanabi: Ur-Shanabi
npc.ur_shanabi.bio: Ferryman who transports travelers across the Waters of Death to Utnapishtim's dwelling. Wears a simple cloth turban, plain linen loincloth, carrying a long oar for his boat.
npc.scorpion_man: Scorpion Man
npc.scorpion_man.bio: Guardian of the gate to the tunnel through Mount Mashu. A terrifying creature with the body of a scorpion and a man. Half-man half-scorpion hybrid with scorpion tail and claws, wearing ceremonial guard armor with scorpion-themed headdress.
npc.ninsun: Ninsun
npc.ninsun.bio: Mother of Gilgamesh, a wise goddess. She interprets her son's dreams and offers guidance and protection. Wears divine mother's white robes with gold and lapis lazuli jewelry, simple headband with mother-of-pearl inlays, carrying a sacred scepter.
npc.anu: Anu
npc.anu.bio: Sky god and father of Ishtar. Ruler of the heavens, his word carries the weight of the cosmos. Wears a tall horned crown symbolizing heavenly authority, long flowing beard, blue robes representing the sky, gold and lapis lazuli adornments, carrying the tablet of destinies.
npc.bull_of_heaven: Bull of Heaven
npc.bull_of_heaven.bio: Divine beast sent by Ishtar to punish Gilgamesh. A monstrous bull that brings destruction in its wake. Appears as a divine beast form with golden hide, massive horns, hooves that shake the earth, celestial aura, embodying the wrath of Ishtar.
npc.ninsun: Ninsun
npc.ninsun.bio: Mother of Gilgamesh, a wise goddess. She interprets her son's dreams and offers guidance and protection.
npc.anu: Anu
npc.anu.bio: Sky god and father of Ishtar. Ruler of the heavens, his word carries the weight of the cosmos.
npc.bull_of_heaven: Bull of Heaven
npc.bull_of_heaven.bio: Divine beast sent by Ishtar to punish Gilgamesh. A monstrous bull that brings destruction in its wake.

# Historical Mesopotamian NPCs
npc.high_priest_anu: High Priest of Anu
npc.high_priest_anu.bio: High priest of the sky god Anu, wearing traditional white linen robes with lapis lazuli beads in intricate patterns, tall ceremonial headdress with symbolic representations of the heavens, carries a ritual censer for incense offerings, performs sacred rituals at the ziggurat of Anu.
npc.high_priestess_ishtar: High Priestess of Ishtar
npc.high_priestess_ishtar.bio: High priestess of the goddess of love and war, dressed in elaborate red and gold ceremonial garments with lapis lazuli and carnelian inlays, multi-tiered headdress with star symbols, carries a sacred dagger and ritual vessels, interprets the will of Ishtar through divine omens.
npc.temple_scribe: Temple Scribe
npc.temple_scribe.bio: Scholar who records temple offerings and astronomical observations on clay tablets. Wears a simple white linen robe with a clay tablet case at his belt, stylus tucked behind his ear, carries a measuring rod for architectural calculations.
npc.royal_guard: Royal Guard of Uruk
npc.royal_guard.bio: Elite soldier of Uruk's royal guard, wearing polished bronze scale armor, plumed helmet with gold accents, leather kilt, carries a spear and shield decorated with the royal insignia, loyal protector of the king and the palace.
npc.uruk_noble: Noble of Uruk
npc.uruk_noble.bio: Wealthy citizen of Uruk, dressed in fine pleated linen robe with gold embroidered trim, lapis lazuli and gold jewelry including rings and amulets, carries a ceremonial staff, patron of the arts and temple construction.
npc.uruk_merchant: Merchant of Uruk
npc.uruk_merchant.bio: Trader of goods from across Mesopotamia and beyond. Wears a colorful woven robe from distant lands, carries a bronze balance scale, leather pouch for coins, brings exotic goods and news from foreign cities.
npc.potter: Potter
npc.potter.bio: Master craftsman who creates ceremonial pottery for temples and nobility. Wears a clay-smeared leather apron over a simple tunic, hands skilled from years of shaping clay, carries a wooden potter's wheel tool.
npc.weaver: Weaver
npc.weaver.bio: Skilled textile worker who creates fine garments from wool and flax. Wears a simple linen dress with a weaving shuttle in her belt, hair tied back with a cloth band, expert in creating patterns and dyes.

# Gilgamesh Dialogues
gilgamesh.greet: "I am Gilgamesh, king of Uruk, two-thirds god and one-third man. What brings you before me?"
gilgamesh.ask_advice: Ask the king for wisdom
gilgamesh.ask_friendship: Speak of Enkidu
gilgamesh.ask_quest: Ask about his adventures
gilgamesh.leave: I must go, my king.
gilgamesh.advice: "The gods have given me strength and wisdom. I rule this city with justice and build its walls to stand forever."
gilgamesh.friendship: "Enkidu? He is my brother, my equal. Together we faced Humbaba and the Bull of Heaven. His death weighs heavy on my heart."
gilgamesh.greet: "I am Gilgamesh, king of Uruk, two-thirds god and one-third man. What brings you before me?"
gilgamesh.ask_advice: Ask the king for wisdom
gilgamesh.ask_friendship: Speak of Enkidu
gilgamesh.ask_quest: Ask about his adventures
gilgamesh.ask_city: Ask about Uruk
gilgamesh.ask_mortality: Ask about mortality
gilgamesh.leave: I must go, my king.
gilgamesh.advice: "The gods have given me strength and wisdom. I rule this city with justice and build its walls to stand forever."
gilgamesh.walls: "The walls of Uruk! Two outer walls with an inner wall between them. Built with my own hands and the help of Enkidu, they stand as a testament to our power. No enemy may breach them!"
gilgamesh.friendship: "Enkidu? He is my brother, my equal. Together we faced Humbaba and the Bull of Heaven. His death weighs heavy on my heart."
gilgamesh.enkidu_fate: "The gods punished him for our hubris in slaying Humbaba. Six days and seven nights he suffered before death took him. I mourn him still."
gilgamesh.quest: "I have journeyed to the ends of the earth seeking eternal life. But I have learned that mortality is the fate of all men."
gilgamesh.cedar_forest: "The Cedar Forest! A place of terrible power and great beauty. Humbaba guarded it well, but we felled the mighty cedars and claimed victory for Uruk."
gilgamesh.about_uruk: "Uruk is my city, the greatest city in all the land. From its walls to its temples, from its market to its palace, all is under my protection."
gilgamesh.mortality: "I sought eternal life, traveled beyond the Waters of Death, met Utnapishtim himself. And yet... I learned that the greatest truth is that all men must die."
gilgamesh.lesson: "What does it mean to be mortal? It means to live fully, to build, to love, to fight, to rule. The gods have their domain, but men have this world and this time. Make the most of it."
gilgamesh.enkidu: "My brother... my equal... gone from this world. But his memory lives on in every stone of Uruk's walls."

