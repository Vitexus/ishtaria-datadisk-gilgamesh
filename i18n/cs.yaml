gilgamesh.ask_lesson: Ptej se na poučení o smrtelnosti

# Gilgameš v chrámu
gilgamesh_temple.greet: "Zde v chrámu Eanna nalézám klid. Bohové mluví prostřednictvím ticha těchto kamenů."
gilgamesh_temple.pray: Modli se s králem
gilgamesh_temple.leave: Nechám tě s tvými myšlenkami.
gilgamesh_temple.prayer: "Modleme se k Anovi a velkým bohům za jejich požehnání Uruku a jeho lidu."

# Enkidův dialog
enkidu.greet: "Já jsem Enkidu. Hory mě zrodily; Šamḫat mě přivedla k chlebu a pivu. Teď stojím s Gilgamešem — stejná síla, jedno srdce."
enkidu.ask_wild_days: Ptej se na jeho divoké dny
enkidu.ask_gilgamesh: Ptej se na Gilgameše
enkidu.ask_civilization: Ptej se na civilizaci
enkidu.ask_shamhat: Ptej se na Šamchat
enkidu.ask_humbaba: Ptej se na Humbabu
enkidu.ask_death: Ptej se na jeho smrt
enkidu.challenge_duel: Vyzvi ho k přátelskému zápasu
enkidu.duel_done: "Ha! Úder za úder — jsi můj rovný. Od tohoto dne jsme bratři ve zbrani."
enkidu.leave: Musím jít.
enkidu.wild_days: "Kdysi jsem běhal s gazelami a pil s divokými zvířaty u vodního zdroje. Nic jsem nevěděl o lidech či městech. Byl jsem jedno se přírodou, silný a svobodný."
enkidu.animals: "Gazely jedly z mé ruky a vlci spali vedle mě. Dokonce i lvi respektovali moji sílu. Byli jsme všichni divokou přírodou spojeni."
enkidu.gilgamesh: "Gilgameš! Král pyšný a silný, ale krutý ke svému lidu. Bohové mě poslali, abych se mu vyrovnal, abych jeho pýchu zmírnil svou silou."
enkidu.equality: "Zápasili jsme, Gilgameš a já, a já mu vyrovnal úder za úderem. V ten okamžik nalezl svého rovného, svého bratra. Od toho dne nás nikdo nemohl porazit."
enkidu.civilization: "Šamchat mě změnila. Šest dní a sedm nocí se mnou zdržela, učila mě způsobům lidí. Zvířata ode měla prchala, neboť jsem se stal civilizovaným."
enkidu.changes: "Nyní nosím šaty lidí a jím jejich chléb. Piju jejich víno a rozumím jejich slovům. Ale ve svém srdci si stále pamatuji na divočin."
enkidu.shamhat: "Šamchat... ona byla první, kdo ve mně uviděla muže. Bez ní bych stále běhal se zvířaty a Gilgameš by neměl svého rovného."

# Enkidu choice keys (Czech)
enkidu.ask_animals: Ptej se na zvířata
enkidu.ask_equality: Ptej se na rovnost s Gilgamešem
enkidu.ask_changes: Ptej se, jak se změnil
enkidu.humbaba: "Humbaba! Strážce Cedrového lesa byl hrozný na pohled. Jeho řev otřásal zemí a jeho dech byl oheň. Ale spolu s Gilgamešem jsme ho čelili a vyhráli."
enkidu.death: "Já... cítím ruku bohů na sobě. Trestají mě za zabití Humbaby, za to, že jsem se vzepřel vůli nebes. Ale nelituji toho. Žil jsem jako muž, bojoval jsem jako válečník, zemřu jako Gilgamešův bratr."
enkidu.ask_gilgamesh: Ptej se na Gilgameše
enkidu.ask_civilization: Ptej se na to, jak se stal člověkem
enkidu.leave: Musím pokračovat v cestě.
enkidu.wild_days: "Běhal jsem s gazelami, pil jsem s divokými zvířaty u vodních děr. Moje tělo bylo pokryté chlupy a já jsem nic nevěděl o městech či lidech."
enkidu.gilgamesh: "Gilgameš? On je můj bratr. Potkali jsme se v Uruku, změřili naše síly a zjistili jsme, že jsme si rovni. Nyní jsme jedno."
enkidu.civilization: "Šamchat mě to naučila. Ukázala mi chléb a víno, oblékla mé tělo a přivedla mě k Gilgamešovi. Nyní jsem člověk."

# Ištariny dialogy
ishtar.greet: "Já jsem Ištar, bohyně lásky a války, královna Uruku. Nikdo nesmí ignorovat mou přítomnost."
ishtar.ask_love: Zeptat se na lásku
ishtar.offer_self: Vyslechnout nabídku bohyně
ishtar.reject_harsh: Odmítnout ji s výsměchem jejím milencům
ishtar.reject_firm: Odmítnout pevně, bez urážky
ishtar.hear_wrath: Vyslechnout její odpověď
ishtar.proposition: "Pojď ke mně, Gilgameši — buď mým manželem. Zapřáhnu ti vůz z lapisu a zlata."
ishtar.rejected_harsh: "Vyjmenováváš osudy mých milenců? Pak slyš mou kletbu — pošlu na tebe Nebeského býka!"
ishtar.rejected_firm: "Odmítáš královnu nebes? Pak ať Anu pošle Nebeského býka potrestat tvou pýchu!"
ishtar.wrath: "Nebeský býk přijde do Uruku. Trh se zatřese. Postav se mu, odvážíš-li se."
ishtar.ask_war: Ptej se na její válečnickou stránku
ishtar.ask_gilgamesh: Ptej se na Gilgamešovo odmítnutí
ishtar.leave: Nechci si znášet hněv bohyně.
ishtar.love: "Jsi odvážný, že se ke mně přibližuješ. Ale věz, že moje láska přináší jak radost, tak bolest. Moji milenci dlouho nevydrží."
ishtar.war: "Já jsem také nositelka bitev. Když je mé srdce pohněno, nikdo nestojí před mou silou. Nebeský býk poslechl mého rozkazu."
ishtar.gilgamesh: "Odvážil se mě odmítnout! Ten drzý král! Porovnal mě se špatnými dveřmi a rozbitou obuví. Za to pozná můj hněv."

# Šamchatiny dialogy
shamhat.greet: "Já jsem Šamchat, kněžka Ištar. Bohové působí prostřednictvím smrtelných rukou."
shamhat.ask_enkidu: Ptej se na Enkidu
shamhat.ask_gilgamesh: Ptej se na krále
shamhat.ask_love: Ptej se na moc lásky
shamhat.leave: Musím se věnovat svým povinnostem.
shamhat.enkidu: "Enkidu? Našla jsem ho u vodní díry, divokého a chlupatého jako zvíře. Po šest dní a sedm nocí jsem ho milovala, a když jsem skončila, stal se z něj muž."
shamhat.gilgamesh: "Gilgameš vládne Uruku silou, ale jeho lid trpěl, dokud nepřišel Enkidu, aby ho vyzval."
shamhat.love: "Láska je největší moc bohů. Dokáže zkrotit i to nejdivočejší srdce a udělat z bestie člověka."

# Humbabovy dialogy
humbaba.greet: "Kdo se odvažuje vstoupit do mého lesa? Já jsem Humbaba a nikdo nesmí projít bez mého souhlasu!"
humbaba.ask_mercy: Pros o život
humbaba.ask_fight: Vyraž strážce
humbaba.continue_fight: Pokračuj v útoku
humbaba.finish_fight: Zasaď poslední ránu
humbaba.ask_already_dead: Pohleď na padlého strážce
humbaba.press_on: (Udeř znovu.)
humbaba.leave: Uteč rychle, dokud můžeš.
humbaba.mercy: "Milost? Ha! Bohové mě ustanovili strážcem tohoto lesa. Odejdi nyní a já ti neroztrhám údy!"
humbaba.fight: "Pošetilí smrtelníci! Můj řev je bouře, můj dech je oheň a mé čelisti jsou smrt! Zde zemřeš!"
humbaba.round_2: "Enkidu po tvém boku — cedr se třese! Humbaba klopýtá, ale nepadá!"
humbaba.defeat: "Strážce padá. Les cedrů je otevřený. Tvá sláva dosáhne vzdálených břehů."
humbaba.defeated: "Strážce cedrů leží tiše. Boj je u konce."

# Utnapištimovy dialogy
utnapishtim.greet: "Já jsem Utnapištim, přeživší potopy. Bohové mi darovali věčný život. Co zde hledáš?"
utnapishtim.ask_flood: Ptej se na Velkou potopu
utnapishtim.ask_immortality: Ptej se na věčný život
utnapishtim.ask_plant: Ptej se na rostlinu mládí
utnapishtim.dive_for_plant: Ponoř se pro rostlinu
utnapishtim.keep_vigil: Střež rostlinu bez odpočinku
utnapishtim.bathe_rest: Vykoupej se a odpočiň u tůně
utnapishtim.ask_test: Ptej se, jak prokázat svou hodnotu
utnapishtim.leave: Nechám tě s tvou moudrostí.
utnapishtim.flood: "Bohové vyslali potopu, aby zničili veškerý život. Ale Ea mě varoval a já jsem postavil velkou loď. Po sedm dní a nocí zuřily vody, dokud vše nezmlklo. Pak jsem otevřel dveře a život se vrátil."
utnapishtim.immortality: "Smrt je osudem všech lidí — přesto existuje rostlina, která vrací mládí. Ponoříš-li se hluboko a uchopíš ji, můžeš vyhrát to, co bohové odepřeli."
utnapishtim.plant: "Roste v hlubinách Vod smrti. Ponoř se, uřízni ji a nespě — had číhá na neopatrné."
utnapishtim.dive: "Ponoříš se do temné vody a vynoříš se s rostlinou mládí v ruce."
utnapishtim.win_eternal: "Bděl jsi. Rostlina je tvá. Mládí a život bez konce jsou tvé — epos končí a ty jsi získal, co Gilgameš hledal."
utnapishtim.lose_snake: "Zatímco ses koupal, had ucítil rostlinu, ukradl ji a svlékl kůži. Cesta domů do Uruku čeká — smrtelnost zůstává."
utnapishtim.test: "Pokud chceš věčný život, nejprve prokaž, že dokážeš zůstat vzhůru sedm dní a nocí. Ale buď varován: nikomu se to ještě nepovedlo."

# Ur-Šanabiho dialogy
ur_shanabi.greet: "Já jsem Ur-Šanabi, převozník přes Vody smrti. Nikdo nesmí přejít bez mého člunu."
ur_shanabi.ask_cross: Požádej o přepravu přes vody
ur_shanabi.ask_cost: Ptej se na cenu za převoz
ur_shanabi.set_sail: Vypluj k Utnapištimovi
ur_shanabi.leave: Musím najít jiný způsob.
ur_shanabi.cross: "Vody jsou smrtelné na dotek. Přesto toho, kdo prošel horou, převezu."
ur_shanabi.sail: "Člun řeže Vody smrti. Vpředu leží příbytek Utnapištima."
ur_shanabi.cost: "Cena je odvaha. Nech strach za sebou a můžeš přejít k Utnapištimovi."

# Štířího muže dialogy
scorpion_man.greet: "Zastav! Nikdo nesmí projít touto branou bez mého souhlasu. Já jsem Štírí muž, strážce hory."
scorpion_man.ask_passage: Požádej o průchod
scorpion_man.ask_danger: Ptej se na nebezpečí tunelu
scorpion_man.leave: Vrať se od brány.
scorpion_man.passage: "Jsi vysoký postavením a tvá tvář je jako tvář toho, kdo hledá život. Vejdi, pokud se odvážíš. Ale tunel je temný a dlouhý."
scorpion_man.danger: "Tunel skrz Horu Mašu se táhne po dvanáct dvojitých hodinách. Nikdo nesmí projít, kdo nemá odvahu samotných bohů."

# Ninsuniny dialogy
ninsun.greet: "Já jsem Ninsun, matka Gilgameše. Moudrost bohů proudí mými žilami."
ninsun.ask_gilgamesh: Ptej se na jejího syna
ninsun.ask_dreams: Ptej se na sny a znamení
ninsun.ask_blessing: Požádej o požehnání
ninsun.leave: Nechám tě v klidu, moudrá matko.
ninsun.gilgamesh: "Můj syn je králem mezi muži, silný jako divoký býk. Ale jeho srdce je neklidné a hledá to, co nalezeno být nemůže."
ninsun.dreams: "Bohové mluví prostřednictvím snů. Gilgamešovy sny předpověděly příchod Enkidu, jeho rovného a bratra."
ninsun.blessing: "Nechť tě bohové chrání na tvé cestě. Nechť Šamaš vede tvé kroky a nechť se vrátíš zpět v bezpečí do Uruku."

# Anův dialog
anu.greet: "Já jsem Anu, otec bohů, vládce nebes. Co tě přivádí přede mne?"
anu.ask_ishtar: Ptej se na Ištarinou žádost
anu.ask_justice: Ptej se na spravedlnost pro lid
anu.leave: Nesmím obtěžovat nebeského boha.
anu.ishtar: "Ištar? Ta je moje dcera, pyšná a vášnivá. Požádala o Nebeského býka, aby potrestala Gilgameše za jeho odmítnutí."
anu.justice: "Spravedlnost proudí z nebes. Bohové vidí vše a jejich soud je pravdivý. Ale smrtelné záležitosti jsou často mimo naše chápání."

# Nebeský býk dialogy
bull_of_heaven.greet: "ŘÍÍÍÍÍÍ! Přichází Nebeský býk! Nikdo nestojí před hněvem Ištar!"
bull_of_heaven.attack: "Odvažuješ se vyzvat božské zvíře? Budeš ušlapán pod mými kopyty!"
bull_of_heaven.defeated: "Hrrr... bohové... zrada..."

# Vysoký kněz Anu dialogy
high_priest_anu.greet: "Já jsem Vysoký kněz Anu, strážce nebeských rituálů. Vítejte na zikkuratu boha nebes."
high_priest_anu.ask_ziggurat: Ptej se na zikkurat
high_priest_anu.ask_anu: Ptej se na Anu
high_priest_anu.ask_rituals: Ptej se na rituály
high_priest_anu.leave: Nechám tě u tvých povinností.
high_priest_anu.ziggurat: "Tato terasa je schodištěm do nebe, kde vykonáváme rituály na počest Anu, otce bohů. Z jejího bitumenového nádvoří se Bílý chrám zvedá k jeho nebi."
high_priest_anu.anu: "Anu je bůh nebes, otec všech božstev. Vládne z nejvyšších nebes, jeho výnosy utvářejí osud králů i obyčejných lidí."
high_priest_anu.rituals: "Modlíme se při úsvitu a soumraku, kdy je závoj mezi světy nejtenčí. Oběti potěší Anu a přinesou jeho požehnání Uruku."

# Vysoká kněžka Ištar dialogy
high_priestess_ishtar.greet: "Já jsem Vysoká kněžka Ištar, hlas bohyně lásky a války. Přistupuj s úctou."
high_priestess_ishtar.ask_goddess: Ptej se na bohyni
high_priestess_ishtar.ask_temple: Ptej se na chrám
high_priestess_ishtar.ask_rituals: Ptej se na rituály
high_priestess_ishtar.leave: Nebudu tě rušit, svatá.
high_priestess_ishtar.goddess: "Ištar je jak něžná milenka, tak i zuřivá válečnice. Jednou rukou přináší život, druhou ho bere. Její srdce je tak rozlehlé jako nebesa."
high_priestess_ishtar.temple: "Tento zikkurat je ozdoben lapis lazuli a karneolem, dary od těch, kteří hledají její přízeň. Zde vykonáváme posvátné obřady svatebního sňatku, které obnovují zemi."
high_priestess_ishtar.rituals: "Rituály Ištar zahrnují hudbu, tanec a oběti. Vyžaduje od svých následovníků jak vášeň, tak i sílu."

# Písařův dialog
temple_scribe.greet: "Já jsem písař chrámu. Slova bohů jsou zaznamenána na hliněných destičkách."
temple_scribe.ask_work: Ptej se na svou práci
temple_scribe.ask_tablets: Ptej se na hliněné destičky
temple_scribe.leave: Nebudu tě dále rušit.
temple_scribe.work: "Zaznamenávám všechny oběti věnované bohům, každou šepotající modlitbu, každou hořící oběť. Hlína si pamatuje všechno."
temple_scribe.tablets: "Tyto destičky obsahují moudrost věků. Když se vypálí na slunci, vydrží navěky. Píšu klínovým písmem, darem bohů."

# Královský strážce dialog
royal_guard.greet: "Já jsem strážce královského paláce. Nikdo nesmí projít bez králevova souhlasu."
royal_guard.ask_duties: Ptej se na své povinnosti
royal_guard.ask_armor: Ptej se na svůj brnění
royal_guard.leave: Půjdu svou cestou.
royal_guard.duties: "Stojím na stráži u palácových bran a chráním našeho krále Gilgameše. Hradby Uruku nebyly pod mým dohledem nikdy proraženy."
royal_guard.armor: "Toto bronzové brnění vykovali nejlepší kováři Uruku. Chocholatá přilba mě označuje jako jednoho z elitní stráže. Odrazila již mnohé šípy a meče."

# Uruk šlechtic dialog
uruk_noble.greet: "Vítám tě, cestovateli. Já jsem šlechtic velkého Uruku."
uruk_noble.ask_wealth: Ptej se na své bohatství
uruk_noble.ask_temples: Ptej se na stavbu chrámů
uruk_noble.leave: Nechám tě u tvých záležitostí.
uruk_noble.wealth: "Moje bohatství pochází z moudrých investic a požehnání bohů. Obchoduju s lapis lazuli, cedrovým dřevem a jemnými textiliemi z dalekých zemí."
uruk_noble.temples: "Chrámy Uruku jsou pýchou našeho města. Přispěl jsem štědře na zikkuraty Anu a Ištar. Silný chrám znamená silnou božskou přízeň."

# Obchodník z Uruku dialog
uruk_merchant.greet: "Vítej u mého stánku, příteli. Mám zboží z celé Mezopotámie."
uruk_merchant.ask_goods: Ptej se na své zboží
uruk_merchant.ask_trade: Ptej se na obchod
uruk_merchant.leave: Podívám se jinam.
uruk_merchant.goods: "Mám jemné lněné tkaniny z Ur, lapis lazuli z Maganu, cedrové dřevo z lesa a koření z Meluhhy. Vše nejlepší zboží známého světa."
uruk_merchant.trade: "Obchod je životadní silou Uruku. Přijímám obilí, vlnu, kov a jakékoli jemné řemeslné výrobky. Váha musí být vždy spravedlivá, neboť bohové dohlíží na poctivé obchodování."

# Hrnčířův dialog
potter.greet: "Pojď, podívej se na mé nejlepší keramiku. Každý kus je vytvořen s péčí."
potter.ask_craft: Ptej se na svoje řemeslo
potter.ask_ziggurat: Ptej se na dlaždičky zikkuratu
potter.leave: Podívám se na tvé zboží později.
potter.craft: "Tvaruju hlínu z řek do nádob pro bohy. Každý hrnec, každá mísa, každá destička nese značku mých rukou a požehnání řemesla."
potter.ziggurat_tiles: "Glazura na těchto dlaždicích se třpytí jako samo slunce. Jsou určeny pro zikkuraty, aby ozdobily příbytky bohů. Modré jsou pro Anu, červené pro Ištar."

# Tkadlena dialog
weaver.greet: "Dobrý den. Moje tkalcovské stavy produkují nejjemnější látky v Uruku."
weaver.ask_fabrics: Ptej se na své látky
weaver.ask_priestly_robes: Ptej se na kněžská roucha
weaver.leave: Podívám se na tvé práce později.
weaver.fabrics: "Tku látku tak jemnou, že je jako měsíční světlo na vodě. Barvivo pochází z rostlin a mušlí, vytvářející barvy, které potěší bohy."
weaver.priestly_robes: "Roucha pro kněze musí být dokonalá. Bílá pro Anu, červená pro Ištar, zlatá pro krále. Každý steh musí ctít postavení nositele."

