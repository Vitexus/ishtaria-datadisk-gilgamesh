# More legends told by the elders (Etana, Adapa, Dilmun, Nergal and Ereshkigal).
elder_tales_man.ask_etana: "Pověz mi o Etanovi a orlu."
elder_tales_man.etana: "Královská moc sestoupila z nebe do Kiše a pastýř Etana neměl syna. Orel a had si přísahali při Šamašovi a orel sežral hadí mláďata; had ho chytil do jámy a Etana ho zachránil. Orel ho vynesl k bráně Anově pro rostlinu zrození a podruhé se Etana pevně držel. Tak měl Kiš syna, Balihu. Když bezdětný muž hledí na nebe, myslí na Etanu."
elder_tales_man.ask_adapa: "Proč může zemřít i moudrý?"
elder_tales_man.adapa: "Adapa z Eridu, kněz Eův, šel na ryby a jižní vítr mu převrhl loď; zlomil mu křídlo a sedm dní nevál žádný vítr. Anu ho zavolal na nebe. Ea ho varoval: nic tam nejez, zabilo by tě to. Adapa truchlil pro strážce brány a odmítl chléb a vodu, které mu Anu nabídl, a Anu se zasmál: teď nebudeš žít navěky. Proto máme horečku a hrob a máme Adapovu moudrost."
elder_tales_woman.ask_dilmun: "Pověz mi o Dilmunu a osmi rostlinách."
elder_tales_woman.dilmun: "Dilmun byla čistá země bez sladké vody; Enki dal Utuovi přinést ji a země zezelenala. Enki a Ninhursag měli dceru, její dceru a Uttu; ze semene, které Ninhursag zasela, vyrostlo osm rostlin. Enki je snědl a Ninhursag odvrátila oko; chřadl, dokud se nevrátila a nezrodila boha pro každou bolest. Proto má každá bylina svého boha a každá bolest svého pomocníka."
elder_tales_woman.ask_nergal: "Proč spolu bydlí mor a mrtví?"
elder_tales_woman.nergal: "Na hostině bohů povstali všichni pro Namtara, posla Ereškigal, jen Nergal zůstal sedět. Královna pro něj poslala; Ea mu dal čtrnáct pomocníků a on vtrhl do jejího paláce, chytil ji za vlasy a ona mu nabídla svou královskou moc. Bůh moru a královna mrtvých jsou tedy manželé, dítě. Kdo se bojí horečky, nesmí zapomenout na mrtvé."

# The author's disclaimer (places/author_disclaimer.yaml).
place.author_disclaimer: "Hliněná tabulka: Prohlášení pokorného služebníka Enkiho"
knowledge.author_disclaimer.title: "Prohlášení pokorného služebníka Enkiho"
knowledge.author_disclaimer.text: "Já, autor tohoto světa, pokorný služebník Enkiho, nejmoudřejšího z pánů, vládce sladkých vod a Apsú, prohlašuji před všemi bohy i každým čtenářem: nenesu odpovědnost za strasti, které světu způsobila Ištar zvaná Inanna. Ani za její sestup do země bez návratu, po němž býk nenaskakoval krávu a žádný muž se nedíval na dívku. Ani za nebeského býka, který rozšlapal Uruk, ani za milence, které proměnila ve vlky a krtky. Neodpovídám ani za jejího otce Ana, suchého nebeského úředníka, jehož každé rozhodnutí vyžaduje tři pečetě, usnášeníschopnost a hliněnou stvrzenku. (Někteří říkají, že jejím otcem je Sin, měsíc; autor v to doufá, kvůli Anovi.) Cokoli bohové učinili, když jsem se nedíval, učinili bez mého souhlasu. Stížnosti lze nechat u paty této tabulky: Enki je vyslechne a nejmoudřejším možným způsobem s nimi nic neudělá."
lore.author_disclaimer.title: "Prohlášení pokorného služebníka Enkiho"
lore.author_disclaimer: "Já, autor tohoto světa, pokorný služebník Enkiho, nejmoudřejšího z pánů, vládce sladkých vod a Apsú, prohlašuji před všemi bohy i každým čtenářem: nenesu odpovědnost za strasti, které světu způsobila Ištar zvaná Inanna. Ani za její sestup do země bez návratu, po němž býk nenaskakoval krávu a žádný muž se nedíval na dívku. Ani za nebeského býka, který rozšlapal Uruk, ani za milence, které proměnila ve vlky a krtky. Neodpovídám ani za jejího otce Ana, suchého nebeského úředníka, jehož každé rozhodnutí vyžaduje tři pečetě, usnášeníschopnost a hliněnou stvrzenku. (Někteří říkají, že jejím otcem je Sin, měsíc; autor v to doufá, kvůli Anovi.) Cokoli bohové učinili, když jsem se nedíval, učinili bez mého souhlasu. Stížnosti lze nechat u paty této tabulky: Enki je vyslechne a nejmoudřejším možným způsobem s nimi nic neudělá."

# Narážky na legendy v řeči dalších postav (ninsun, gilgamesh, high_priest_anu, tablet_writer, weaver, potter, smith, uruk_alewife, uruk_farmer).
ninsun.ask_clay: "Co mu říkáš o jeho původu?"
ninsun.clay: "Když bohové byli člověkem, bohyně rození Mami nás stvořila z hlíny a krve boha. Můj syn je ze dvou částí bůh a z jedné člověk, a na tu lidskou část si musí pamatovat: je z hlíny a hlína se vrací do země. Starou povídku o Atrachasísovi mu vyprávím každý rok a každý rok zapomene poslední řádek."
gilgamesh.ask_ishtar_below: "Co říkáš o Ištařině sestupu?"
gilgamesh.ishtar_below: "Sestoupila do země bez návratu, u sedmi bran jí vzali všechno a vystoupila s účtem: někdo jiný musí jít na její místo. Její manžel Tammuz, tak vede účty. Divíš se, že jsem jejím mužem být nechtěl? Bohyně, která vydá milého démonům, není dobrá manželka. A její otec Anu by chtěl celou věc ve třech opisech."
high_priest_anu.ask_adapa: "Slyšel jsem, že se Anu jednou zasmál."
high_priest_anu.adapa: "Zasmál, s Adapou z Eridu, když mudrc na Eovu radu odmítl chléb života: „Proč jsi nejedl?“ Je to zapsáno v chrámovém záznamu v náležité formě, se třemi pečetěmi. Nevěř těm, kdo mého pána nazývají suchým. Je přesný. Svět s menší přesností dostane Ištar, nebeského býka a potopu v jednom roce."
tablet_writer.ask_incipit: "Jak od sebe tabulky rozlišujete?"
tablet_writer.incipit: "Podle prvních slov, jako každou dlouhou píseň. „Když bohové byli člověkem“ je příběh o Atrachasísovi, tři tabulky. „Když nahoře“ je novoroční píseň o Mardukovi, sedm. „Ten, kdo viděl Hlubinu“ je píseň o Gilgamešovi, dvanáct. Ta o Ištar a sedmi branách se jmenuje podle země, kam jde: Země bez návratu. Dobrý písař napíše název na konec tabulky, aby ji další písař neopsal dvakrát."
weaver.ask_uttu: "Je nějaká bohyně tkaní?"
weaver.uttu: "Uttu, paní stavu, dcera Ninkurry, které Enki nedal pokoj. Ninhursag z ní jeho semeno vyňala a zasela je a vyrostlo osm rostlin. Proto tkadlena zavře dveře, když cizinec žádá jemné plátno."
potter.ask_clay_man: "Říká se, že člověk je z hlíny."
potter.clay_man: "Věřím tomu. Bohyně rození Mami vzala hlínu a krev zabitého boha a Enki ji hnětl, jako hnětu já tu svou; čtrnáct kousků, sedm mužů a sedm žen. Hlína musí odpočinout, než se s ní pracuje, a oni také: deset měsíců. Igigi kopali kanály a pak spálili nářadí. Znám ten pocit: když praskne pec."
smith.ask_nergal: "Ke kterému bohu se modlíš?"
smith.nergal: "K Nergalovi, pánu pece a horečky, s kyjem v podobě lví hlavy. Nechtěl povstat pro posla své královny a byl poslán dolů; teď tam vládne s Ereškigal. Když čepel při odlévání praskne, říkáme: Nergal se na ni podíval. Zaplať nejdřív jemu, pak zákazníkovi."
uruk_alewife.ask_siduri: "Co říkáš muži, který se bojí smrti?"
uruk_alewife.siduri: "To, co řekla výčepní u moře Gilgamešovi: když bohové stvořili člověka, dali mu smrt a život si nechali. Naplň si břicho, raduj se dnem i nocí, umyj se a obleč a drž dítě, které tě chytí za ruku. Je to laciná rada a pivo je drahé. Ještě džbán?"
uruk_farmer.ask_canals: "Je pravda, že kanály kdysi kopali sami bohové?"
uruk_farmer.canals: "Malí bohové, Igigi, čtyřicet let, než spálili rýče a obklíčili Enlilův dům. Dívám se na svůj příkop a rozumím jim. Ale ječmen nečeká na stávku a kdo by nosil bohům koše, když ne my?"

# What the elders say while the New Year festival is on (the flag festival:akitu of the server).
elder_tales_man.akitu_now: "Copak neslyšíš bubny, dítě? Je Nový rok: jedenáct dní od prvního novu na jaře. Jdi do chrámu a viz, jak Marduk vychází proti Tiamat, a slyš jeho padesát jmen; pivo je zadarmo, král klečí a já jsem od úsvitu nespal. Vrať se, až zhasnou lampy, a povím ti zbytek."
elder_tales_woman.akitu_now: "Zapal lampu, dítě, je Nový rok! Jedenáct dní, kdy jsou si všichni příbuzní. Nesu lampu v průvodu boha; pojď s námi do chrámu a slyš píseň o Mardukovi a Tiamat a viz nebe udělané z jejího těla. Zítra se všichni vrátíme k práci, ale dnes ne."

# More allusions to the legends (shamhat, utnapishtim, temple_scribe, uruk_water_carrier, uruk_elder).
shamhat.ask_ishtar_below: "Co zpíváš o Ištar v podsvětí?"
shamhat.ishtar_below: "Znám ji nazpaměť: sedm bran a u každé strážce vzal kus její parády, až stanula nahá před sestrou. Myslím na to pokaždé, když si sundávám vlastní ozdoby. A Tammuz: pláčeme pro něj každý rok s lapisovou flétnou a druhý den se smějeme, protože Ištar zase vystoupila."
utnapishtim.ask_atra_hasis: "Staré příběhy nazývají hrdinu potopy Atrachasís."
utnapishtim.atra_hasis: "Ano: Atrachasís, Nesmírně Moudrý, král Šuruppaku, ten, kdo slyšel mluvit rákosovou stěnu. Jména jsou jako hlína, berou tvar ruky, která je vypráví. Zeptej se Gilgameše, co slyšel pod jiným jménem: je to táž potopa a táž stěna."
temple_scribe.ask_new_year: "Co se čte o Novém roce?"
temple_scribe.new_year: "„Když nahoře“, všech sedm tabulek, zatímco kněží v chrámu hrají a moji žáci drží hlínu. Učím je: opisuj řádek, ne boha. Další král bude chtít v písni jiného boha a písař, který opsal boha, přijde o práci."
uruk_water_carrier.ask_khalziku: "Proč má vak na vodu takový význam?"
uruk_water_carrier.khalziku: "Zeptej se podsvětí. Když bohové poslali dolů Asusunamira, požádal královnu Ereškigal o vak na vodu, chalzikku, aby se z něj napil, a ona ho proklela: takové přání nelze splnit. Vak na vodu je první, co poutník potřebuje, a poslední, co smějí mít mrtví. Naplň si ten svůj, dítě."
uruk_elder.ask_kingship: "Kdo dal králům moc?"
uruk_elder.kingship: "Královská moc sestoupila z nebe, nejdřív do Eridu a po potopě do Kiše. Pastýř Etana, který neměl syna, vystoupil na nebe na orlu pro rostlinu zrození. Pamatujte na to, králové Uruku: koruna je půjčená a Anovi úředníci mají stvrzenku."
