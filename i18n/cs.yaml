# Ninsun Dialogues (Czech)
ninsun.greet: "Jsem Ninsun, matka Gilgameše a moudrá bohyně Uruku. Co hledá přítel mého syna?"
ninsun.ask_son: Zeptat se na Gilgameše
ninsun.ask_dream: Zeptat se na výklad snů
ninsun.ask_enkidu: Zeptat se na Enkidu
ninsun.ask_wisdom: Hledat moudrost
ninsun.leave: Musím jít, moudrá matko.
ninsun.son: "Můj syn Gilgameš je silný a pyšný. Dvě třetiny boha a jedna třetina člověka, narodil se, aby byl velkým králem. Ale i králové potřebují vedení svých matek."
ninsun.protection: "Požádám bohy, aby vás ochránili na vaší cestě. Ať vás Šamaš, bůh slunce, opatruje, až budete cestovat nebezpečnými zeměmi."
ninsun.dream: "Sny jsou hlas bohů, kteří mluví k smrtelníkům. Přineste mi svůj sen a já vám odhalím jeho význam."
ninsun.enkidu_dream: "Ach, sníte o Enkidovi? On je opravdu rovnocenný mému synovi, ten, který může zmírnit Gilgamešovo pyšné srdce."
ninsun.about_enkidu: "Enkidu je ten, kterého bohové stvořili, aby se vyrovnal mému synovi. Spolu vykonali velké činy a vykonají ještě více."
ninsun.wisdom: "Moudrost přichází z pochopení síly bohů i křehkosti lidí. Zapamatujte si to na svých cestách."

