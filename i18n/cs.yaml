# Anu Dialogues (Czech)
anu.greet: "Já jsem Anu, pán nebes, otec velkých bohů. Co tě přivádí přede mne, do mé božské přítomnosti?"
anu.ask_heavens: Ptej se na nebesa
anu.ask_judgment: Ptej se na božský soud
anu.ask_ishtar: Ptej se na Ištar
anu.leave: Musím jít, velký pane.
anu.heavens: "Nebesa jsou nekonečná a věčná, kde hvězdy zapisují osudy lidí. Z mého trůnu výše vidím vše, co bylo, je a bude."
anu.judgment: "Můj soud je konečný, neboť jsem otcem bohů. Rovnováha spravedlnosti je udržována mou vůlí samotnou."
anu.ishtar: "Ištar... moje dcera. Pyšná a prudká, je zároveň přinositelkou lásky i mzdou války. Hodná dědička mého království."

