place.uruk_smithy: Kovářská dílna
place.uruk_pottery: Hrnčířská dílna

npc.smith: Kovář
npc.smith.bio: "Kovář z jihozápadní ulice. V peci taví měď, v milíři pálí dřevěné uhlí a do hliněných forem odlévá meče. Na kožené zástěře má saze a v ruce čerstvou čepel."
npc.potter_tablet: Hrnčíř tabulek
npc.potter_tablet.bio: "Hrnčíř, který tvaruje nádoby i hliněné tabulky, na které město píše. Hlína až k loktům, v rukou vlhká tabulka a rákosové rydlo."
npc.tablet_bearer: Sluha
npc.tablet_bearer.bio: "Sluha z hrnčířské dílny. V koši nosí nepopsané hliněné tabulky do chrámu a na tržiště."
npc.market_scribe: Písař
npc.market_scribe.bio: "Písař, který na hliněné tabulky přinesené sluhy od hrnčířů zapisuje účty a oběti."
npc.tablet_merchant: Kupec
npc.tablet_merchant.bio: "Kupec z velkého tržiště. Na hliněné tabulky píše, co koupil a co prodal, rydlo v ruce."
npc.writing_priest: Kněz
npc.writing_priest.bio: "Kněz z Eanny. Na hliněné tabulky vynesené z hrnčířských dílen zapisuje oběti."

smith.greet: "Pozor na pec. Měď teče a v formě tuhne meč."
smith.ask_furnace: Zeptej se na pec
smith.ask_sword: Zeptej se na meče
smith.leave: Nechám tě u ohně.
smith.furnace: "Do pece jde ruda a dřevěné uhlí a milíř vedle dvora pálí dřevo na uhlí. Bez toho ohně není měď a bez mědi není čepel."
smith.sword: "Meče odlévám, nekuju je ze vzduchu. Forma je z hlíny, kov je měď a čepel chladne na lavici, zatímco se lije další."

potter.ask_tablets: Zeptej se na hliněné tabulky
potter.tablets: "Džbány jsou pro dům a pro chrám. Tabulky jsou pro slova. Řežu je z téže říční hlíny a sluhové je v koších odnášejí do Eanny a na tržiště, kde na ně píší písaři, kupci a kněží."

tablet_bearer.greet: "Ustup. Koš je plný tabulek a ještě jsou měkké."
tablet_bearer.ask_tablets: Zeptej se, kam je neseš
tablet_bearer.leave: Jen jdi.
tablet_bearer.tablets: "Z hrnčířské dílny do chrámu a druhý koš na tržiště. Píší na ně písaři, kupci a kněží. Já je jen nosím."

tablet_writer.greet: "Čerstvá tabulka, ještě teplá z hrnčířské dílny. Dej mi chvíli a slova budou v hlíně."
tablet_writer.ask_write: Zeptej se, co píšeš
tablet_writer.leave: Nerozmažu ti hlínu.
tablet_writer.write: "Písaři píší oběti, kupci píší, co se koupilo a prodalo, a my kněží píšeme, co bylo dáno bohům. Sluhové nosí tabulky v koších. Hlína si pamatuje ruku, která ji stlačila."

# Quest lovce (tabulka I)
place.hunter_waterhole: Napajedlo zvěře
place.hunter_village: Vesnice starého otce
npc.hunter_father: Starý otec
npc.hunter_father.bio: Starý muž ze stepní vesnice, který syna učil klást jámy a sítě. Šedivý a shrbený, zná divočinu i krále Uruku.
quest.hunter.title: Lovec a divoký muž
quest.hunter.lay_snares: Polož past u napajedla, vzdal se a čekej — a střež se lvů a vlků. Když zůstaneš blízko pasti, zvěř nepřijde.
quest.hunter.snare_ruined_1: Divoký muž strhl první past a zvíře uniklo. Polož další; šelmy kolem napajedla nespí.
quest.hunter.snare_ruined_2: Znovu zasypal jámy a vytrhl sítě. Další past — a drž si lvici i vlky od těla.
quest.hunter.snare_ruined_3: Potřetí zničil tvou práci. Ještě nejsi hotov — past znovu, a pozor na šelmy.
quest.hunter.snare_ruined_4: Počtvrté strhl sítě. Zkus to ještě jednou.
quest.hunter.snare_ruined_5: Popáté zničil tvou práci. Jdi se poradit se starým otcem.
quest.hunter.ask_father: Promluv si s otcem ve vesnici.
quest.hunter.seek_gilgamesh: Jdi do Uruku a řekni králi Gilgamešovi o divokém muži.
quest.hunter.seek_shamhat: Najdi Šamḫat u chrámu Innany a vysvětli svůj záměr.
quest.hunter.journey_with_shamhat: Putuj se Šamḫat zpět k napajedlu (cesta třetího dne).
quest.hunter.find_enkidu: Najdi s Šamḫat divokého muže u napajedla.
quest.hunter.done: Úloha lovce končí. Šamḫat udělá z Enkidua člověka.
enkidu_wild.greet: Stojí mezi tebou a stádem u vody — srst jako u divokého býka, bez lidského slova. Gazely před ním neutíkají.
enkidu_wild.after_snares: (Strhl každou past. Sám už tu nic nezmůžeš.)
enkidu_wild.send_father: Dupá a řve. Stádo se kolem něj uzavírá. Jámy jsou zničené; pomůže jen rada otce — zpět do vesnice.
enkidu_wild.with_shamhat: (Přivést Šamḫat.)
enkidu_wild.found_with_shamhat: Divoký muž stále hlídá vodu. Šamḫat jde kolem tebe — tvůj lov končí, začíná její dílo.
enkidu_wild.leave: (Ustoupit beze slova.)
hunter_father.greet: Můj synu. Step ti ošlehala tvář.
hunter_father.tell_wild_man: Otče — muž z hor ničí každou past, kterou položím.
hunter_father.ask_who: Kdo jsi mezi lovci?
hunter_father.who: Jsem tvůj otec. Jámy jsem kopal, než jsi uměl chodit.
hunter_father.counsel: Jdi do Uruku. Řekni Gilgamešovi. Pošle ženu z chrámu — Šamḫat — a divoký muž opustí stádo.
hunter_father.leave: (Uklonit se a odejít.)
gilgamesh.hunter_plea: Králí — divoký muž zasypává mé jámy a osvobozuje gazely. Otec mě k tobě poslal.
gilgamesh.send_shamhat: Vezmi Šamḫat z domu Innany. Až stádo přijde pít, ona ho odvede od zvířat. Jdi.
shamhat.hunter_plan: Král mě posílá. Půjdeš se mnou tři dny k napajedlu?
shamhat.accept_journey: Tak pojďme. Veď mě k divokému muži, lovče.
quest.shamhat.title: Šamḫat a divoký muž
quest.shamhat.see_the_savage: Získej srdce divokého muže — házej srdíčka lásky, dokud v něm nezmizí zvíře.
quest.shamhat.return_to_uruk: Veď Enkidua na tržiště Uruku.
enkidu_wild.become_shamhat: (Vystoupit jako Šamḫat.)
enkidu_wild.handover_shamhat: Cesta lovce končí. Jsi Šamḫat z chrámu — divoký muž čeká na tvé slovo.
enkidu_civilize.offer_bread: Vezmi chléb lidí.
enkidu_civilize.walk_to_uruk: Pojď — jdeme do Uruku, ke králi Gilgamešovi.
enkidu_civilize.ready_for_uruk: Vstává jako muž města. Cesta do Uruku je otevřená.
enkidu_civilize.leave: (Ustoupit.)
enkidu_civilize.greet: Divoký muž na tebe hledí novýma očima.
quest.hunter.excerpt: |
  Zavolali Aruru, velkou bohyni:
  „Ty jsi stvořila, Aruru, Gilgameše; nyní stvoř jeho obraz! Prudkostí
  srdce nechať se vyrovná Gilgamešovi! Nechať spolu soupeří, a Uruk
  se zotaví!“

  Sotva to Aruru slyšela, stvořila v srdci obraz podle Anua; ruce si
  umyla Aruru, utrhla hlíny, naplila na ni, stvořila hrdinu, mocného
  Engidua, výhonek hlíny, Ninurtou nadaný silou. Srstí je pokryto
  celé jeho tělo, na hlavě má vlasy zcela jak žena, vlnící se vlasy mu
  rostou jak obilí. Nezná země a nezná lidí; oděn jest jako bůh zvěře
  Sumukan. Společně s gazelami pojídá traviny, s divokou zvěří se
  tlačí k napajedlu, s davem vodního tvorstva si libuje v srdci.
quest.hunter.excerpt.akkadian: >-
  izzukūnimma Aruru rabītum atti Aruru tabnî Gilgāmeš eninna binî zikiršu
  ana idi libbišu lū mašil lištannanūma Uruk lištapšiḫ Aruru annīta ina šemêša
  zikir Anim ibtani ina libbiša Aruru idiša imsi ṭiṭṭa iktariṣ ittadi ina ṣēri
  ina ṣēri Enkidu ibtani qurādu ilitti qulti kiṣir Ninurta šūrumma zumuršu šuʾʾuru
  upazzir kīma sinništi upazzirūšu perētu kīma Nissaba lā īdi nišī mātamma
  lubušti labiš kīma Sumuqan itti ṣabî ikkala šammī itti būlim mašqâ išatti
  itti nammaššê mê iṭīb libbašu

quest.shamhat.excerpt: Vrhala lásku jako síť; divoký muž se stal člověkem — pak chléb a pivo země.
quest.shamhat.excerpt.akkadian: aklī ša nišī akul — šikar māti šiti
quest.shamhat.teach_bread: Snědl chléb lidí. Nabídni mu pivo země.
quest.shamhat.teach_ale: Napil se. Obleč ho jako muže města.
quest.shamhat.teach_clothing: Stádo před ním prchá. Putuj s ním do Uruku ke králi Gilgamešovi.
quest.shamhat.present_enkidu: Představ civilizovaného divokého muže králi Gilgamešovi na tržišti.
quest.shamhat.done: Dílo Šamḫat je hotovo. Enkidu stojí před králem.
enkidu_civilize.offer_ale: Pij pivo země — sedm džbánů, jako pastýři.
enkidu_civilize.offer_clothing: Oblékni šat lidí. Opusť srst hor.
enkidu_civilize.ate_bread: Bere chléb. Oči má jiné — už ne jen zvířecí.
enkidu_civilize.drank_ale: Pije. Zpívá. Veselí se jako muž ovčích ohrad.
enkidu_civilize.wore_clothing: Nosí plátno. Gazely, s nimiž běhal, prchají do hor.
quest.enkidu_meets.title: Enkidu a král
quest.enkidu_meets.face_the_king: Vyzvi Gilgameše — zataras dveře svatebního domu.
quest.enkidu_meets.wrestle: Zápas s králem v ulici Uruku.
quest.enkidu_meets.become_brothers: Ty a Gilgameš jste rovni. Přátelství je zpečetěno.
quest.enkidu_meets.excerpt: Zápasili jako býci; sloup dveří se chvěl — pak se políbili a stali se přáteli.
quest.enkidu_meets.excerpt.akkadian: iṣṣabtūma kīma lītī — ina sūqi ša Uruk
gilgamesh.receive_shamhat: Ó králi — zde je divoký muž, oděný a sytý. Šamḫat vykonala své dílo.
gilgamesh.accept_enkidu: Dobře. Ať stane přede mnou. Soupeř Uruku přišel.
gilgamesh.become_enkidu: (Stát se Enkiduem — čelit králi.)
gilgamesh.become_king: (Stát se Gilgamešem — epos pokračuje.)
gilgamesh.king_handover: "Jsi Gilgameš, král Uruku. Enkidu stojí po tvém boku jako bratr. Cedrový les čeká."
enkidu.propose_cedar: Promluv o Cedrovém lese
enkidu.propose_cedar_speech: "Bratře — sláva, která zůstane, se řeže z cedru. Pojďme do Lesa a postavme se Humbabovi. Nejdřív hledej požehnání své matky."
enkidu.depart_cedar: Vyrazit do Cedrového lesa
enkidu.depart_cedar_speech: "Cesta je dlouhá. Zavři oči — až je otevřeš, budou kolem nás cedry."
enkidu.ask_more: Zeptat se na jiné věci
enkidu.back: Zpět
enkidu.speak_illness: Zeptat se, co ho trápí
enkidu.speak_sickness: Zůstat u něj v horečce
enkidu.speak_dream: Zeptat se na jeho sen
enkidu.farewell: Rozloučit se s ním
enkidu.illness: "Bratře — bohové rozsoudili. Za Humbabu a Býka musí jeden z nás zemřít. To jsem já."
enkidu.sickness: "Nemoc těžkne. Neodcházej. Mluv o divočině… o Šamḫat… o tobě."
enkidu.underworld_dream: "Snil jsem o Domě prachu, kde králové sedí s korunami z hlíny. Bojím se."
enkidu.farewell_speech: "Příteli… nezapomeň na mě. Tvé hradby Uruku nás přežijí — hledej život, musíš-li."
ninsun.ask_cedar_blessing: Požádat o požehnání na cedrovou cestu
ninsun.cedar_blessing: "Synu, postavila jsem tě pod ochranu bohů. Jdi s Enkiduem; cedrová cesta je otevřená. Až budeš připraven vyrazit, promluv se svým bratrem."
ninsun.ask_immortality_road: Zeptat se na cestu k Utnapištimovi
ninsun.immortality_counsel: "Enkidu je pryč. Chceš-li život bez konce, cesta vede k Hoře Mašu a za Vody smrti."
ninsun.depart_mashu: Vyrazit k Hoře Mašu
ninsun.send_mashu: "Jdi. Štíří muži střeží bránu. Projdi je a Ur-Šanabi tě najde."
ninsun.ask_walls: Pohleď na hradby Uruku
ninsun.walls_epilog: "Vystup se mnou, synu. Terasa základů a pálená cihla — to je tvé dílo. Rostlina je pryč, ale Uruk stojí. To stačí."
gilgamesh.enkidu_handover: Jsi Enkidu. Ulice čeká. Zataras mu cestu a dokaž sílu.
gilgamesh.enkidu_challenge: Jsem Enkidu. Zatarasím ti cestu, králi Uruku.
gilgamesh.enkidu_again: Znovu — dokonči, co jsme začali.
gilgamesh.wrestle_begin: Chytí se. Sloupy dveří se chvějí, zdi se třesou.
gilgamesh.wrestle_continue: (Drž se.)
gilgamesh.wrestle_end: Políbí se. Enkidu a Gilgameš jsou bratři. Hněv je zapomenut.
enkidu_wild.already_self: Pamatoješ toto napajedlo — ale už nejsi zvíře, jež zde pilo.
gilgamesh.ask_more: Zeptat se na jiné věci.
gilgamesh.back: (Zpět.)
quest.shamhat.teach_love: Jeho srdce měkne. Nabídni mu chléb lidí.
enkidu_civilize.love_chase: Prchá jako gazela. Házej srdíčka lásky — naplň zem zónami, dokud divočina neustoupí.

# Stejnojmenní předkové pozdějších achajmenovských vládců (jiná města než Uruk)
npc.cyrus: Kuruš
npc.cyrus.bio: "Vládce Sús v době Eposu. Stejnojmenný předek pozdějších achajmenovských králů — ne sám Kýros Veliký. Zeptej se ho na něj samotného: poznámka k anachronismu a odkaz na slavného dobyvače."
npc.darius: Dārayavahuš
npc.darius.bio: "Vládce Ninive v době Eposu. Stejnojmenný předek pozdějších achajmenovských králů — ne sám Dareios Veliký. Zeptej se ho na něj samotného: poznámka k anachronismu a odkaz na slavného krále."
npc.xerxes: Xšayāršā
npc.xerxes.bio: "Vládce Mari v době Eposu. Stejnojmenný předek pozdějších achajmenovských králů — ne sám Xerxés I. Zeptej se ho na něj samotného: poznámka k anachronismu a odkaz na slavného krále."

knowledge.cyrus.title: Kuruš ze Sús
knowledge.cyrus.text: "Tento Kuruš vládne Súsám v raně dynastické době Eposu. Je stejnojmenným předkem slavné achajmenovské linie, ne Kýrem Velikým z 6. století př. n. l. — podoba a jméno jsou záměrný anachronismus. Článek na Wikipedii níže je o tom pozdějším dobyvači."
knowledge.cyrus.credit: "Reliéf Kýra Velikého, ilustrace z Illustrerad verldshistoria (E. Wallis), díl I. Volné dílo, přes Wikimedia Commons."

knowledge.darius.title: Dārayavahuš z Ninive
knowledge.darius.text: "Tento Dārayavahuš vládne Ninive v době Gilgameše. Je stejnojmenným předkem pozdějších achajmenovských králů, ne samotným Dareiém Velikým — společné jméno záměrně spojuje dvě epochy. Článek na Wikipedii níže je o historickém Dareiovi Velikém."
knowledge.darius.credit: "Perský král, ilustrace z Illustrerad verldshistoria (E. Wallis), díl I. Volné dílo, přes Wikimedia Commons."

knowledge.xerxes.title: Xšayāršā z Mari
knowledge.xerxes.text: "Tento Xšayāršā vládne Mari v době Eposu. Je stejnojmenným předkem pozdějších achajmenovských králů, ne Xerxem I. z 5. století př. n. l. — podobnost je záměrná herní legenda. Článek na Wikipedii níže je o historickém Xerxovi I."
knowledge.xerxes.credit: "Xerxés, ilustrace A. Jakovleva (1911) pro The General History Edited by Satyricon. Volné dílo, přes Wikimedia Commons."

cyrus.greet: "Jsem Kuruš, pán Sús. Uruk má Gilgameše; tady mi odpovídá rovina."
cyrus.ask_city: Zeptat se na Súsy
cyrus.city: "Súsy stojí mezi řekami Elamu a cestou do vysočiny. Přines obchod, ne válku, a budeš vítán."
cyrus.leave: Sbohem

darius.greet: "Jsem Dārayavahuš z Ninive. Sever bdí, zatímco Uruk staví hradby."
darius.ask_city: Zeptat se na Ninive
darius.city: "Ninive střeží horní Tigris. Poslové a kupci procházejí; vojska, která se nezeptají, nechávají kosti."
darius.leave: Sbohem

xerxes.greet: "Jsem Xšayāršā, který drží Mari na eufratské cestě. Gilgamešovo město není jediná koruna."
xerxes.ask_city: Zeptat se na Mari
xerxes.city: "Mari žije říčním obchodem. Cedr, měď i zprávy o vzdálených králích se zastavují u našich přístavišť."
xerxes.leave: Sbohem
achievement.foundation_reader.title: "Čtenář základů"
achievement.foundation_reader.description: "Najdi základovou destičku chrámu Ištar a přečti ji."
knowledge.foundation_tablet.title: "Základová destička chrámu Ištar"
knowledge.foundation_tablet.text: "„Inanně, své paní, král Uruku postavil její chrám.“ Při založení chrámu dal král vyrýt malou destičku z černého kamene a uložit ji do schránky z pálených cihel pod roh zdí, často s měděným kolíkem. Mluvila k bohům i ke králům, kteří chrám po něm obnoví. Takové destičky známe od raně dynastického Lagaše po krále III. dynastie urské; tato napodobuje steatitové destičky Ur-Nammy (kolem roku 2100 př. n. l.) z Eanny, jen bez jeho jména. Znaky mají pozdější podobu, ne písmo Gilgamešovy doby."
knowledge.foundation_tablet.credit: "Render vlastního modelu datadisku (CC BY-SA 4.0) podle základové destičky Ur-Nammy. Znaky písmem Noto Sans Cuneiform (SIL Open Font License)."
place.uruk_riverbank: Břeh Eufratu
place.uruk_harbour: Přístav Uruku
place.uruk_boat: Kotvící loď
place.hunter_road: Cesta k Uruku
place.hunter_ferry_landing: Přístaviště na Eufratu
place.hunter_ferry_boat: Rybářská loďka
place.uruk_fisher: Rybářský člun
place.hunter_village_trader: "Obchodník ve vsi"
place.hunter_village_well: "Studna ve vsi"
npc.village_trader: "Vesnický obchodník"
npc.village_trader.bio: "Obchodník, který vozí z Uruku, co vesnice potřebuje: měchy na vodu, nářadí, osivo a provazy. Obchoduje před svými dveřmi, na cestě k návsi."
village_trader.greet: "„Pokoj na tvé cestě. Měchy, provazy, osivo a nářadí: co stepi chybí, to mám.“"
village_trader.ask_well: "Kde si naplním měch na vodu?"
village_trader.well: "„Studna je na návsi, vyzděná cihlami, a studená i v létě. Naplň si tam měch, než půjdeš do Uruku: step má málo vody a řeka je daleko.“"
village_trader.leave: "Pokoj s tebou."
place.uruk_well: Studna
place.uruk_great_well: Otevřená studna v Uruku
place.hunter_home: "Domov"
npc.village_man: "Vesničan"
npc.village_man.bio: "Muž z vesnice na cestě mezi domem a polem."
npc.village_woman: "Vesničanka"
npc.village_woman.bio: "Žena z vesnice, zaměstnaná kolem domu."
npc.village_old_man: "Stařec"
npc.village_old_man.bio: "Starý muž z vesnice odpočívá ve stínu svého domu."
npc.village_old_woman: "Stařena"
npc.village_old_woman.bio: "Stará žena z vesnice, která dohlíží na děti."
npc.village_boy: "Chlapec"
npc.village_boy.bio: "Chlapec z vesnice, který pobíhá po návsi."
npc.village_girl: "Dívka"
npc.village_girl.bio: "Dívka z vesnice, která si hraje před domem."
npc.village_pregnant_woman.bio: "Těhotná žena z vesnice, zaměstnaná kolem domu."
place.hunter_road_water: "Prodavač vody"
npc.road_water_seller: "Prodavač vody"
npc.road_water_seller.bio: "Formán, který prodává vodu a chléb pocestným na dlouhé cestě k Eufratu."
water_seller.greet: "Pokoj na tvé cestě, pocestný. Voda, studená ze studny: naplním ti měch za dvě mince, a k tomu chléb."
water_seller.ask_river: "Jak je to daleko k řece?"
water_seller.river: "Eufrat je ještě kus cesty. Naplň si měch, než půjdeš: step nemá cestou žádnou vodu."
water_seller.leave: "Šťastnou cestu."
npc.road_wagoner: "Formán"
npc.road_wagoner.bio: "Formán se spřežením volů vozí náklad mezi vesnicemi a řekou."
npc.road_camel_driver: "Velbloudář"
npc.road_camel_driver.bio: "Hnáč, který vede naloženého velblouda po dlouhé cestě k Eufratu."

# Tři tabulky eposu o Atrachasísovi (places/atrahasis_tablets.yaml). Texty epos převyprávějí vlastními slovy.
place.atrahasis_tablet_1: Hliněná tabulka eposu o Atrachasísovi (I)
place.atrahasis_tablet_2: Hliněná tabulka eposu o Atrachasísovi (II)
place.atrahasis_tablet_3: Hliněná tabulka eposu o Atrachasísovi (III)
achievement.three_tablets.title: "Strážce tří tabulek"
achievement.three_tablets.description: "Najdi a přečti všechny tři hliněné tabulky eposu o Atrachasísovi v Eridu, Nippuru a Šuruppaku."
knowledge.atrahasis_tablet.credit: "Render vlastního modelu datadisku (CC BY-SA 4.0). Znaky písmem Noto Sans Cuneiform (SIL Open Font License)."
knowledge.atrahasis_tablet_1.title: "Atrachasís, tabulka I: stávka bohů a stvoření člověka"
knowledge.atrahasis_tablet_1.text: "„Když bohové byli člověkem“: nižší bohové čtyřicet let kopali řeky a kanály, pak spálili nářadí a v noci obklíčili Enlilův dům, Ekur v Nippuru. Východisko našel Enki: ať bohyně Mami stvoří člověka z hlíny smíšené s tělem a krví zabitého boha, aby nesl práci bohů. Enki hlínu uhnětl, čtrnáct rodících bohyní vytvarovalo sedm mužů a sedm žen a v desátém měsíci se člověk narodil. Tabulka pokračuje první morovou ranou: lidé se rozmnožili a hlučeli, Enlil nemohl spát a poslal Namtara; král Atrachasís, poučený svým bohem Enkim, nechal starší obětovat samotnému Namtarovi a mor ustal. Starobabylonský text opsal písař Ku‑Aja ze Sipparu."
knowledge.atrahasis_tablet_2.title: "Atrachasís, tabulka II: hlad a přísaha"
knowledge.atrahasis_tablet_2.text: "Lidé se znovu rozmnožili a Enlil, podruhé zbavený spánku, nechal Adada zadržet déšť. Atrachasís šel zase za Enkim a bůh zase ustoupil; Enlil proto postavil stráže nad nebe, zemi i hlubinu a sucho zesílilo. Enki přesto našel způsob, jak lidi nasytit rybami, až Enlil svolal bohy a zakázal komukoli lidstvo znovu zachránit. Enki se varování zasmál; Enlilův plán byl ale hotový: voda, která lidi zachránila, je utopí, a Enki přísahou slíbil mlčet. Tabulka je těžce poškozená a prostředek se jen domýšlí; Ekur, kde epos začíná, stojí v tomto městě."
knowledge.atrahasis_tablet_3.title: "Atrachasís, tabulka III: potopa"
knowledge.atrahasis_tablet_3.text: "Atrachasís měl sen a Enki, vázaný přísahou, promluvil k rákosové chýši: „Chýše, chýše! Stěno, stěno! Slyš!“ Rozeber dům, postav loď, vysmol ji smolou, vezmi zvířata, ptáky a rodinu; za sedm dní přijde potopa a Enki nastavil vodní hodiny na sedmou noc. Atrachasís řekl starším, že musí odejít žít ke svému bohu, uspořádal hostinu, na které nemohl jíst, a vstoupil do lodi. Sedm dní a nocí topila zemi bouře Adadova; bohové hladověli bez kanálů a obětí a Mami vinila Enlila a nosila lapisové mouchy na znamení smutku. Po potopě Atrachasís obětoval a Enlil, rozzlobený na Enkiho, svolil nechat lidi žít, jen lépe uspořádané: mimo jiné ženami, které nerodí. Atrachasís byl králem Šuruppaku."

# Sedm tabulek Enúma eliš (places/enuma_elish_tablets.yaml). Texty epos převyprávějí vlastními slovy.
place.enuma_elish_tablet_1: Hliněná tabulka Enúma eliš (I)
