# Bull of Heaven Dialogues (Czech)
bull_of_heaven.roar: "ŘEV! Nebeský býk přichází potrestat pyšné!"
bull_of_heaven.flee: Uteč před šelmou
bull_of_heaven.fight: Postav se a bojuj
