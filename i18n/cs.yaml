npc.crowd_washwoman: Pračka
npc.crowd_washwoman.bio: "A washerwoman of the city canals."
npc.crowd_young_woman: Mladá žena
npc.crowd_young_woman.bio: "A young woman of Uruk."
npc.crowd_pregnant_woman: Těhotná žena
npc.crowd_pregnant_woman.bio: "A young woman late in pregnancy."
npc.crowd_spearman: Kopiník
npc.crowd_spearman.bio: "A spearman of the city guard."
npc.crowd_archer: Lukostřelec
npc.crowd_archer.bio: "An archer of Early Dynastic Uruk."
npc.crowd_axeman: Bojovník se sekerou
npc.crowd_axeman.bio: "A stocky soldier with a copper axe."
npc.crowd_slinger: Prakovník
npc.crowd_slinger.bio: "A young skirmisher with a sling."
npc.crowd_textile_merchant: Obchodník s látkami
npc.crowd_textile_merchant.bio: "A well-dressed textile merchant."
npc.crowd_copper_merchant: Obchodník s mědí
