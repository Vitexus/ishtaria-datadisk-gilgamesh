achievement.descent_tablets.title: "Poutník sedmi bran"
achievement.descent_tablets.description: "Najdi a přečti všech šest hliněných tabulek Ištařina sestupu do země bez návratu: v Uruku (tři), Nippuru, Uru a Eridu."
knowledge.ishtar_descent_tablet.credit: "Render vlastního modelu datadisku (CC BY-SA 4.0). Znaky písmem Noto Sans Cuneiform (SIL Open Font License). Převyprávěno podle překladu M. Jastrowa z roku 1915 (volné dílo) a dánského překladu akkadského textu."
knowledge.ishtar_descent_tablet_1.title: "Ištařin sestup, tabulka I: do země bez návratu"
knowledge.ishtar_descent_tablet_1.text: "Ištar, dcera Sinova, se rozhodla jít do domu temnoty, příbytku Irkally, do domu, z něhož nikdo, kdo vstoupil, nevychází, kde jejich potravou je prach a chlebem hlína, kde nevidí světlo a jsou oděni jako ptáci v rouše z křídel. Sumerská báseň říká proč: opustila nebe i zemi a své chrámy, mezi nimi Eannu v Uruku, aby šla na pohřeb Gugalanny, manžela své sestry Ereškigal. Před odchodem řekla svému ministru Ninšuburovi: pokud se nevrátím, truchli za mne, bubnuj ve svatyních a jdi za bohy pro pomoc. U brány Ištar pohrozila, že rozbije dveře a vyvede mrtvé, aby sežrali živé."
knowledge.ishtar_descent_tablet_2.title: "Ištařin sestup, tabulka II: sedm bran"
knowledge.ishtar_descent_tablet_2.text: "Strážce brány donesl zprávu královně Ereškigal, která zezelenala jako přeříznutý tamaryšek a řekla: ať vstoupí podle starých pravidel. Strážce ji uvítal: ať tě přivítá Kutha, kultovní místo boha moru Nergala. U každé ze sedmi bran jí strážce odňal jeden kus ozdob: velkou korunu, náušnice, náhrdelník, náprsní ozdobu, pás s kameny rození, náramky a nánožníky a nakonec nádherný šat. Na každou otázku odpověděl: „Vejdi, paní, taková jsou pravidla paní podsvětí.“ Ištar se vrhla na sestru a Ereškigal poslala Namtara, aby na ni uvolnil šedesát nemocí, v očích, v pažích, v nohou, v srdci a v hlavě. V sumerské básni sedm soudců, Anunnaki, vynese rozsudek a její tělo visí na háku."
knowledge.ishtar_descent_tablet_3.title: "Ištařin sestup, tabulka III: Enlil odmítá"
knowledge.ishtar_descent_tablet_3.text: "Třetího dne udělala Ninšubur, co jí bylo uloženo: truchlila, bubnovala ve svatyních a šla za bohy. V Nippuru Enlil nepomohl: Inanna zatoužila po velikosti podsvětí a co zákon mrtvých vezme, nemá se žádat zpět. Tabulka leží ve městě Enlila. V akkadské verzi je tentýž výpadek znát na zemi: od chvíle, co Ištar sestoupila, býk nenaskakuje krávu, osel neoplodňuje oslici a muž se na ulici nepřibližuje k ženě."
knowledge.ishtar_descent_tablet_4.title: "Ištařin sestup, tabulka IV: Nanna‑Sin"
knowledge.ishtar_descent_tablet_4.text: "Ninšubur šla dál do Uru k Nannovi, měsíci, otci Inanninu, a ani on nepomohl. V akkadské verzi šel posel bohů Papsukkal v smutečním šatu, se zašpiněnými vlasy, k Sinovi a plakal před králem Eou: „Ištar sestoupila do podsvětí a nevystoupila.“ Muž leží ve své komoře a žena leží sama. Bohům chybí ta, která udržuje touhu a zrození na světě, a musí najít cestu, jak ji vrátit. To je tabulka města měsíce."
knowledge.ishtar_descent_tablet_5.title: "Ištařin sestup, tabulka V: voda života"
knowledge.ishtar_descent_tablet_5.text: "V Eridu byl Ea (Enki) znepokojen a v sumerské básni vytvořil z nečistot pod nehty dvě drobné bytosti, kurgarru a galaturu, které nesly pokrm a vodu života. V akkadské verzi stvořil krásného mladíka Asusunamira a poslal ho dolů. V akkadském zpěvu měl požádat o chalzikku, vak na vodu, aby se z něj napil: o kožený vak, jaký nosí každý poutník. Ereškigal se udeřila do boku, kousla se do prstu a proklela ho, neboť takové přání nelze splnit, a teprve potom povolila. V sumerské básni se dvě bytosti vplížily dolů a plakaly s ní v její bolesti, až se dojala. Namtar dostal rozkaz zaklepat na Egalginu, ozdobit práh mušlemi, posadit Anunnaki na zlatý trůn a pokropit Ištar vodou života. U každé brány jí byly vráceny ozdoby v opačném pořadí, koruna nakonec."
knowledge.ishtar_descent_tablet_6.title: "Ištařin sestup, tabulka VI: Tammuz"
knowledge.ishtar_descent_tablet_6.text: "Podsvětí ji ale nepustilo zadarmo: někdo musí zaujmout její místo. V sumerské básni šly galla, démoni, za Ištar nahoru a chytali, koho potkali; ušetřila Ninšubura i svého věrného zpěváka, ale u jabloně našli Dumuziho, jejího manžela, pastýře krále, který místo truchlení seděl ve slávě. Zavolal slunečního boha Utua, změnil podobu a utekl, ale byl chycen; nakonec jeho osud sdílela sestra Geštinanna, takže je dole polovinu každého roku. Akkadský zpěv se obrací k Tammuzovi: polij ho čistou vodou, pomaž olejem, oblékni do slavnostního šatu a ať zazní lapisová flétna. Jeho sestra Belili, která měla klín plný drahokamů, je při jeho nářku upustila a zvolala: „Nenech mě zahynout! V den, kdy mi Tammuz zahraje na lapisovou flétnu, ať mrtví vstanou a ucítí vůni kadidla.“ Dumuzi byl v Uruku uctíván poblíž Kuary."

# Starci a stařeny, kteří vyprávějí legendy (dialogues/elder_tales_man.yaml, elder_tales_woman.yaml).
elder_tales_man.greet: "Posaď se, dítě, mé nohy jsou starší než hradba Uruku. „Když bohové byli člověkem,“ začíná stará povídka, a já ji znám tak, jak mi ji vyprávěl otec. Ptej se, povím."
elder_tales_man.ask_men: "Jak byli stvořeni lidé?"
elder_tales_man.men: "Nižší bohové čtyřicet let kopali kanály pro velké, pak spálili nářadí a v noci obklíčili Enlilův dům. Enki řekl: ať bohyně rození Mami stvoří člověka z hlíny a krve zabitého boha, aby nosil koše bohů. Jsme tedy hlína a krev boha: proto myslíme a proto pracujeme."
elder_tales_man.ask_death: "Proč umíráme a proč jsou některé ženy bezdětné?"
elder_tales_man.death: "Bylo nás příliš mnoho a hlučeli jsme, a Enlil nemohl spát. Poslal mor a moudrý Atrachasís obětoval jen bohu moru, který se zastyděl a nechal nás být. Poslal hlad a bůh se zase zastyděl. Pak poslal potopu. Když opadla, Enki nám stanovil míru: některé ženy nerodí, některé jsou dány chrámu a nikdo z nás nežije věčně."
elder_tales_man.ask_flood: "Pověz mi o potopě."
elder_tales_man.flood: "Enki nemohl Atrachasíse varovat, protože Enlilovi přísahal. Promluvil tedy k rákosové stěně: „Chýše! Stěno, slyš mě! Rozeber dům, postav loď.“ Atrachasís vzal zvířata i lidi a zavřel dveře. Sedm dní a nocí vála bouře Adadova a i bohové hladověli, protože jim nikdo nenosil chléb. Až uslyšíš vítr v rákosové chýši, dítě, vzpomeň si: stěna poslouchá."
elder_tales_man.ask_akitu: "Co se zpívá o Novém roce?"
elder_tales_man.akitu: "O Novém roce jde celé město do chrámu a stará píseň se hraje jako divadlo: „Když nahoře…“ Marduk rozprostře síť, čtyři větry ji drží, šíp rozetne Tiamat srdce a z jejího těla udělá nebe. Voláme jeho padesát jmen, pivo je zadarmo, děti sedí na ramenou a i král klečí před bohem. Je to nejkrásnější den roku."
elder_tales_man.ask_where: "Kde jsou ty příběhy zapsané?"
elder_tales_man.where: "Písaři je dali na hlínu a tabulky leží na cihlových lavicích ve starých městech. Příběh o Atrachasísovi je v Eridu, v Nippuru a v Šuruppaku. Novoroční píseň je na sedmi místech, od Eridu po Aššur a dvakrát v Babylonu. A píseň o Ištar v podsvětí je v Uruku, v Nippuru, v Uru a v Eridu. Obejdi je všechny a přečti je a budeš vědět, co ví každý dědeček."
elder_tales_man.leave: "Pokoj s tebou, starý otče."
elder_tales_woman.greet: "Pojď blíž k ohni, maličká. Písně o Ištar znám nazpaměť, jako je znala moje matka přede mnou. Ptej se, zazpívám."
elder_tales_woman.ask_gates: "Pověz mi, jak Ištar sestoupila."
elder_tales_woman.gates: "Ištar, dcera Sinova, se rozhodla jít do domu temnoty, kde je prach chlebem a mrtví nosí křídla jako ptáci. U brány zvolala: „Otevři, nebo rozbiju dveře a vyvedu mrtvé, aby sežrali živé!“ Její sestra Ereškigal zezelenala jako přeříznutý tamaryšek a řekla: „Pusť ji podle starého zákona.“ U každé ze sedmi bran jí strážce vzal kus: korunu, náušnice, náhrdelník, náprsní ozdobu, pás s kameny rození, náramky a nakonec šat. „Vejdi, paní: taková jsou nařízení Ereškigal.“ Nahoře býk nenaskakoval krávu, osel nepřistupoval k oslici a žádný muž se nedíval na dívku na ulici, neboť kdo udrží touhu na světě, když je Ištar pod zemí?"
elder_tales_woman.ask_return: "Jak se vrátila?"
elder_tales_woman.return: "Otec Ea stvořil krásného mladíka Asusunamira a poslal ho dolů požádat o vak na vodu, chalzikku, jako je ten, který máš na rameni ty. Ereškigal ho nejdřív proklela, pak povolila a Namtar pokropil Ištar vodou života. U každé brány jí vrátili ozdoby, korunu nakonec. Ale pamatuj, dítě: nikdo neopustí dům temnoty, aniž by tam něco nechal."
elder_tales_woman.ask_dumuzi: "Kdo zůstal dole na jejím místě?"
elder_tales_woman.dumuzi: "Tammuz, pastýř jejího mládí. Polij ho čistou vodou, zpíváme, pomaž ho, obleč do červeného a ať zazní lapisová flétna. Jeho sestra Belili upustila drahokamy: „Nenech mě zahynout!“ A v den, kdy Tammuz zahraje, mrtví vstanou a ucítí vůni kadidla. Proto pro něj každý rok pláčeme a cítíme ho v zrnu, které jde pod zem."
elder_tales_woman.ask_akitu: "Jaký je Nový rok?"
elder_tales_woman.akitu: "Nesu lampu v průvodu boha. V chrámu zpívají píseň o Mardukovi a Tiamat a je to, jako by se celý svět zrodil znovu: nebe z jejího těla, řeky z jejích očí. Den, kdy jsou si všichni příbuzní, dítě. Žádný jiný takový není."
elder_tales_woman.ask_where: "Kde jsou ty písně zapsané?"
elder_tales_woman.where: "Písaři je dali na hlínu a tabulky leží na cihlových lavicích. Píseň o Ištar v podsvětí je v Uruku, tři tabulky, a v Nippuru, Uru a Eridu. Příběh o potopě je v Eridu, Nippuru a Šuruppaku; novoroční píseň v sedmi městech. Kdo je přečte všechny, prošel sedm bran."
elder_tales_woman.leave: "Ať tě bohové chrání, matko."

# Tabulky legend (places/legend_tablets.yaml). Texty legendy převyprávějí vlastními slovy.
place.gilgamesh_epic_tablet_1: "Hliněná tabulka: Epos o Gilgamešovi (1)"
knowledge.gilgamesh_epic_tablet_1.title: "Epos o Gilgamešovi, tabulka I: král a divoký muž"
knowledge.gilgamesh_epic_tablet_1.text: "„Ten, kdo viděl Hlubinu“, byl Gilgameš, král Uruku, který znal všechny cesty a vybudoval velkou hradbu. Nenechal však otci syna ani dívku matce a lid volal k bohům. Aruru stvořila z hlíny soupeře na stepi: Enkidua, který žil s gazelami a pil u napajedla. Lovec ho spatřil a zděsil se. Poslali Šamhat; sedm dní s ní Enkidu ležel a zvířata před ním utíkala, neboť zmoudřel a stal se podobným člověku."
place.gilgamesh_epic_tablet_2: "Hliněná tabulka: Epos o Gilgamešovi (2)"
knowledge.gilgamesh_epic_tablet_2.title: "Epos o Gilgamešovi, tabulka II: zápas ve dveřích"
knowledge.gilgamesh_epic_tablet_2.text: "Šamhat Enkidua oblékla, naučila ho jíst chléb a pít pivo a on šel do Uruku. Právě tam chtěl Gilgameš vstoupit do domu nevěsty v noci svatby, jak bylo královo právo. Enkidu mu zatarasil dveře nohou. Chytili se jako býci, veřeje se otřásly a zeď se zachvěla. Když ho Gilgameš sklopil, jeho hněv ustal, políbili se a stali se přáteli."
place.gilgamesh_epic_tablet_3: "Hliněná tabulka: Epos o Gilgamešovi (3)"
knowledge.gilgamesh_epic_tablet_3.title: "Epos o Gilgamešovi, tabulka III: cesta do Cedrového lesa"
knowledge.gilgamesh_epic_tablet_3.text: "Gilgameš chtěl získat jméno, které nezahyne, a rozhodl se zabít Humbabu, strážce Cedrového lesa. Starší Uruku ho varovali; neposlechl. Jeho matka Ninsun, moudrá ve všem, se modlila k Šamašovi a přijala Enkidua za syna. Kováři odlili sekery a meče a starší jim požehnali: ať vám Šamaš dá bezpečnou cestu."
place.gilgamesh_epic_tablet_4: "Hliněná tabulka: Epos o Gilgamešovi (4)"
knowledge.gilgamesh_epic_tablet_4.title: "Epos o Gilgamešovi, tabulka IV: sny na cestě"
knowledge.gilgamesh_epic_tablet_4.text: "Za den ušli padesát mil a každou noc postavili úkryt a spali. Gilgameš se každou noc dočkal snu: hora se na ně zřítila, býk zaútočil, blesk rozťal nebe. Enkidu vyložil každý sen jako dobré znamení a Gilgameš nabyl odvahy. Tak došli na okraj Cedrového lesa, kde se rozléhaly Humbabovy výkřiky."
place.gilgamesh_epic_tablet_5: "Hliněná tabulka: Epos o Gilgamešovi (5)"
knowledge.gilgamesh_epic_tablet_5.title: "Epos o Gilgamešovi, tabulka V: Humbaba"
knowledge.gilgamesh_epic_tablet_5.text: "U brány lesa Enkiduovi ztuhla ruka strachem, ale Gilgameš ho hnal dál. Obdivovali cedry, příbytek bohů, a pak vyšel Humbaba. Šamaš na něj poslal třináct větrů a nemohl se hnout. Humbaba prosil o život a Gilgameše to dojalo, ale Enkidu řekl: zabij ho. Utali mu hlavu a pokáceli cedry na velkou bránu."
place.gilgamesh_epic_tablet_6: "Hliněná tabulka: Epos o Gilgamešovi (6)"
knowledge.gilgamesh_epic_tablet_6.title: "Epos o Gilgamešovi, tabulka VI: Ištar a nebeský býk"
knowledge.gilgamesh_epic_tablet_6.text: "Gilgameš se umyl a oblékl královský šat a Ištar ho spatřila. „Buď mým mužem,“ řekla a slíbila mu vozy ze zlata a lapisu. Odmítl a připomněl jí její milence, pastýře, kterého proměnila ve vlka, a zahradníka, kterého proměnila v krtka. Ištar šla v hněvu k Anovi a žádala nebeského býka. Býk sestoupil na Uruk a země se pod stovkami otevřela; Enkidu ho chytil za rohy a Gilgameš ho zabil mečem. Enkidu mu vytrhl stehno a hodil ho Ištar do tváře."
place.gilgamesh_epic_tablet_7: "Hliněná tabulka: Epos o Gilgamešovi (7)"
knowledge.gilgamesh_epic_tablet_7.title: "Epos o Gilgamešovi, tabulka VII: Enkiduův sen"
knowledge.gilgamesh_epic_tablet_7.text: "Bohové se sešli v radě: jeden z obou musí zemřít za zabití Humbaby a býka. Zvolili Enkidua. Zdálo se mu o tom a druhého dne onemocněl. V horečce proklel lovce a Šamhat, které z něj udělaly člověka; pak ho Šamaš pokáral, připomněl mu chléb a pivo a přítele, kterého našel, a Enkidu ji místo toho požehnal. Věděl však, že konec je blízko."
place.gilgamesh_epic_tablet_8: "Hliněná tabulka: Epos o Gilgamešovi (8)"
knowledge.gilgamesh_epic_tablet_8.title: "Epos o Gilgamešovi, tabulka VIII: nářek"
knowledge.gilgamesh_epic_tablet_8.text: "Za úsvitu dvanáctého dne Enkidu zemřel. Gilgameš nedovolil, aby byl pohřben. Plakal jako truchlící, volal hory a divoká zvířata a nechal zhotovit sochu. Sedm dní a nocí neopustil tělo. Pak přinesl bohům bohaté dary, aby jeho přítele přijali."
place.gilgamesh_epic_tablet_9: "Hliněná tabulka: Epos o Gilgamešovi (9)"
knowledge.gilgamesh_epic_tablet_9.title: "Epos o Gilgamešovi, tabulka IX: cesta horou"
knowledge.gilgamesh_epic_tablet_9.text: "Gilgameš se bál smrti a bloudil stepí v lví kůži: „Zemřu i já a budu jako Enkidu?“ Vydal se k Utnapištimovi, jedinému člověku, který žije navěky. U hory Mašu, jejíž dva vrcholy drží nebe, strážili brány, kudy prochází slunce, štíří muž a jeho žena. Nakonec ho pustili a on šel dvanáct dvojhodin tmou tunelu, než spatřil světlo."
place.gilgamesh_epic_tablet_10: "Hliněná tabulka: Epos o Gilgamešovi (10)"
knowledge.gilgamesh_epic_tablet_10.title: "Epos o Gilgamešovi, tabulka X: Siduri a vody smrti"
knowledge.gilgamesh_epic_tablet_10.text: "U moře seděla výčepní Siduri a řekla mu: když bohové stvořili lidi, dali jim smrt a život si nechali; naplň si břicho a raduj se, drž dítě, které tě chytí za ruku. Nechtěl to slyšet a ptal se na cestu. Převozník Uršanabi s ním přeplul vody smrti; tyče došly a Gilgameš jich uřízl dalších sto dvacet a z oděvu udělal plachtu."
place.gilgamesh_epic_tablet_11: "Hliněná tabulka: Epos o Gilgamešovi (11)"
knowledge.gilgamesh_epic_tablet_11.title: "Epos o Gilgamešovi, tabulka XI: Utnapištim a potopa"
knowledge.gilgamesh_epic_tablet_11.text: "Utnapištim Gilgamešovi vyzradil tajemství: bohové seslali potopu a Ea ho varoval skrze rákosovou stěnu, aby postavil loď. Po bouři vypustil holubici, vlaštovku a havrana, a když se havran nevrátil, věděl, že země je suchá. Gilgameš neobstál ve zkoušce nespat šest dní a sedm nocí. Na rozloučenou mu Utnapištim dal rostlinu omlazení z mořského dna; Gilgameš se potopil a vynesl ji, ale když se koupal, odnesl ji had."
place.gilgamesh_epic_tablet_12: "Hliněná tabulka: Epos o Gilgamešovi (12)"
knowledge.gilgamesh_epic_tablet_12.title: "Epos o Gilgamešovi, tabulka XII: Enkiduův stín"
knowledge.gilgamesh_epic_tablet_12.text: "Poslední tabulka je pozdější dodatek v sumerském duchu: Gilgameš nechal míč a kladívko, pukku a mekku, spadnout do podsvětí a plakal; Enkidu nabídl, že je přinese, a Gilgameš mu řekl, jak se mezi mrtvými chovat. Enkidu udělal opak všeho a podsvětí ho zadrželo. Pak Gilgameš prosil bohy a Enkiduův stín vystoupil dírou v zemi, aby mu pověděl, jak se mrtvým vede: muž s mnoha syny se má lépe než muž bez nich a ten, kdo nemá nikoho, kdo by mu nalil, je na tom nejhůř."
achievement.twelve_tablets.title: "Čtenář dvanácti tabulek"
achievement.twelve_tablets.description: "Najdi a přečti všech dvanáct hliněných tabulek eposu o Gilgamešovi, na místech, kde se příběh odehrál."
place.etana_tablet_1: "Hliněná tabulka: Legenda o Etanovi (1)"
knowledge.etana_tablet_1.title: "Legenda o Etanovi, tabulka I: královská moc v Kiši"
knowledge.etana_tablet_1.text: "Když královská moc sestoupila z nebe, sestoupila do Kiše a bohové položili její základy. Etana, pastýř, byl jedním z prvních králů a Seznam králů o něm říká, že vystoupil na nebe a shromáždil všechny země. Etana však neměl dědice, plakal před Šamašem a prosil ho o rostlinu zrození."
place.etana_tablet_2: "Hliněná tabulka: Legenda o Etanovi (2)"
knowledge.etana_tablet_2.title: "Legenda o Etanovi, tabulka II: orel a had"
knowledge.etana_tablet_2.text: "Na stromě hnízdil nahoře orel a dole had a přísahali při Šamašovi, že se podělí o potravu a neublíží mláďatům toho druhého. Orel přísahu porušil a snědl hadí mláďata. Had plakal před Šamašem a ten mu poradil, aby se ukryl v mršině divokého býka; když orel přiletěl žrát, had ho chytil, vyškubal mu křídla a hodil ho do jámy, aby zemřel."
place.etana_tablet_3: "Hliněná tabulka: Legenda o Etanovi (3)"
knowledge.etana_tablet_3.title: "Legenda o Etanovi, tabulka III: let do nebe"
knowledge.etana_tablet_3.text: "Šamaš poslal Etanu k jámě. Etana orla ošetřoval, dokud nenabyl sil, a orel nabídl, že ho ponese na nebe Anovo pro rostlinu zrození. Vznesli se a země se zmenšila na pole, na zahradu a pak na nic; Etanovi selhala odvaha a spadli. Při druhém letu se držel pevně a došli k bráně Anově. Tam našel rostlinu a narodil se mu syn Balih."
achievement.etana_tablets.title: "Jezdec na orlu"
achievement.etana_tablets.description: "Najdi a přečti všechny tři hliněné tabulky legendy o Etanovi v Kiši."
place.adapa_tablet_1: "Hliněná tabulka: Mýtus o Adapovi (1)"
knowledge.adapa_tablet_1.title: "Mýtus o Adapovi, tabulka I: křídlo jižního větru"
knowledge.adapa_tablet_1.text: "Adapa byl kněz v Eině chrámu v Eridu, mudrc, jemuž Ea dal velkou moudrost, ale ne život bez konce. Jednoho dne šel na ryby a jižní vítr mu převrhl loď. Adapa ho proklel a zlomil mu křídlo a vítr sedm dní nevál. Anu se o tom dozvěděl a předvolal Adapu na nebe, aby se zodpovídal."
place.adapa_tablet_2: "Hliněná tabulka: Mýtus o Adapovi (2)"
knowledge.adapa_tablet_2.title: "Mýtus o Adapovi, tabulka II: chléb života"
knowledge.adapa_tablet_2.text: "Ea Adapovi poradil: obleč smutek, získej oba bohy u brány nebe, Dumuziho a Gizzidu, a nic tam nejez ani nepij, neboť by tě to zabilo. Adapa udělal, co mu bylo řečeno, a strážcům brány řekl, že truchlí pro ně, kteří zmizeli ze země. Anu se dojal a nabídl mu chléb a vodu života; Adapa odmítl, jak mu Ea nařídil. Anu se zasmál: „Proč, Adapo, jsi nejedl? Teď nebudeš žít navěky.“ Adapa se vrátil domů a s ním šla nemoc. Konec tabulky se nedochoval."
achievement.adapa_tablets.title: "Lámač jižního větru"
achievement.adapa_tablets.description: "Najdi a přečti obě hliněné tabulky mýtu o Adapovi, v Eridu a v Uruku."
place.dilmun_tablet_1: "Hliněná tabulka: Enki a Ninhursag (1)"
knowledge.dilmun_tablet_1.title: "Enki a Ninhursag, tabulka I: Dilmun a dcery"
knowledge.dilmun_tablet_1.text: "Dilmun byla čistá země, ale neměla sladkou vodu. Ninhursag naříkala a Enki dal sluneční bohu Utuovi přinést vodu ze země; země zezelenala a stala se mokřinou a obchodním přístavem. Enki ležel s Ninhursag a měli dceru Ninsar; ležel s Ninsar a ta porodila Ninkurru; ležel s Ninkurrou a ta porodila Uttu, paní tkaní."
place.dilmun_tablet_2: "Hliněná tabulka: Enki a Ninhursag (2)"
knowledge.dilmun_tablet_2.title: "Enki a Ninhursag, tabulka II: osm rostlin"
knowledge.dilmun_tablet_2.text: "Ninhursag Uttě poradila, jak se Enkimu vyhnout, ale Enki ji vzal i tak a Ninhursag z ní jeho semeno vyňala a zasela do země: vyrostlo osm rostlin. Enki je snědl. Ninhursag ho proklela: „Nepodívám se na tebe okem života, dokud nezemřeš.“ Bohové se zalekli a liška přivedla Ninhursag zpět za slib slávy. Posadila Enkiho vedle sebe a ptala se, kde ho bolí, a pro každou bolavou část porodila boha, který ji uzdravil."
achievement.dilmun_tablets.title: "Zahradník Dilmunu"
achievement.dilmun_tablets.description: "Najdi a přečti obě hliněné tabulky o Enkim a Ninhursag, v Eridu a v Adabu."
place.nergal_tablet_1: "Hliněná tabulka: Nergal a Ereškigal (1)"
knowledge.nergal_tablet_1.title: "Nergal a Ereškigal, tabulka I: hostina bohů"
knowledge.nergal_tablet_1.text: "Bohové uspořádali na nebi hostinu a Ereškigal nemohla vystoupit z podsvětí; poslala vezíra Namtara pro svůj podíl. Když Namtar vešel, všichni bohové povstali, jen Nergal zůstal sedět. Namtar sestoupil a řekl to své královně a Ereškigal žádala, aby jí byl Nergal poslán. Nergal měl kult v Nippuru, Uruku, Larse a Uru a jeho hlavní chrám E‑meslam stál v Kutě."
place.nergal_tablet_2: "Hliněná tabulka: Nergal a Ereškigal (2)"
knowledge.nergal_tablet_2.title: "Nergal a Ereškigal, tabulka II: sestup a svatba"
knowledge.nergal_tablet_2.text: "V amarnské tabulce dal Ea Nergalovi čtrnáct pomocníků pro čtrnáct otvorů podsvětí; delší asyrské vyprávění přidává Eaovo varování, aby si tam nesedal, nejedl, nepil a nemyl se. Nergal vtrhl do paláce, chytil Ereškigal za vlasy, vlekl ji z trůnu a zvedl sekeru. Zvolala: „Nezabíjej mě! Buď mým mužem a vezmi si královskou moc nad širou zemí.“ Políbil ji a setřel jí slzy. V asyrské verzi u ní zůstane, odejde a vrátí se, když truchlí. Obě verze končí jinak a výklad svatby je sporný."
achievement.nergal_tablets.title: "Ženich podsvětí"
achievement.nergal_tablets.description: "Najdi a přečti obě hliněné tabulky o Nergalovi a Ereškigal, v Nippuru a v Larse."
achievement.keeper_of_legends.title: "Strážce legend"
achievement.keeper_of_legends.description: "Přečti každou hliněnou tabulku každé legendy: Atrachasíse, Enúma eliš, Ištařin sestup, epos o Gilgamešovi, Etanu, Adapu, Enkiho a Ninhursag a Nergala a Ereškigal."
