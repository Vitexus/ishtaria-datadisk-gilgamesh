achievement.seven_tablets.title: "Přednášeč Akitu"
achievement.seven_tablets.description: "Najdi a přečti všech sedm hliněných tabulek Enúma eliš, eposu, který chrámy hrály o novoročním svátku: v Eridu, Nippuru, Kiši, Babylonu (dvakrát), Uruku a Aššuru."
knowledge.enuma_elish_tablet.credit: "Render vlastního modelu datadisku (CC BY-SA 4.0). Znaky písmem Noto Sans Cuneiform (SIL Open Font License)."
knowledge.enuma_elish_tablet_1.title: "Enúma eliš, tabulka I: Apsú, Tiamat a zrození Marduka"
knowledge.enuma_elish_tablet_1.text: "„Když nahoře“ nebe a země ještě neměly jména, ležely jen sladký Apsú a slaná Tiamat smíšeni v jedné vodě. Z nich se zrodili bohové, Lahmu a Lahamu, Anšar a Kišar, Anu a Ea, nejmoudřejší ze všech. Mladí bohové hlučeli a Apsú neměl pokoj; se svým vezírem Mummuem se rozhodl je zničit, ačkoli Tiamat se ptala, proč mají zničit, co sami stvořili. Ea se to dozvěděl, uspal Apsúa kouzlem a zabil ho a postavil si dům na vodách mrtvého boha, jako v Eridu. Tam Ea a Damkina zplodili Marduka. Rozhořčená Tiamat shromáždila příšery a dala Kinguovi Tabulku osudů."
knowledge.enuma_elish_tablet_2.title: "Enúma eliš, tabulka II: bohové nemají bojovníka"
knowledge.enuma_elish_tablet_2.text: "Ea varoval bohy, že Tiamat se chystá k boji. Anšar poslal za ní Anua, ale Anu se vrátil; mezi staršími bohy nebyl nikdo, kdo by se odvážil. Pak Anšar jmenoval Marduka a Marduk souhlasil, ale za cenu: ať se bohové sejdou a jeho slovo ať rozhoduje o osudech. Tabulka leží v Nippuru, protože epos přejímá nippurskou teologii: Marduk zde zaujímá místo Enlila, krále bohů, a jeho bojovného syna Ninurty. Většina badatelů klade vznik Enúma eliš kolem 12. století př. n. l., dlouho po době Gilgameše."
knowledge.enuma_elish_tablet_3.title: "Enúma eliš, tabulka III: hostina a královská moc"
knowledge.enuma_elish_tablet_3.text: "Anšar poslal vezíra Gagu k Lahmuovi a Lahamě a ke starším bohům se zprávou. Zaplakali, pak se sešli, jedli a pili, až se rozveselili, a určili Mardukův osud. Sumerové říkali, že královská moc sestoupila z nebe nejdřív v Eridu a po potopě v Kiši; zde ji bohové dávají mladšímu bohu, aby bojoval za všechny."
knowledge.enuma_elish_tablet_4.title: "Enúma eliš, tabulka IV: Marduk a Tiamat"
knowledge.enuma_elish_tablet_4.text: "Bohové postavili Mardukovi trůn a zkoušeli jeho slovo na plátně: promluvil a plátno zmizelo, promluvil znovu a bylo celé. „Marduk je král!“ Vzal luk, kyj a blesk, naplnil tělo plamenem a rozprostřel síť, kterou drželo čtyři větry, a za sebou sedm dalších větrů. Tiamat a Marduk se utkali v souboji; vehnal jí do otevřených úst Zlý vítr a šíp jí rozťal srdce. Spoutal Kingua, vzal Tabulku osudů a zapečetil ji na své hrudi, a Tiamat rozpůlil jako škeb: jedna půle se stala střechou nebe."
knowledge.enuma_elish_tablet_5.title: "Enúma eliš, tabulka V: nebe, měsíc a řeky"
knowledge.enuma_elish_tablet_5.text: "Z těla Tiamat Marduk uspořádal svět. Postavil hvězdy do souhvězdí, po třech na každý z dvanácti měsíců, a určil stanice Nebiru, Enlila a Eay. Měsíci dal vládu nad nocí, s rohy, jimiž se počítají dny měsíce. Z jejích očí podle tradice, kterou epos sleduje, vytryskl Tigris a Eufrat. Je to nejméně dochovaná tabulka. Uruk je pro ni vhodné místo: jeho učenci vedli záznamy o nebi, které podle eposu Marduk uspořádal."
knowledge.enuma_elish_tablet_6.title: "Enúma eliš, tabulka VI: lidstvo a Babylon"
knowledge.enuma_elish_tablet_6.text: "Marduk, veden tím, co mu vložil do srdce Ea, chtěl stvořit lidstvo ve službě bohům. Shromáždění se ptalo, kdo způsobil válku, a odpověď zněla Kingu; svázali ho, otevřeli mu žíly a Ea z jeho krve stvořil člověka a osvobodil bohy od práce. Marduk rozdělil bohy na dvě družiny nahoře a dole a vděční bohové postavili Babylon a v něm Esagilu, dům Mardukův, a celý rok vyráběli cihly. Hodovali a Marduk dostal první jména. Tuto část zpívali o Akitu, novoročním svátku, kdy se epos přednášel v chrámu a božský obraz vycházel v průvodu."
knowledge.enuma_elish_tablet_7.title: "Enúma eliš, tabulka VII: padesát jmen"
knowledge.enuma_elish_tablet_7.text: "Poslední tabulka dává Mardukovi zbytek jeho padesáti jmen, čísla Enlilova, a každé jméno o bohu něco říká: ten, kdo zasel pole, kdo vládne bouři, kdo soudí. I staří bohové, Enlil, Ea a Adad, se stávají podobami Marduka. Nejstarší opisy eposu pocházejí z Aššuru z 9. století př. n. l. a Asyřané tam místo Marduka psali boha Aššura; nejvíc tabulek se našlo v knihovně v Ninive. Tabulka, která zpívala slávu Babylonu, tak putovala k jeho soupeřům."

# Šest tabulek Ištařina sestupu (places/ishtar_descent_tablets.yaml). Texty legendu převyprávějí vlastními slovy.
