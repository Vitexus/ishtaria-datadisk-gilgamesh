npc.crowd_priest_minor: Mladší kněz
npc.crowd_priest_minor.bio: "A young priest of the Eanna precinct."

place.uruk_smithy: Kovářská dílna
place.uruk_pottery: Hrnčířská dílna

npc.smith: Kovář
npc.smith.bio: "Kovář z jihozápadní ulice. V peci taví měď, v milíři pálí dřevěné uhlí a do hliněných forem odlévá meče. Na kožené zástěře má saze a v ruce čerstvou čepel."
npc.potter_tablet: Hrnčíř tabulek
npc.potter_tablet.bio: "Hrnčíř, který tvaruje nádoby i hliněné tabulky, na které město píše. Hlína až k loktům, v rukou vlhká tabulka a rákosové rydlo."
npc.tablet_bearer: Sluha
npc.tablet_bearer.bio: "Sluha z hrnčířské dílny. V koši nosí nepopsané hliněné tabulky do chrámu a na tržiště."
npc.market_scribe: Písař
npc.market_scribe.bio: "Písař, který na hliněné tabulky přinesené sluhy od hrnčířů zapisuje účty a oběti."
npc.tablet_merchant: Kupec
npc.tablet_merchant.bio: "Kupec z velkého tržiště. Na hliněné tabulky píše, co koupil a co prodal, rydlo v ruce."
npc.writing_priest: Kněz
npc.writing_priest.bio: "Kněz z Eanny. Na hliněné tabulky vynesené z hrnčířských dílen zapisuje oběti."

smith.greet: "Pozor na pec. Měď teče a v formě tuhne meč."
smith.ask_furnace: Zeptej se na pec
smith.ask_sword: Zeptej se na meče
smith.leave: Nechám tě u ohně.
smith.furnace: "Do pece jde ruda a dřevěné uhlí a milíř vedle dvora pálí dřevo na uhlí. Bez toho ohně není měď a bez mědi není čepel."
smith.sword: "Meče odlévám, nekuju je ze vzduchu. Forma je z hlíny, kov je měď a čepel chladne na lavici, zatímco se lije další."

potter.ask_tablets: Zeptej se na hliněné tabulky
potter.tablets: "Džbány jsou pro dům a pro chrám. Tabulky jsou pro slova. Řežu je z téže říční hlíny a sluhové je v koších odnášejí do Eanny a na tržiště, kde na ně píší písaři, kupci a kněží."

tablet_bearer.greet: "Ustup. Koš je plný tabulek a ještě jsou měkké."
tablet_bearer.ask_tablets: Zeptej se, kam je neseš
tablet_bearer.leave: Jen jdi.
tablet_bearer.tablets: "Z hrnčířské dílny do chrámu a druhý koš na tržiště. Píší na ně písaři, kupci a kněží. Já je jen nosím."

tablet_writer.greet: "Čerstvá tabulka, ještě teplá z hrnčířské dílny. Dej mi chvíli a slova budou v hlíně."
tablet_writer.ask_write: Zeptej se, co píšeš
tablet_writer.leave: Nerozmažu ti hlínu.
tablet_writer.write: "Písaři píší oběti, kupci píší, co se koupilo a prodalo, a my kněží píšeme, co bylo dáno bohům. Sluhové nosí tabulky v koších. Hlína si pamatuje ruku, která ji stlačila."
