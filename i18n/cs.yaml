# Lore položky
lore.uruk.title: Uruk
lore.uruk: >
  Velké město Uruk, kterému vládne Gilgameš. Jeho mohutné hradby postavil sám král,
  přičemž chrám Eanna pro Anu a chrám Ištar jsou jeho korunní klenoty. Město, které
  Gilgameš vybudoval, stojí jako svědectví jeho moci a vize.

lore.gilgamesh.title: Gilgameš
lore.gilgamesh: >
  Gilgameš, král Uruku, ze dvou třetin bůh a z jedné třetiny člověk. Stvořený bohy
  s dokonalou krásou a silou. Postavil hradby Uruku a po smrti svého milovaného přítele
  Enkidu hledal věčný život. První hrdina světa.

lore.enkidu.title: Enkidu
lore.enkidu: >
  Enkidu, divoký muž stvořený z hlíny bohyní Aruru. Žil mezi zvířaty, dokud ho
  nezkrotila chrámová kněžka Šamchat. Stal se Gilgamešovým rovným a věrným druhem,
  a spolu čelili největším výzvám své doby.

lore.humbaba.title: Humbaba
lore.humbaba: >
  Humbaba, strážce Cedrového lesa. Pověřený Enlilem, aby chránil posvátné stromy,
  byl hroznou postavou se sedminásobnými terory. Jeho řev byl jako bouře, jeho dech
  jako oheň a jeho tlama byla samotná smrt. Porazen Gilgamešem a Enkidem.

lore.ishtar.title: Ištar
lore.ishtar: >
  Ištar, bohyně lásky a války, patronka Uruku. Pyšná a vášnivá, nabízí jak extázi,
  tak zkázu. Když Gilgameš odmítl její námluvy, vyslala Nebeského býka, aby ho potrestala.

lore.bull_of_heaven.title: Nebeský býk
lore.bull_of_heaven: >
  Božské zvíře vyslané Ištar, aby potrestalo Gilgameše za odmítnutí. Obrovský býk
  přinášející zkázu Uruku. Byl poražen Gilgamešem a Enkidem, ale jeho smrt přinesla
  hněv bohů.

lore.great_flood.title: Velká potopa
lore.great_flood: >
  Velká potopa vyslaná bohy, aby zničila veškerý život. Utnapištim, varovaný Eou,
  postavil velkou loď a přežil se svou rodinou a zvířaty. Za to mu bohy udělily věčný život.
  Jeho příběh je vyprávěn Gilgamešovi v eposu.

lore.utnapishtim.title: Utnapištim
lore.utnapishtim: >
  Utnapištim, jediný přeživší Velké potopy. On a jeho manželka obdrželi od bohů věčný
  život a nyní žijí za Vodami smrti. Učí Gilgameše tvrdé pravdě: že smrt je osudem všech lidí.

lore.mount_mashu.title: Hora Mašu
lore.mount_mashu: >
  Hora Mašu, velká hora, kterou každou noc prochází slunce. Štírí muž střeží její bránu,
  a tunelem lze dospět do zahrady bohů.

lore.cedar_forest.title: Cedrový les
lore.cedar_forest: >
  Cedrový les, rozlehlý a prastarý les sahající se na deset tisíc lig v každém směru.
  Domov Humbaby, strážce ustanoveného Enlilem. Stromy jsou posvátné a nikdo je nesmí
  pokáčet, aniž by čelil strážcově hněvu.

# Mezopotamská architektura - Lore
lore.ziggurat_uruk.title: Zikkurat v Uruku
lore.ziggurat_uruk: >
  Velká terasa Uruku věnovaná Anuovi, bohu nebes — jedna vysoká plošina z hliněných
  cihel a nabíjené zeminy, ne věž mnoha stupňů jako pozdější zikkurat v Uru. Z jejího
  nádvoří korunuje město Bílý chrám; samotná výška z něj činí orientační bod za hradbami.

lore.ziggurat_anu.title: Zikkurat boha Anu
lore.ziggurat_anu: >
  Zikkurat boha Anu se zvedá asi dvanáct metrů nad plán: jedna masivní terasa s
  vodotěsným bitumenovým nádvořím a schodišti k Bílému chrámu. Kněží zde vykonávají
  rituály na počest otce bohů a z jeho výšky sledují nebesa.

lore.ziggurat_ishtar.title: Zikkurat bohyně Ištar
lore.ziggurat_ishtar: >
  Zikkurat bohyně Ištar, bohyně lásky a války. Na rozdíl od jediné terasy Anu je tato
  stupňovitá věž ozdobena lapis lazuli a karneolem, dary od milenců a válečníků
  hledajících přízeň bohyně. Chrám na jeho vrcholu je místo, kde Ištar přijímá oběti.

lore.ziggurat_ur.title: Velký zikkurat v Uru
lore.ziggurat_ur: >
  Etemenniguru, dům, jehož základ budí hrůzu — třístupňová věž Nanny v Uru, u paty
  čtyřiašedesát krát pětačtyřicet metrů. Hliněné jádro v pálených cihlách a bitumenu;
  tři schodiště stoupají po dlouhé straně k chrámu boha měsíce.

lore.ziggurat_eridu.title: Zikkurat v Eridu
lore.ziggurat_eridu: >
  Vyvýšený dům Enkiho v Eridu, nejstarším městě Královského seznamu. Nízká terasa
  z hliněných cihel s bitumenovým nádvořím, starší duchem než vysoké stupňovité věže pozdějších králů.

lore.ziggurat_nippur.title: Zikkurat v Nippuru
lore.ziggurat_nippur: >
  Ekur Enlila v Nippuru, náboženském středisku Sumeru. Jeho stupňovitá hmota se zvedá
  asi pětadvacet metrů nad plán — horský dům, kde se scházejí velcí bohové.

lore.white_temple.title: Bílý chrám
lore.white_temple: >
  Bílý chrám v Uruku, asi dvaadvacet krát sedmnáct metrů, jehož zbělené zdi se třpytí
  na bitumenovém nádvoří Anuovy terasy. Postavený podle kardinálních os této plošiny
  byl jedním z nejposvátnějších míst starověké Mezopotámie; bílá barva symbolizuje
  čistotu a božské světlo boha nebes.

lore.great_wall_uruk.title: Velká hradba Uruku
lore.great_wall_uruk: >
  Mohutné hradby Uruku, postavené samotným Gilgamešem. Dvě vnější hradby s
  vnitřními hradbami mezi nimi, vytvářející téměř nedobytnou pevnost. Hradby
  mají věže, vstupní budovy a masivní brány, které odolají jakémukoli útoku.

lore.hanging_gardens.title: Visuté zahrady v Uruku
lore.hanging_gardens: >
  Legendární visuté zahrady, o kterých se říká, že je postavil Gilgameš pro svou manželku.
  Terasovité zahrady stoupající jako zelená hora, s exotickými rostlinami a stromy
  dovezenými z dalekých zemí. Inženýrský zázrak starověkého světa.

