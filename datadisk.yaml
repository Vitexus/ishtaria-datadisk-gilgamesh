id: gilgamesh
version: 0.3.1
cover: media/cover/cover.jpg
# The client's loading bar draws this at its current value (the engine's default is a plain colour difference).
# Mirrored so that the figure faces the way the bar fills (left to right).
loading_marker: media/loading/faravahar.png
cover_music: logo
ambient_music: plains
# New players begin as the hunter/trapper of Tablet I (not yet Gilgameš). Later quests
# hand control to Šamḫat, Enkidu and Gilgameš (research/QUESTLINE.md). Nickname only —
# the look is fixed to the hunter model; the pack id is only the animation fallback.
player_character: survivors/survivorMaleB
player_model: media/models/hunter.glb
# Lives of one login are counted on the memorial with cuneiform numerals (𒁹 = 1, 𒌋 = 10; the first life has none, the
# second is 𒁹𒁹), where the engine counts with Roman ones. The font is the two signs cut from Noto Sans Cuneiform (OFL).
ordinal_numerals: sumerian
ordinal_font: media/fonts/noto-sans-cuneiform-numerals.ttf
# The land is drawn with the client's dry silt plain textures (Poly Haven, CC0), not the default green ground.
ground: alluvial
# Ground layers per biome over the alluvial set (the client's assets/terrain, Poly Haven CC0): base, alternate, accent.
ground_layers:
  lowland: [dry_mud_field_001, grass_path_2, mud_cracked_dry_03]
# Uruk of 2700 BCE: the sky of that year (the tilt of the axis 24.0 degrees against today's 23.44, and the star field turned
# 65 degrees by precession: Thuban was the pole star, not Polaris). 2700 BCE is the astronomical year -2699.
astronomy: {year: -2699}
# Three snares; the hunter quest opens at the water-hole. No aetherglass: it would put the starts of
# quests the hunter has not heard of yet on his map and compass. The goals of his begun quests show
# without it, and the places he was sent to stay on the map as known places (server markers API).
starting_items:
  - {item: snare, qty: 3}
auto_start_quests:
  - the_hunter_and_the_wild_man
# The houses of the towns and villages the generator builds in this world: the old-Persian houses of 0 A.D. like those of the
# old father's village (buildings/hunter_village.yaml), not the low-poly medieval kit. Native sizes are those of the models;
# the ranges are the plots of tools/build_village.py (inner ring of homes, larger houses of the outer ring).
settlement_houses:
  - {model: media/models/architecture/zeroad/pers_house_c.glb, native_m: [13.54, 16.25, 15.3], width_m: [11.4, 14.4], depth_m: [11.4, 14.4], height_m: [7.8, 9.6], sink_m: 3.6}
  - {model: media/models/architecture/zeroad/pers_house_d.glb, native_m: [13.49, 12.86, 13.54], width_m: [11.4, 14.4], depth_m: [11.4, 14.4], height_m: [7.8, 9.6], sink_m: 3.6}
  - {model: media/models/architecture/zeroad/pers_house_b.glb, native_m: [15.46, 18.9, 15.72], width_m: [14.4, 18], depth_m: [15, 18.6], height_m: [9.6, 12], sink_m: 3.6}
  - {model: media/models/architecture/zeroad/pers_house_a.glb, native_m: [16.59, 17.01, 16.05], width_m: [14.4, 18], depth_m: [15, 18.6], height_m: [9.6, 12], sink_m: 3.6}
name: Epic of Gilgamesh
description: >
  A story datadisk based on the ancient Mesopotamian Epic of Gilgamesh.
  Begin as the hunter by the steppe water-hole, then live the epic through Šamḫat,
  Enkidu and Gilgameš. Explore Uruk, the Cedar Forest and the road to Utnapishtim
  in a living Ishtaria world.
requires_ruleset: "1"
license: CC BY-SA 4.0
attribution: >
  Epic of Gilgamesh datadisk for Ishtaria (CC BY-SA 4.0). Epic text: public-domain
  N. K. Sanders translation (AINA). Models in Blender; fabrics/portraits via InvokeAI;
  Gilgamesh and Ishtar via Hyper3D Rodin. Uruk terrain: Copernicus DEM GLO-30 (ESA; modified Copernicus
  data 2026) and OpenStreetMap (ODbL); ED Euphrates and planet rasters: research/LANDSCAPE.md
  and WORLD.md (ETOPO 2022, NOAA, public domain). Rivers (rivers/): Natural Earth (public domain) for the
  courses above Hit and Mosul, HydroRIVERS v1.0 (Lehner and Grill 2013, hydrosheds.org, CC BY 4.0 with the
  HydroSHEDS licence) for the tributaries and streams; Uruk's irrigation canals after a published figure of
  canals at a barrage on the Euphrates (research/RIVER_NETWORK.md). Soundtrack: original gish-gudi/zurna
  synthesis with Gilgamesh leitmotif and sectioned timelines (tools/compose_music.py)
  plus CC0 loops in tools/music-samples/; place themes from 0 A.D. (Wildfire Games,
  CC BY-SA 3.0 — media/music/License-zeroad.txt).
rating: teen
languages: [en, cs]

# The world this disk generates is the Early Dynastic Earth, not a procedural planet:
# real continent outlines, real heights, and both rivers running into the Persian Gulf
# as it was in the time of the Epic. `ishtaria-server-init` and `ishtaria-admin` render the
# world heightmap from these rasters (`ishtaria-worldgen --earth`) instead of the noise.
world:
  terrain:
    heightmap: media/world/height.pgm
    water: media/world/water.pgm


