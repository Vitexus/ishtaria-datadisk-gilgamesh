id: gilgamesh
version: 0.2.1
cover: media/cover/cover.jpg
name: Epic of Gilgamesh
description: >
  A story datadisk based on the ancient Mesopotamian Epic of Gilgamesh.
  Explore the legendary city of Uruk, journey to the Cedar Forest to face Humbaba,
  and seek the secret of eternal life. Experience the world's oldest surviving epic
  in a living Ishtaria world. Features 20 historically accurate character portraits
  and 10 Mesopotamian architecture 3D models.
requires_ruleset: "1"
license: CC BY-SA 4.0
attribution: >
  Epic of Gilgamesh datadisk for Ishtaria. Based on the public domain translation
  by N. K. Sanders (Assyrian International News Agency). All original content
  is CC BY-SA 4.0. The Epic of Gilgamesh text is in the public domain.
  Character models built in Blender (models-src/) with fabric textures generated by InvokeAI
  (RealVisXL_V4.0); portraits are renders of these models.
  3D models created using Blender 4.3.2.
rating: teen
languages: [en, cs]


