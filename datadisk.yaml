id: gilgamesh
version: 0.2.6
cover: media/cover/cover.jpg
cover_music: logo
ambient_music: plains
# Players are Gilgamesh, king of Uruk (the look of his NPC); they choose only their nickname.
player_character: protagonists/criminalMaleA
player_model: media/models/gilgamesh.glb
# Two thirds god: taller than men (an Anunnaki giant) and far harder to hurt by a fall.
player_body: {height_m: 3.0, toughness: 1.5}
name: Epic of Gilgamesh
description: >
  A story datadisk based on the ancient Mesopotamian Epic of Gilgamesh.
  Explore the legendary city of Uruk, journey to the Cedar Forest to face Humbaba,
  and seek the secret of eternal life. Experience the world's oldest surviving epic
  in a living Ishtaria world. Features 20 historically accurate character portraits
  and 10 Mesopotamian architecture 3D models.
requires_ruleset: "1"
license: CC BY-SA 4.0
attribution: >
  Epic of Gilgamesh datadisk for Ishtaria (CC BY-SA 4.0). Epic text: public-domain
  N. K. Sanders translation (AINA). Models in Blender; fabrics/portraits via InvokeAI;
  Ishtar via Hyper3D Rodin. Uruk terrain: Copernicus DEM GLO-30 (ESA; modified Copernicus
  data 2026) and OpenStreetMap (ODbL); ED Euphrates and planet rasters: research/LANDSCAPE.md
  and WORLD.md (ETOPO 2022, NOAA, public domain). Soundtrack: original gish-gudi/zurna
  synthesis (tools/compose_music.py) plus CC0 loops in tools/music-samples/.
rating: teen
languages: [en, cs]

# The world this disk generates is the Early Dynastic Earth, not a procedural planet:
# real continent outlines, real heights, and both rivers running into the Persian Gulf
# as it was in the time of the Epic. `ishtaria-server-init` and `ishtaria-admin` render the
# world heightmap from these rasters (`ishtaria-worldgen --earth`) instead of the noise.
world:
  terrain:
    heightmap: media/world/height.pgm
    water: media/world/water.pgm


