# The archaeologically attested cities of the world in the Epic's time (c. 2700 BCE, Early Dynastic II),
# beyond Uruk and the story places of the Epic: every settlement whose existence around 2700 BCE has
# archaeological evidence and whose site is known and located, from Sumer to Peru. Sources, dating
# evidence and coordinate provenance for each city: research/ANCIENT_CITIES.md (web sources, October 2026).
#
# Each place is pinned to the historical site itself (`geo`): history has already decided where they
# stand, so they carry no `requires` advice (the server's biomes and climate are not of 2700 BCE) and
# no generated town - the medieval Kenney houses and walls of the generated scenery do not belong to
# the Bronze Age, the same decision places/uruk.yaml makes for Uruk. The base map keeps their tells
# dry: the block coarseness of the rasters is corrected by tools/build_world_map.py (SHORE_SITES,
# DRY_DEPRESSIONS), and its checks fail when any of these cities lands in the sea.

# Sumer and its neighbours in the alluvium.

- id: ur
  kind: city
  name_key: place.ur
  radius_m: 200
  music: land_between_rivers
  music_radius_m: 800
  # The royal city of Sumer (Tell el-Muqayyar), the home of the Royal Cemetery a few
  # generations after the Epic; an Early Dynastic city on the Euphrates bank.
  geo: {latitude_deg: 30.9626, longitude_deg: 46.1030}
  # 0 A.D. Persian temple as a temporary silhouette (anachronistic; not Kenney town fabric).
  structure:
    model: media/models/architecture/zeroad/pers_temple.glb
    visible_m: 800

- id: eridu
  kind: city
  name_key: place.eridu
  radius_m: 150
