# The clay tablets of five more legends (research/LEGENDS.md), laid like the tablets of the Atra-Hasis epic
# (places/atrahasis_tablets.yaml): the Epic of Gilgamesh (twelve, where the story happens), Etana (Kish), Adapa
# (Eridu and the Anu ziggurat in Uruk), Enki and Ninhursag (Eridu, Adab), Nergal and Ereshkigal (Nippur, Larsa).
# Reading all of a legend's tablets earns its achievement (`read_all`), and all of them together `keeper_of_legends`.
# Surveyed points (`tolerance_m: 0`); not yet checked against the buildings of the cities they stand in.

- id: gilgamesh_epic_tablet_1
  kind: landmark
  name_key: place.gilgamesh_epic_tablet_1
  parent: hunter_waterhole
  radius_m: 1
  locate: {from: hunter_waterhole, bearing_deg: 70, distance_m: 15, tolerance_m: 0}
  structure:
    model: media/models/architecture/gilgamesh_epic_tablet_1.glb
    visible_m: 80
    about: gilgamesh_epic_tablet_1
  requires:
    max_slope_deg: 30

