# Ziggurats at cities outside the Uruk precinct and Babylon.
# Catalog, attestation and clone policy: research/ZIGGURATS.md.
# Distinct models: ur, eridu, nippur. Clones reuse an existing glb with a different yaw.

# --- Distinct (documented plan or published dimensions) ---

- id: ziggurat_of_ur
  kind: building
  name_key: place.ziggurat_ur
  parent: ur
  radius_m: 40
  # Etemenniguru (Nanna): Woolley 64 x 45 m, three stages; stairs face -Y in the model.
  locate: {from: ur, bearing_deg: 0, distance_m: 40, tolerance_m: 0}
  structure:
    model: media/models/architecture/ziggurat_ur.glb
    ground_m: [0, 38]
    yaw_deg: 35
    visible_m: 4000
  music: temple
  music_radius_m: 100
  requires:
    max_slope_deg: 8

