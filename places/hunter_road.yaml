# The road of the hunter's village to Uruk (trails/hunter_road.yaml lays its stepping stones): two waypoints on the way to the
# nearest gate of the city's wall, the north-west gate (places/uruk_roads.yaml). The legs are at most 3 km long (the server's
# limit of one trail); the waypoints lie on the straight line from the village to the gate (tools/build_roads.py moves them
# there) and are moved to the nearest suitable ground. The old landing on the river north of the city is gone: the boat the
# hunter rows lies at the quay of Uruk (places/uruk_river.yaml), at the gate the river comes nearest to.

- id: hunter_road_1
  kind: landmark
  name_key: place.hunter_road
  radius_m: 10
  locate: {from: hunter_village, bearing_deg: 126.7, distance_m: 2427, tolerance_m: 250}
  requires:
    biome: [grassland, lowland]
    height_m: {min: -5, max: 250}
    max_slope_deg: 15

- id: hunter_road_2
  kind: landmark
  name_key: place.hunter_road
  radius_m: 10
  locate: {from: hunter_village, bearing_deg: 126.7, distance_m: 4855, tolerance_m: 250}
  requires:
    biome: [grassland, lowland]
    height_m: {min: -5, max: 250}
    max_slope_deg: 15

# The water sellers of the road: a carter with his jars waits beside the way where each leg of it ends (the hunter's
# water runs out on the 7 km to the river). Each stands a few metres off the track so that it is no obstacle.
- id: hunter_road_water_1
  kind: landmark
  name_key: place.hunter_road_water
  radius_m: 4
  locate: {from: hunter_road_1, bearing_deg: 20, distance_m: 10, tolerance_m: 14}
  requires:
    max_slope_deg: 25

- id: hunter_road_water_2
  kind: landmark
  name_key: place.hunter_road_water
  radius_m: 4
  locate: {from: hunter_road_2, bearing_deg: 200, distance_m: 10, tolerance_m: 14}
  requires:
    max_slope_deg: 25
