# 0 A.D. Ishtar Gate mesh and Persian chariots (CC BY-SA) — anachronistic ornaments.
# Uruk already has its own wall/gate geometry; the Ishtar mesh stands as a second silhouette
# at the surveyed city_gate and again beside Etemenanki at Babylon.

- id: uruk_ishtar_gate_ornament
  kind: landmark
  name_key: place.ishtar_gate_ornament
  parent: city_gate
  radius_m: 10
  locate: {from: city_gate, bearing_deg: 180, distance_m: 25, tolerance_m: 0}
  structure:
    model: media/models/architecture/zeroad/pers_ishtar.glb
    yaw_deg: 0
    visible_m: 1200
  requires:
    max_slope_deg: 45

- id: babylon_ishtar_gate
