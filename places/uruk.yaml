# Uruk and surrounding locations from the Epic of Gilgamesh

- id: uruk
  kind: city
  name_key: place.uruk
  radius_m: 200
  # No generated town: its medieval houses and walls (Kenney Fantasy Town, Castle kits) do not belong to Uruk of 2700 BCE.
  # The walls of glazed blue brick are built to match the Ishtar Gate, which is their entrance (models-src/architecture/
  # uruk_walls.py). The model's origin is the middle of the gate; the middle of the walled area lies 232 m behind it.
  structure:
    model: media/models/architecture/uruk_walls.glb
    offset_m: [0, 232]
    visible_m: 1500
  spawn: false
  requires:
    biome: [grassland]
    height_m: {min: 0, max: 200}
    max_slope_deg: 5

- id: uruk_wall
  kind: landmark
  name_key: place.uruk_wall
  parent: uruk
  radius_m: 50
  requires:
    biome: [grassland]
    max_slope_deg: 5

