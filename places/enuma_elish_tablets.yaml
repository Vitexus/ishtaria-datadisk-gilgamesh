# The seven clay tablets of Enuma Elish, "When on high", the Babylonian epic of creation (research/ENUMA_ELISH.md):
# the legend that was acted out in the temples at the New Year festival, Akitu, the Christmas of Mesopotamia. Each
# stands on a bench of sun-dried bricks in a city that suits its tablet (Eridu, Ea's shrine in the Apsu; Nippur, whose
# theology the epic borrows; Kish, the seat of kingship; Babylon twice, for the battle and for the building of Esagila;
# Uruk, whose scholars watched the sky; Assur, where the oldest copies come from). Standing at one the player
# presses E and reads its knowledge card; having read all seven earns `seven_tablets` (`read_all`). They are surveyed
# points (`tolerance_m: 0`) like the tablets of the Atra-Hasis epic (places/atrahasis_tablets.yaml).
# Enuma Elish is of the twelfth century BCE, far later than the disk's Early Dynastic time; the disk accepts such
# overlays (Babylon, the Achaemenid ancestors), as research/ENUMA_ELISH.md notes.

- id: enuma_elish_tablet_1
  kind: landmark
  name_key: place.enuma_elish_tablet_1
  parent: eridu
  radius_m: 1
  locate: {from: eridu, bearing_deg: 250, distance_m: 22, tolerance_m: 0}
  structure:
    model: media/models/architecture/enuma_elish_tablet_1.glb
    visible_m: 80
    about: enuma_elish_tablet_1
  requires:
    max_slope_deg: 30

