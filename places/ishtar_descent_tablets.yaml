# The six clay tablets of Ishtar's (Inanna's) Descent to the Netherworld (research/ISHTAR_DESCENT.md). The legend is told
# in two traditions, the Sumerian poem and the Akkadian one of Nineveh, and is not numbered in the sources, so the disk cuts
# it into six episodes and lays each where the story goes: in Uruk the leaving, the seven gates and the shepherd; in
# Nippur and Ur the gods who refuse to help (Enlil, Nanna-Sin); in Eridu the god (Enki, Ea) who does. Standing at
# one the player presses E and reads its knowledge card; having read all six earns `descent_tablets` (`read_all`).
# They are surveyed points (`tolerance_m: 0`), like the tablets of the Atra-Hasis epic (places/atrahasis_tablets.yaml).
# The three in Uruk stand near the Temple of Ishtar, near Eanna and on the pasture; not yet checked against the city's
# buildings.

- id: ishtar_descent_tablet_1
  kind: landmark
  name_key: place.ishtar_descent_tablet_1
  parent: ishtar_temple
  radius_m: 1
  locate: {from: ishtar_temple, bearing_deg: 160, distance_m: 30, tolerance_m: 0}
  structure:
    model: media/models/architecture/ishtar_descent_tablet_1.glb
    visible_m: 80
    about: ishtar_descent_tablet_1
  requires:
    max_slope_deg: 30

