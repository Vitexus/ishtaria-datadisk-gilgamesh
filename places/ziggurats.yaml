# Mesopotamian Architecture - Ziggurats and Temples
# Historical structures from ancient Uruk and Sumer

- id: ziggurat_of_uruk
  kind: building
  name_key: place.ziggurat_uruk
  parent: uruk
  radius_m: 60
  requires:
    max_slope_deg: 5

- id: ziggurat_of_anu
  kind: building
  name_key: place.ziggurat_anu
  parent: uruk
  radius_m: 20
  # The building itself is part of the model of the walls (places/uruk.yaml), on the surveyed terrace (OSM): 137 m east
  # and 201 m north of the middle of the site.
  locate: {from: uruk, bearing_deg: 34, distance_m: 244, tolerance_m: 12}
  requires:
    max_slope_deg: 5

- id: ziggurat_of_ishtar
  kind: building
  name_key: place.ziggurat_ishtar
  parent: uruk
  radius_m: 50
  requires:
    max_slope_deg: 5

- id: white_temple
  kind: building
  name_key: place.white_temple
  # The White Temple crowns the Anu ziggurat.
  parent: ziggurat_of_anu
  radius_m: 20
  locate: {from: ziggurat_of_anu, bearing_deg: 0, distance_m: 5, tolerance_m: 5}
  requires:
    max_slope_deg: 25

- id: great_wall_uruk
  kind: landmark
  name_key: place.great_wall_uruk
  parent: uruk
  radius_m: 20
  requires:
    max_slope_deg: 5

- id: hanging_gardens
  kind: landmark
  name_key: place.hanging_gardens
  parent: uruk_palace
  radius_m: 45
  requires:
    max_slope_deg: 5

- id: royal_tombs
  kind: building
  name_key: place.royal_tombs
  parent: uruk
  radius_m: 30
  requires:
    max_slope_deg: 5

- id: city_gate
  kind: building
  name_key: place.city_gate
  parent: uruk
  spawn: true
  radius_m: 10
  # New characters appear inside the Ishtar Gate, which stands 1263 m south of the middle of the site (the model of the
  # walls, places/uruk.yaml): 12 m inside it.
  locate: {from: uruk, bearing_deg: 178, distance_m: 1254, tolerance_m: 8}
