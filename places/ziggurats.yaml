# Mesopotamian Architecture - Ziggurats and Temples
# Historical structures from ancient Uruk and Sumer

- id: ziggurat_of_uruk
  kind: building
  name_key: place.ziggurat_uruk
  parent: uruk
  radius_m: 15
  # A spot in the court of the precinct between the terrace of Anu and the stepped tower of Ishtar (no model of its own).
  locate: {from: uruk, bearing_deg: 20.41, distance_m: 229.4, tolerance_m: 0}
  requires:
    max_slope_deg: 30

- id: ziggurat_of_anu
  kind: building
  name_key: place.ziggurat_anu
  parent: uruk
  radius_m: 20
  # The building itself is part of the model of the walls (places/uruk.yaml), on the surveyed terrace (OSM): 137 m east
  # and 201 m north of the middle of the site.
  locate: {from: uruk, bearing_deg: 34, distance_m: 244, tolerance_m: 0}
  requires:
    max_slope_deg: 5

- id: ziggurat_of_ishtar
  kind: building
  name_key: place.ziggurat_ishtar
  parent: uruk
  radius_m: 15
  # West of the stepped tower of Ishtar (whose model belongs to the place ishtar_temple).
  locate: {from: uruk, bearing_deg: 10.008, distance_m: 172.6, tolerance_m: 0}
  requires:
    max_slope_deg: 30

- id: white_temple
  kind: building
  name_key: place.white_temple
  # The White Temple crowns the Anu ziggurat.
  parent: ziggurat_of_anu
  radius_m: 20
  locate: {from: ziggurat_of_anu, bearing_deg: 0, distance_m: 5, tolerance_m: 0}
  requires:
    max_slope_deg: 25

