# Mesopotamian Architecture - Ziggurats and Temples
# Historical structures from ancient Uruk and Sumer

- id: ziggurat_of_uruk
  kind: building
  name_key: place.ziggurat_uruk
  parent: uruk
  radius_m: 60
  requires:
    max_slope_deg: 5

- id: ziggurat_of_anu
  kind: building
  name_key: place.ziggurat_anu
  parent: uruk
  radius_m: 55
  # The building itself is part of the model of the walls (places/uruk.yaml), on the surveyed terrace 137 m east and 201 m
  # north of the middle of the site. This place only lies somewhere within 140 m of the middle: a child place cannot be
  # put at a bearing (a narrower ring leaves no room among its siblings, whose radii exclude each other).
  requires:
    max_slope_deg: 5
    near:
      - {place: uruk, min_m: 0, max_m: 140}

