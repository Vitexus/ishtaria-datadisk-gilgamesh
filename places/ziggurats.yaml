- id: royal_tombs
  kind: building
  name_key: place.royal_tombs
  parent: uruk
  radius_m: 15
  # Behind the palace of Gilgamesh, outside its farm yard.
  locate: {from: uruk, bearing_deg: 44.132, distance_m: 555.6, tolerance_m: 0}
  requires:
    max_slope_deg: 30

- id: city_gate
  kind: building
  name_key: place.city_gate
  parent: uruk
  # Spawn moved to hunter_waterhole (Epic Tablet I): new players begin as the trapper.
  spawn: false
  radius_m: 10
  # Open ground 125 m before the Ishtar Gate (23 m beyond the end of its Processional Way).
  # Keep this place free of crowd NPCs so the approach is not ringed by townsfolk.
  locate: {from: uruk, bearing_deg: 181.024, distance_m: 1369.7, tolerance_m: 0}
  requires:
    max_slope_deg: 30

# Between spawn and the Ishtar Gate: caravans and the royal guard walk here, not on the spawn disk.
- id: processional_way
  kind: landmark
  name_key: place.processional_way
  parent: uruk
  radius_m: 40
  locate: {from: uruk, bearing_deg: 181.0, distance_m: 1280, tolerance_m: 0}
  requires:
    max_slope_deg: 30

