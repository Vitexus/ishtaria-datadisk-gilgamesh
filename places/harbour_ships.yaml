# Harbour ship and siege landmarks (0 A.D. Persian CC BY-SA meshes) — anachronistic
# silhouettes at coastal pins and a few military seats. Ships use structure.at_sea so
# they sit at mean sea level; siege rams and ice houses stay on terrain. Parent cities
# keep their dock or gate on the tell.

- id: byblos_bireme
  kind: landmark
  name_key: place.harbour_bireme
  parent: byblos
  radius_m: 8
  locate: {from: byblos, bearing_deg: 270, distance_m: 55, tolerance_m: 0}
  structure:
    model: media/models/architecture/zeroad/pers_bireme.glb
    yaw_deg: 0
    visible_m: 900
    at_sea: true
  requires:
    max_slope_deg: 45

