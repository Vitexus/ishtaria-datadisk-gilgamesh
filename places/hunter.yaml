# Hunter's steppe: water-hole and village of the old father (Epic SB I).
# Distances are playable (~12 km from Uruk ≈ a long trek); the epic's "third day"
# is the story beat for the return with Šamḫat, not a literal Earth walk time.

- id: hunter_waterhole
  kind: landmark
  name_key: place.hunter_waterhole
  radius_m: 80
  spawn: true
  # North-west of Uruk, outside the city tell, into the open steppe of the herd.
  # tolerance_m: 0 = surveyed point: Early Dynastic coarse cells mark the floodplain
  # as river, so a slope/biome search never settles; the epic still needs this spawn.
  locate: {from: uruk, bearing_deg: 310, distance_m: 12000, tolerance_m: 0}
  music: plains
  music_radius_m: 500
  # The water-hole is real water: a pond a few metres from the spawn (tools/build_waterhole.py). The coarse planet map
  # calls this floodplain "river" and let the hunter drink from dry ground; the patch makes the server and the client
  # agree on where the water is, so a hunter who steps in swims instead of walking on a dry-looking steppe.
  terrain:
    heightmap: media/terrain/hunter_waterhole_height.png
    water: media/terrain/hunter_waterhole_water.png
    extent_m: [400, 400]
    feather_m: 60
    visible_m: 600
  wildlife:
    radius_m: 900
    density: 3.0
    flora:
      - {id: nature.reed_clump, weight: 8}
      - {id: zeroad.reed_pond_lush, weight: 5}
      - {id: zeroad.reed_beach_a, weight: 4}
      - {id: zeroad.cattails, weight: 3}
      - {id: nature.plant_flatTall, weight: 5}
      - {id: nature.plant_flatShort, weight: 4}
      - {id: nature.plant_bushSmall, weight: 3}
      - {id: hyper3d.tamarisk, weight: 5}
      - {id: zeroad.tamarix_a, weight: 2}
      - {id: quaternius.bush_1, weight: 2}
    fauna:
      - {id: animal.gazelle, weight: 8}
      - {id: zeroad.gazelle, weight: 5}
      - {id: animal.onager, weight: 5}
      - {id: animal.deer, weight: 3}
      - {id: zeroad.deer, weight: 2}
      - {id: animal.goat, weight: 4}
      - {id: zeroad.goat, weight: 2}
      - {id: animal.sheep, weight: 3}
      - {id: zeroad.sheep, weight: 2}
      - {id: animal.fox, weight: 2}
      - {id: zeroad.fox, weight: 1}
      - {id: animal.wolf, weight: 2}
      - {id: zeroad.wolf, weight: 1}
      - {id: animal.lizard, weight: 2}
      - {id: animal.pigeon, weight: 2}
      - {id: animal.falcon, weight: 1}
      - {id: zeroad.hawk, weight: 1}
      - {id: zeroad.crow, weight: 1}
      - {id: zeroad.mastiff, weight: 1}
  requires:
    biome: [grassland, lowland]
    height_m: {min: -5, max: 250}
    max_slope_deg: 12

- id: hunter_village
  kind: landmark
  name_key: place.hunter_village
  radius_m: 40
  # Between the water-hole and Uruk: the old father's camp.
  locate: {from: hunter_waterhole, bearing_deg: 130, distance_m: 3500, tolerance_m: 0}
  requires:
    biome: [grassland, lowland]
    height_m: {min: -5, max: 250}
    max_slope_deg: 15
