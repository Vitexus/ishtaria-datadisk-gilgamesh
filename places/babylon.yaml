# Babylonian buildings as a fantasy element outside the walls of Uruk (Etemenanki is of c. 575 BCE, not of Gilgamesh's
# Uruk; see research/ZIGGURATS.md). The Ishtar Gate is the gate of the walls of Uruk itself (places/uruk.yaml).

- id: etemenanki
  kind: building
  name_key: place.etemenanki
  radius_m: 100
  music: cradle
  music_radius_m: 500
  structure:
    model: media/models/architecture/ziggurat_etemenanki.glb
    ground_m: [0, 78]   # the foot of the front stairs
    visible_m: 3000
  # Babylon lies 177 km north-west of Uruk (32.54 N 44.42 E against 31.32 N 45.64 E).
  locate: {from: uruk, bearing_deg: 320, distance_m: 177000, tolerance_m: 20000}
  requires:
    max_slope_deg: 6
