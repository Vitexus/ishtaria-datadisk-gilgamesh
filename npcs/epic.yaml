# Shamhat - Temple priestess of Inanna. After she brings Enkidu into Uruk she returns to
# the Ishtar ziggurat and walks a city circuit (temple → Eanna court → toward the market → back).
# During the road escort she follows the player instead (server override); this patrol resumes
# once the escort ends and the player is no longer hiding her as story_role.
- id: shamhat
  name_key: npc.shamhat
  place: ishtar_temple
  character: {pack: retro, skin: humanFemaleA, model: media/models/shamhat.glb}
  dialogue: shamhat
  portrait: media/portraits/shamhat.jpg
  bio_key: npc.shamhat.bio
  # Metres east and south of ishtar_temple: linger at the ziggurat, cross the Eanna court,
  # stroll toward the great market, then return home.
  movement:
    kind: patrol
    speed_m_s: 0.85
    pause_s: 14
    waypoints:
      - [0.0, 0.0]
      - [32.0, -32.0]
      - [-10.0, 130.0]
      - [-21.0, 260.0]
      - [-35.0, 400.0]
      - [20.0, 200.0]
      - [40.0, 60.0]
  tags: [priestess, temple]

