# Lady of Uruk Dialogue Tree
# Caste: noble

id: uruk_noblewoman
status: reviewed
start: greet

nodes:
  greet:
    text_key: uruk_noblewoman.greet
    choices:
      - {text_key: uruk_noblewoman.ask_a, goto: explain_a}
      - {text_key: uruk_noblewoman.ask_b, goto: explain_b}
      - {text_key: uruk_noblewoman.ask_brides, goto: explain_brides}
      - {text_key: uruk_noblewoman.leave}

  explain_a:
    text_key: uruk_noblewoman.a
    choices:
      - {text_key: uruk_noblewoman.ask_b, goto: explain_b}
      - {text_key: uruk_noblewoman.leave}

  explain_b:
    text_key: uruk_noblewoman.b
    choices:
      - {text_key: uruk_noblewoman.ask_a, goto: explain_a}
      - {text_key: uruk_noblewoman.leave}

  # Before the story has got there the answer leaves out what the player cannot know yet (no anachronism, no spoiler).
  explain_brides:
    branch:
      - {if: {any: [{quest_stage: {quest: shamhat_and_the_wild_man, stage: present_enkidu}}, {quest_stage: {quest: shamhat_and_the_wild_man, stage: shamhat_done}}]}, goto: explain_brides_known}
      - {goto: explain_brides_early}

  explain_brides_known:
    text_key: uruk_noblewoman.brides
    choices:
      - {text_key: uruk_noblewoman.leave}

  explain_brides_early:
    text_key: uruk_noblewoman.brides_early
    choices:
      - {text_key: uruk_noblewoman.leave}
