# Sacred Courtesan of Ishtar Dialogue Tree
# Caste: temple

id: uruk_temple_courtesan
status: reviewed
start: greet

nodes:
  greet:
    text_key: uruk_temple_courtesan.greet
    choices:
      - {text_key: uruk_temple_courtesan.ask_a, goto: explain_a}
      - {text_key: uruk_temple_courtesan.ask_b, goto: explain_b}
      - {text_key: uruk_temple_courtesan.leave}

  explain_a:
    text_key: uruk_temple_courtesan.a
    choices:
      - {text_key: uruk_temple_courtesan.ask_b, goto: explain_b}
      - {text_key: uruk_temple_courtesan.leave}

  # Before the story has got there the answer leaves out what the player cannot know yet (no anachronism, no spoiler).
  explain_b:
    branch:
      - {if: {any: [{quest_stage: {quest: shamhat_and_the_wild_man, stage: present_enkidu}}, {quest_stage: {quest: shamhat_and_the_wild_man, stage: shamhat_done}}]}, goto: explain_b_known}
      - {goto: explain_b_early}

  explain_b_known:
    text_key: uruk_temple_courtesan.b
    choices:
      - {text_key: uruk_temple_courtesan.ask_a, goto: explain_a}
      - {text_key: uruk_temple_courtesan.leave}

  explain_b_early:
    text_key: uruk_temple_courtesan.b_early
    choices:
      - {text_key: uruk_temple_courtesan.ask_a, goto: explain_a}
      - {text_key: uruk_temple_courtesan.leave}
