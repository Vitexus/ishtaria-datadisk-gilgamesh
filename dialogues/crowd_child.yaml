# Short greeting of the children of Uruk and of the village: they do not know where the king is.
id: crowd_child
status: reviewed
start: greet

nodes:
  greet:
    text_key: crowd.greet
    choices:
      - {text_key: crowd.ask_king, goto: say_king}
      - {text_key: crowd.reply, goto: reply}
      - {text_key: crowd.leave}

  reply:
    text_key: crowd.busy
    choices:
      - {text_key: crowd.leave}

  say_king:
    text_key: crowd.king_child
    choices:
      - {text_key: crowd.leave}
