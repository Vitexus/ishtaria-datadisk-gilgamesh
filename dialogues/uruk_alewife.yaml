# Ale-wife of Uruk Dialogue Tree
# Caste: burgher

id: uruk_alewife
status: reviewed
start: greet

nodes:
  greet:
    text_key: uruk_alewife.greet
    choices:
      - {text_key: uruk_alewife.ask_a, goto: explain_a}
      - {text_key: uruk_alewife.ask_b, goto: explain_b}
      - {text_key: uruk_alewife.ask_siduri, goto: say_siduri}
      - {text_key: uruk_alewife.leave}

  explain_a:
    text_key: uruk_alewife.a
    choices:
      - {text_key: uruk_alewife.ask_b, goto: explain_b}
      - {text_key: uruk_alewife.leave}

  # Before the story has got there the answer leaves out what the player cannot know yet (no anachronism, no spoiler).
  explain_b:
    branch:
      - {if: {any: [{quest_stage: {quest: enkidu_meets_gilgamesh, stage: become_brothers}}, {quest_stage: {quest: the_meeting_of_equals, stage: become_brothers}}]}, goto: explain_b_known}
      - {goto: explain_b_early}

  explain_b_known:
    text_key: uruk_alewife.b
    choices:
      - {text_key: uruk_alewife.ask_a, goto: explain_a}
      - {text_key: uruk_alewife.leave}

  explain_b_early:
    text_key: uruk_alewife.b_early
    choices:
      - {text_key: uruk_alewife.ask_a, goto: explain_a}
      - {text_key: uruk_alewife.leave}

  say_siduri:
    text_key: uruk_alewife.siduri
    choices:
      - {text_key: uruk_alewife.leave}
