      - {text_key: elder_tales_man.leave}

  akitu_now:
    text_key: elder_tales_man.akitu_now
    choices:
      - {text_key: elder_hint.ask, goto: where}
      - {text_key: elder_tales_man.leave}

  where:
    text_key: elder_hint.enuma_elish_tablet_3
    effects:
      - {reveal_places: [enuma_elish_tablet_3]}
