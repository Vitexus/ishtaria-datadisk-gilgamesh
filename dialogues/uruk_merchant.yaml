# Merchant of Uruk Dialogue Tree
# Wears colorful robe with balance scale

id: uruk_merchant
status: reviewed
start: greet

nodes:
  greet:
    text_key: uruk_merchant.greet
    choices:
      - text_key: uruk_merchant.ask_king
        if: {quest_stage: {quest: the_hunter_and_the_wild_man, stage: seek_gilgamesh}}
        goto: tell_king
      - {text_key: uruk_merchant.ask_goods, goto: explain_goods}
      - {text_key: uruk_merchant.ask_trade, goto: explain_trade}
      - {text_key: uruk_merchant.leave}

  explain_goods:
    text_key: uruk_merchant.goods
    choices:
      - {text_key: uruk_merchant.leave}

  explain_trade:
    text_key: uruk_merchant.trade
    choices:
      - {text_key: uruk_merchant.leave}

  # Where the king is found: the hunter who asks learns the way, and the palace is marked for him (the stage's guide).
  tell_king:
    text_key: uruk_merchant.king
    effects:
      - {set_stage: {quest: the_hunter_and_the_wild_man, stage: seek_king_palace}}
    choices:
      - {text_key: uruk_merchant.leave}
